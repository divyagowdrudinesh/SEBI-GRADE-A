<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEBI GA Flashcards — Jul 2026</title>
<style>
  :root {
    --ink: #1A2438;
    --paper: #EFE9DA;
    --card: #FBFAF6;
    --brass: #8C6B3F;
    --green: #3B6B4A;
    --rust: #A8482B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', Charter, serif;
    min-height: 100vh;
  }
  .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 18px 56px;
  }
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
    font-weight: normal;
  }
  .sub {
    font-size: 14px;
    margin: 4px 0 0;
    color: rgba(26,36,56,0.6);
  }
  .stat {
    font-size: 14px;
    color: rgba(26,36,56,0.8);
  }
  .pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 14px;
    scrollbar-width: thin;
  }
  .pills::-webkit-scrollbar { height: 6px; }
  .pills::-webkit-scrollbar-thumb { background: rgba(140,107,63,0.35); border-radius: 3px; }
  .pill {
    flex-shrink: 0;
    font-size: 14px;
    padding: 7px 13px;
    border: 1px solid rgba(26,36,56,0.27);
    background: transparent;
    color: var(--ink);
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .pill.active {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
  }
  .pill .count { opacity: 0.7; margin-left: 6px; }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(26,36,56,0.8);
    cursor: pointer;
    user-select: none;
  }
  .checkbox input { accent-color: var(--brass); width: 15px; height: 15px; }
  .toolbar-actions { display: flex; gap: 14px; }
  .toolbar-actions button, .link-btn {
    background: none;
    border: none;
    color: rgba(26,36,56,0.8);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 2px;
    font-family: inherit;
  }
  .toolbar-actions button:hover, .link-btn:hover { color: var(--ink); }
  #reset-progress-btn { color: rgba(168,72,43,0.75); }
  #reset-progress-btn:hover { color: var(--rust); }

  #card-area {
    position: relative;
    margin-bottom: 20px;
    min-height: 300px;
  }
  .stack {
    position: absolute;
    inset: 0;
    background: var(--card);
    border: 1px solid rgba(26,36,56,0.13);
    border-radius: 4px;
  }
  .stack.s2 { transform: translate(10px, 10px) rotate(1.2deg); z-index: 0; }
  .stack.s1 { transform: translate(5px, 5px) rotate(-0.8deg); z-index: 1; }
  .flip-outer {
    position: relative;
    z-index: 2;
    min-height: 300px;
    perspective: 1400px;
    cursor: pointer;
  }
  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 300px;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 4px;
    border: 1.5px solid var(--ink);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.front { background: var(--card); color: var(--ink); }
  .face.back { background: var(--ink); color: var(--paper); transform: rotateY(180deg); }
  .face-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .face-header, .hint, .tag, .topic-tag, .answer-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .topic-tag {
    font-size: 12px;
    padding: 4px 8px;
    background: var(--brass);
    color: var(--card);
    border-radius: 2px;
  }
  .answer-label { font-size: 12px; color: rgba(239,233,218,0.6); }
  .tag { font-size: 12px; color: rgba(26,36,56,0.55); }
  .face.back .tag { color: rgba(239,233,218,0.55); }
  .face-body { flex: 1; display: flex; align-items: center; }
  .face.front .face-body p { font-size: 19px; line-height: 1.4; margin: 0; }
  .face.back .face-body p { font-size: 22px; line-height: 1.4; margin: 0; }
  .hint {
    font-size: 12px;
    text-align: center;
    margin: 22px 0 0;
    color: rgba(26,36,56,0.45);
  }
  .face.back .hint { color: rgba(239,233,218,0.45); }

  .mark-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .mark-row button {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    padding: 11px;
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #mark-learning { border: 1px solid var(--rust); color: var(--rust); }
  #mark-known { border: 1px solid var(--green); color: var(--green); }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
  }
  .nav-row button {
    background: none;
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 10px;
  }
  #pos-counter { color: rgba(26,36,56,0.6); }

  #empty-state {
    text-align: center;
    padding: 70px 20px;
    border: 1px solid rgba(26,36,56,0.2);
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  #empty-state .muted { color: rgba(26,36,56,0.6); font-size: 14px; }

  .footer-hint {
    text-align: center;
    font-size: 12px;
    color: rgba(26,36,56,0.4);
    margin-top: 30px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .footer-hint.warn { color: var(--rust); }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>SEBI GA Flashcards</h1>
      <p class="sub ui" id="subtitle"></p>
    </div>
    <div class="stat ui tabular" id="known-stat"></div>
  </div>

  <div class="pills ui" id="topic-pills"></div>

  <div class="toolbar ui">
    <label class="checkbox">
      <input type="checkbox" id="review-toggle">
      Review only (hide cards marked known)
    </label>
    <div class="toolbar-actions">
      <button id="shuffle-btn">Shuffle</button>
      <button id="reset-order-btn">Reset order</button>
      <button id="reset-progress-btn">Reset progress</button>
    </div>
  </div>

  <div id="card-area">
    <div class="stack s2"></div>
    <div class="stack s1"></div>
    <div class="flip-outer" id="flip-outer">
      <div class="flip-inner" id="flip-inner">
        <div class="face front">
          <div class="face-header">
            <span class="topic-tag" id="front-topic"></span>
            <span class="tag" id="front-tag"></span>
          </div>
          <div class="face-body"><p id="front-text"></p></div>
          <p class="hint">Tap to reveal answer</p>
        </div>
        <div class="face back">
          <div class="face-header">
            <span class="answer-label">Answer</span>
            <span class="tag" id="back-tag"></span>
          </div>
          <div class="face-body"><p id="back-text" class="tabular"></p></div>
          <p class="hint">Tap to flip back</p>
        </div>
      </div>
    </div>
  </div>

  <div class="mark-row ui" id="mark-row" style="display:none;">
    <button id="mark-learning">&#10005; Still learning</button>
    <button id="mark-known">&#10003; Know it</button>
  </div>

  <div class="nav-row ui" id="nav-row">
    <button id="prev-btn">&larr; Prev</button>
    <span id="pos-counter" class="tabular"></span>
    <button id="next-btn">Next &rarr;</button>
  </div>

  <div id="empty-state">
    <p style="margin:0 0 4px;">Nothing left to review here.</p>
    <p class="muted" style="margin:0;">Every card in this topic is marked known. Uncheck "Review only" to see them again.</p>
  </div>

  <p class="footer-hint" id="footer-hint">Space to flip &middot; &larr; &rarr; to move</p>
</div>

/* ===== END CARD DATA ===== */

const TAG = "Jul 2026";
const STORAGE_KEY = "sebi-ga-jul2026-progress";

const CARDS = CARDS_RAW.map(function (row, i) {
  return { id: i, topic: TOPICS[row[0]], front: row[1], back: row[2] };
});

const TOPIC_COUNTS = {};
TOPICS.forEach(function (t) {
  TOPIC_COUNTS[t] = CARDS.filter(function (c) { return c.topic === t; }).length;
});

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
var storageOK = true;
function saveProgress(p) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  } catch (e) {
    storageOK = false;
    updateFooter();
  }
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

var state = {
  activeTopic: "All",
  reviewOnly: false,
  order: CARDS.map(function (c) { return c.id; }),
  pos: 0,
  flipped: false,
  progress: loadProgress()
};

function getFilteredIds() {
  var list = CARDS;
  if (state.activeTopic !== "All") {
    list = list.filter(function (c) { return c.topic === state.activeTopic; });
  }
  if (state.reviewOnly) {
    list = list.filter(function (c) { return state.progress[c.id] !== "known"; });
  }
  return list.map(function (c) { return c.id; });
}

function getVisibleOrder() {
  var filtered = getFilteredIds();
  return state.order.filter(function (id) { return filtered.indexOf(id) !== -1; });
}

function byId(id) {
  return CARDS[id];
}

function knownCount() {
  var n = 0;
  for (var k in state.progress) {
    if (state.progress[k] === "known") n++;
  }
  return n;
}

/* ---------- DOM refs ---------- */
var el = {
  subtitle: document.getElementById("subtitle"),
  knownStat: document.getElementById("known-stat"),
  pills: document.getElementById("topic-pills"),
  reviewToggle: document.getElementById("review-toggle"),
  shuffleBtn: document.getElementById("shuffle-btn"),
  resetOrderBtn: document.getElementById("reset-order-btn"),
  resetProgressBtn: document.getElementById("reset-progress-btn"),
  cardArea: document.getElementById("card-area"),
  flipOuter: document.getElementById("flip-outer"),
  flipInner: document.getElementById("flip-inner"),
  frontTopic: document.getElementById("front-topic"),
  frontTag: document.getElementById("front-tag"),
  frontText: document.getElementById("front-text"),
  backTag: document.getElementById("back-tag"),
  backText: document.getElementById("back-text"),
  markRow: document.getElementById("mark-row"),
  markLearning: document.getElementById("mark-learning"),
  markKnown: document.getElementById("mark-known"),
  navRow: document.getElementById("nav-row"),
  prevBtn: document.getElementById("prev-btn"),
  nextBtn: document.getElementById("next-btn"),
  posCounter: document.getElementById("pos-counter"),
  emptyState: document.getElementById("empty-state"),
  footerHint: document.getElementById("footer-hint")
};

function updateFooter() {
  if (!storageOK) {
    el.footerHint.textContent = "Space to flip \u00b7 \u2190 \u2192 to move \u00b7 progress isn't saving in this browser, but the deck still works";
    el.footerHint.classList.add("warn");
  } else {
    el.footerHint.textContent = "Space to flip \u00b7 \u2190 \u2192 to move";
    el.footerHint.classList.remove("warn");
  }
}

function renderPills() {
  el.pills.innerHTML = "";
  var all = ["All"].concat(TOPICS);
  all.forEach(function (topic) {
    var btn = document.createElement("button");
    btn.className = "pill" + (state.activeTopic === topic ? " active" : "");
    var count = topic === "All" ? CARDS.length : TOPIC_COUNTS[topic];
    btn.innerHTML = topic + ' <span class="count">' + count + "</span>";
    btn.addEventListener("click", function () {
      state.activeTopic = topic;
      state.pos = 0;
      state.flipped = false;
      render();
    });
    el.pills.appendChild(btn);
  });
}

function render() {
  el.subtitle.textContent = "General Awareness \u00b7 " + TAG + " booster \u00b7 " + CARDS.length + " cards";
  el.knownStat.textContent = knownCount() + " of " + CARDS.length + " marked known";
  el.reviewToggle.checked = state.reviewOnly;

  var visible = getVisibleOrder();
  var total = visible.length;
  var safePos = total === 0 ? 0 : Math.min(state.pos, total - 1);
  state.pos = safePos;

  Array.prototype.forEach.call(el.pills.children, function (btn, idx) {
    var topic = (["All"].concat(TOPICS))[idx];
    btn.classList.toggle("active", state.activeTopic === topic);
  });

  if (total === 0) {
    el.cardArea.style.display = "none";
    el.markRow.style.display = "none";
    el.navRow.style.display = "none";
    el.emptyState.style.display = "block";
    return;
  }

  el.cardArea.style.display = "block";
  el.navRow.style.display = "flex";
  el.emptyState.style.display = "none";

  var currentId = visible[safePos];
  var current = byId(currentId);

  el.frontTopic.textContent = current.topic;
  el.frontTag.textContent = TAG;
  el.frontText.textContent = current.front;
  el.backTag.textContent = TAG;
  el.backText.textContent = current.back;

  el.flipInner.classList.toggle("flipped", state.flipped);
  el.markRow.style.display = state.flipped ? "flex" : "none";
  el.posCounter.textContent = (safePos + 1) + " / " + total;
}

function goNext() {
  var visible = getVisibleOrder();
  var total = visible.length;
  state.flipped = false;
  state.pos = total === 0 ? 0 : (state.pos + 1) % total;
  render();
}
function goPrev() {
  var visible = getVisibleOrder();
  var total = visible.length;
  state.flipped = false;
  state.pos = total === 0 ? 0 : (state.pos - 1 + total) % total;
  render();
}
function toggleFlip() {
  var visible = getVisibleOrder();
  if (visible.length === 0) return;
  state.flipped = !state.flipped;
  render();
}
function mark(value) {
  var visible = getVisibleOrder();
  if (visible.length === 0) return;
  var currentId = visible[Math.min(state.pos, visible.length - 1)];
  state.progress[currentId] = value;
  saveProgress(state.progress);
  goNext();
}

el.flipOuter.addEventListener("click", toggleFlip);
el.reviewToggle.addEventListener("change", function (e) {
  state.reviewOnly = e.target.checked;
  state.pos = 0;
  state.flipped = false;
  render();
});
el.shuffleBtn.addEventListener("click", function () {
  state.order = shuffleArray(CARDS.map(function (c) { return c.id; }));
  state.pos = 0;
  state.flipped = false;
  render();
});
el.resetOrderBtn.addEventListener("click", function () {
  state.order = CARDS.map(function (c) { return c.id; });
  state.pos = 0;
  state.flipped = false;
  render();
});
el.resetProgressBtn.addEventListener("click", function () {
  if (window.confirm("Clear all saved progress for this deck? This can't be undone.")) {
    state.progress = {};
    saveProgress(state.progress);
    render();
  }
});
el.markLearning.addEventListener("click", function (e) { e.stopPropagation(); mark("learning"); });
el.markKnown.addEventListener("click", function (e) { e.stopPropagation(); mark("known"); });
el.prevBtn.addEventListener("click", function (e) { e.stopPropagation(); goPrev(); });
el.nextBtn.addEventListener("click", function (e) { e.stopPropagation(); goNext(); });

document.addEventListener("keydown", function (e) {
  if (e.code === "Space") { e.preventDefault(); toggleFlip(); }
  else if (e.code === "ArrowRight") { goNext(); }
  else if (e.code === "ArrowLeft") { goPrev(); }
});

renderPills();
updateFooter();
render();
</script>
</body>
</html>
