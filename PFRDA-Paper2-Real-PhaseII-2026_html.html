<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFRDA 2026 Phase II Paper 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: exam-hall CBT console. Sticky timer bar, one question per screen, fixed action bar, sheet for the question palette. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#18212b; --muted:#5b6672; --line:#d9dee4;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef6;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --bad:#b4352c; --bad-soft:#f8e3e1;
  --flag:#7a4cb0; --flag-soft:#eee6f8; --skip:#8a6a12; --skip-soft:#f6efd9;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;
  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;
  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;
  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;
  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
/* start */
.start{display:grid;gap:16px}
.start .panel{padding:18px}
.start h1{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
.facts div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;font-weight:600}
.tbl{overflow-x:auto}
table.sec{border-collapse:collapse;width:100%;font-size:14px}
table.sec th,table.sec td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.sec td.r,table.sec th.r{text-align:right}
.note{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--accent-soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qhead .marks{font-size:13px;color:var(--muted)}
details.stem{margin-bottom:12px}
details.stem summary{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0;cursor:pointer}
.stem-body{font-family:var(--read);font-size:16.5px;line-height:1.6;max-height:55vh;overflow:auto;padding:4px 14px;border-left:3px solid var(--line);min-width:0}
.stem-body p{margin:0 0 10px}
table.dt{border-collapse:collapse;font-family:var(--ui);font-size:15px;margin:6px 0 10px}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.qtext{font-size:17px;margin:0 0 14px;min-width:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;min-height:52px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
/* bottom bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot-in .btn{width:100%;font-size:14px;padding:8px 6px}
@media (min-width:560px){.foot-in{grid-template-columns:repeat(4,1fr)}}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--panel);width:100%;max-width:760px;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.pal-sec{margin:12px 0 4px;font-size:13px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pal button{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px}
.st-ans{background:var(--ok-soft)!important;border-color:var(--ok)!important;color:var(--ok)}
.st-flag{background:var(--flag-soft)!important;border-color:var(--flag)!important;color:var(--flag)}
.st-seen{background:var(--skip-soft)!important;border-color:var(--skip)!important;color:var(--skip)}
.st-cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px}
/* results */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:40px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-skip{background:var(--skip-soft);color:var(--skip)}
.rev{display:grid;gap:12px;margin-top:12px}
.rq{padding:14px}
.rq .opt{cursor:default;min-height:0;padding:8px 12px}
.rq .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.rq .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px;overflow-wrap:anywhere}
.exp b{font-weight:600}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>

</head>

<script>
const DATA = {"id": "pfrda-p2-2026-real-n38", "title": "PFRDA 2026 Phase II · Paper 2 (real paper)", "short": "PFRDA 2026 Ph-II P2", "blurb": "The Phase II Paper 2 you sat on 20 Nov 2026, rebuilt from EduTap's recollection slides (3 batches so far). 38 questions, 2 marks each, a quarter of the marks off per wrong answer, in EduTap's order and with their options. 9 answers are DERIVED because no key was shown; the explanations say which. Use it to check your answers, and as a timed paper for SEBI-style practice.", "gaps": "<b>Not in the scored test<\/b> (text or options were not recovered):<ol class=\"open\"><li><b>PFRDA Act & Pension (regulator objectives).<\/b> \"Consider the following statements regarding the objectives of financial sector regulators in India: PFRDA, SEBI, IRDAI.\" The slide showed only the three names, with no statements or options. Revise one line each: PFRDA protects subscribers and promotes old-age income security; SEBI protects investors and develops and regulates the securities market; IRDAI protects policyholders and regulates insurance.<\/li><li><b>Costing (contract profit).<\/b> Total contract price Rs 50 lakh, work certified Rs 40 lakh, work uncertified Rs 2 lakh, notional profit Rs 5 lakh. Based on the stage of completion, how much profit should be transferred to the P&amp;L account? Options were not visible. Worked answer (presenter's working): completion = 40/50 = 80%, which is between 50% and 90%, so profit = 2/3 × 5 lakh = <b>Rs 3.33 lakh<\/b> (× cash received ÷ work certified if cash is given; it was not).<\/li><li><b>Management (Hersey and Blanchard).<\/b> \"According to Hersey and Blanchard's Situational Leadership Theory, which of the following is the most important factor in determining an appropriate leadership style?\" Options were not shown. Answer: the <b>readiness (maturity) or development level of the followers<\/b>.<\/li><li><b>AI & ML (process evaluation).<\/b> \"Two AI agents perform the same task. One follows the correct process, while the other does not. Which of the following should be evaluated to assess their performance?\" Options and answer were not shown. Likely idea: judge the <b>process/trajectory (the steps taken)<\/b>, not only the final output.<\/li><\/ol><b>What this does not cover.<\/b> Only the questions EduTap has recovered so far, so section weights are not the real paper's. More batches will be added to this same page.", "resnote": "2025 UR cut-off for Paper 2 was 60.5 out of 100. Here the maximum is 76; 60% of it is 45.6. EduTap's live session put this year's overall cut-off estimate at about 74.", "minutes": 30, "neg": 0.25, "sections": [{"name": "Economics", "n": 8, "marks": 16}, {"name": "Companies Act", "n": 5, "marks": 10}, {"name": "Budget & Economic Survey", "n": 1, "marks": 2}, {"name": "PFRDA Act & Pension", "n": 5, "marks": 10}, {"name": "AI & ML", "n": 2, "marks": 4}, {"name": "Finance", "n": 4, "marks": 8}, {"name": "Management", "n": 5, "marks": 10}, {"name": "Costing", "n": 3, "marks": 6}, {"name": "Accounts", "n": 4, "marks": 8}, {"name": "Media & Marketing", "n": 1, "marks": 2}], "stems": {}, "qs": [{"s": "Economics", "q": "In an economy, the consumption function is C = 20 + 0.8Yd, where Yd is disposable income. Investment (I) = 100, Government expenditure (G) = 50 and Taxes (T) = 50. Find the equilibrium level of national income.", "o": ["550", "600", "650", "750", "850"], "a": 2, "e": "Y = C + I + G with Yd = Y − T. Y = 20 + 0.8(Y − 50) + 100 + 50 = 130 + 0.8Y, so 0.2Y = 130 and Y = 650. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Economics", "q": "In the Cambridge cash balance equation Md = kPY, the notations stand for certain variables. Which one of the following has been stated incorrectly?", "o": ["Md = aggregate demand for money", "k = the fraction of nominal income that people wish to hold in the form of money", "P = average price level of currently produced goods and services", "Y = nominal national income", "PY = nominal income"], "a": 3, "e": "Y is REAL national income (output). P × Y together make nominal income, which is why E is right and D is the wrong statement. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Economics", "q": "The government decides to finance its fiscal deficit by borrowing from the market instead of raising taxes. Which one of the following is the most likely consequence of this decision?", "o": ["Increase in the long-term disposable income of households", "Crowding out of private investment", "Easing of inflationary pressure in the economy", "Increase in consumer disposable income", "Reduction in the government's future interest burden"], "a": 1, "e": "Market borrowing raises demand for loanable funds, pushes up interest rates and squeezes private investment: crowding out. It also raises (not reduces) future interest payments. <i>Answer source: presenter's tick or explanation slide (no answer box).<\/i>", "st": null}, {"s": "Economics", "q": "The following table shows the price of mobile phones and the corresponding number of units supplied:<br><br><table class=\"dt\"><tr><th>Price of mobile phone (Rs)<\/th><th>Units supplied<\/th><\/tr><tr><td>20,000<\/td><td>300<\/td><\/tr><tr><td>30,000<\/td><td>500<\/td><\/tr><tr><td>40,000<\/td><td>700<\/td><\/tr><tr><td>50,000<\/td><td>900<\/td><\/tr><tr><td>60,000<\/td><td>1,100<\/td><\/tr><\/table><br>On the basis of the above data, which one of the following correctly describes the supply curve?", "o": ["An upward sloping curve with elasticity of supply greater than 1", "An upward sloping curve with elasticity of supply less than 1", "A downward sloping curve with elasticity of supply greater than 1", "A downward sloping curve with elasticity of supply less than 1", "A vertical straight line with elasticity of supply equal to zero"], "a": 0, "e": "Price and quantity rise together, so the curve slopes upward. From 20,000 to 30,000: price +50%, quantity +66.7%, so Es = 1.33. The line is Q = 0.02P − 100, which meets the price axis at a positive price (Rs 5,000), and any straight supply line that starts on the price axis has Es > 1 everywhere. DERIVED: no answer box was shown on the slide. <i>Answer source: DERIVED here, EduTap showed no answer. Check against their final key.<\/i>", "st": null}, {"s": "Economics", "q": "As per the Monetary Policy Statement released after the RBI Monetary Policy Committee meeting concluded on 7th October 2026, CPI inflation increased to ______ in August 2026 as compared to ______ in July 2026.", "o": ["4.2% and 3.9%", "4.5% and 4.2%", "4.8% and 4.5%", "5.2% and 4.9%", "5.5% and 4.8%"], "a": 2, "e": "EduTap key: 4.8% in August 2026, up from 4.5% in July 2026 (October 2026 MPC statement). <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Companies Act", "q": "An auditor resigns from a company but fails to file Form ADT-3 with the Registrar of Companies (ROC) within 30 days. If the auditor's remuneration was Rs 1.5 lakh, what penalty would be applicable under Section 140(3) of the Companies Act, 2013?", "o": ["Rs 1 lakh", "Rs 1.5 lakh", "Rs 50,000", "Rs 2 lakh", "Rs 2.5 lakh"], "a": 2, "e": "Section 140(3): penalty of Rs 50,000 or the auditor's remuneration, whichever is LESS. Lower of 50,000 and 1.5 lakh = Rs 50,000. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Companies Act", "q": "Under Rule 8(4) of the Companies (Share Capital and Debentures) Rules, 2014, a startup company is exempt from the prescribed restrictions and may issue sweat equity shares up to what limit and for what period from the date of its incorporation or registration?", "o": ["Up to 25% of its paid-up capital for 5 years.", "Up to 50% of its paid-up capital for 5 years.", "Up to 50% of its paid-up capital for 10 years.", "Up to 15% of its paid-up capital for 10 years.", "Up to 25% of its paid-up capital for 10 years."], "a": 2, "e": "Normal cap: 15% of paid-up capital a year or Rs 5 crore, overall 25%. Startups: up to 50% of paid-up capital for 10 years from incorporation (raised from 5 years in 2019). <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Companies Act", "q": "Under Section 53 of the Companies Act, 2013, which of the following statements regarding the issue of shares at a discount is correct?", "o": ["It is permissible if prior approval of SEBI is obtained.", "It is permissible if prior approval of the RBI is obtained.", "It is permissible if approved by the shareholders through a special resolution.", "It is generally prohibited, except in cases of sweat equity shares.", "It is permissible if approved by the Registrar of Companies (ROC)."], "a": 3, "e": "Section 53 bars issue of shares at a discount; any such issue is void. Exceptions: sweat equity (s.54) and shares issued to creditors on conversion of debt under a statutory restructuring scheme. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Companies Act", "q": "If a person is aggrieved by or not satisfied with the order passed by the National Company Law Appellate Tribunal (NCLAT) under the Companies Act, 2013, within what period and before which authority can an appeal be filed?", "o": ["Within 30 days before the Supreme Court.", "Within 60 days before the Supreme Court.", "Within 60 days before the High Court.", "Within 30 days before the High Court.", "Within 45 days before the Supreme Court."], "a": 1, "e": "Section 423: appeal against NCLAT goes to the Supreme Court within 60 days (extendable by another 60 days for sufficient cause). NCLT to NCLAT is 45 days. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Companies Act", "q": "Under Section 126 of the Companies Act, 2013, where an instrument of transfer of shares has been delivered to a company but the transfer has not yet been registered, and the company declares a dividend, to which account must the dividend be transferred?", "o": ["Investor Education and Protection Fund (IEPF)", "General Reserve Account", "Unpaid Dividend Account", "Securities Premium Account", "Capital Redemption Reserve Account"], "a": 2, "e": "Section 126: the dividend on shares whose transfer is pending registration is moved to the Unpaid Dividend Account (unless the registered holder authorises payment to the transferee). <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Budget & Economic Survey", "q": "Which of the following funds was announced in the Union Budget 2026–27 to provide partial credit guarantees to lenders and reduce risks associated with infrastructure development and construction?", "o": ["SME Growth Fund", "Self-Reliant India Fund", "Infrastructure Risk Guarantee Fund", "National Investment and Infrastructure Fund", "Credit Guarantee Fund Trust for Micro and Small Enterprises"], "a": 2, "e": "Budget 2026-27 announced an Infrastructure Risk Guarantee Fund giving partial credit guarantees to lenders for infrastructure and construction projects. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "PFRDA Act & Pension", "q": "Under the PFRDA Act, 2013, within how many days can an aggrieved person file an appeal before the Supreme Court against an order of the Securities Appellate Tribunal (SAT)?", "o": ["30 days", "45 days", "60 days", "90 days", "120 days"], "a": 2, "e": "PFRDA Act s.37: appeal from SAT to the Supreme Court within 60 days of the SAT order (court may allow a further 60 days). Appeal from PFRDA to SAT is 45 days. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "PFRDA Act & Pension", "q": "Under Section 24 of the PFRDA Act, 2013, what percentage of paid-up capital is specified for the aggregate equity shareholding of foreign companies, individuals or associations in a pension fund, subject to the applicable higher limit?", "o": ["20%", "25%", "26%", "49%", "74%"], "a": 2, "e": "Section 24 of the Act states 26% (or the limit for insurance companies, whichever is higher). In practice the cap now follows the insurance FDI limit, but the Act's own figure is 26%. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "AI & ML", "q": "An AI agent is in state S1 and follows a greedy action-selection policy. The estimated action values are:<br>Action A: Q(S1, A) = 8<br>Action B: Q(S1, B) = 11<br>Which action will the agent select under the greedy policy?", "o": ["Action A, because its estimated value is lower.", "Action B, because its estimated value is higher.", "Both actions with equal probability.", "Either action randomly, irrespective of estimated values.", "Neither action until the actual rewards are determined."], "a": 1, "e": "A greedy policy always picks the action with the highest estimated value (11 > 8). Random picks belong to epsilon-greedy exploration. DERIVED: no answer box shown; the presenter's notes said \"highest reward\". <i>Answer source: DERIVED here, EduTap showed no answer. Check against their final key.<\/i>", "st": null}, {"s": "AI & ML", "q": "An AI-based fraud detection model achieves high accuracy but sometimes misses fraudulent transactions and incorrectly flags legitimate ones. Which of the following best explains the relevance of the F1 Score in evaluating this model?", "o": ["It measures the overall proportion of correct predictions.", "It calculates the harmonic mean of precision and recall.", "It measures the proportion of actual negative cases correctly identified.", "It measures the average difference between predicted and actual values.", "It measures the model's computational efficiency and processing speed."], "a": 1, "e": "F1 = 2PR/(P + R), the harmonic mean of precision (false flags) and recall (missed fraud). A = accuracy, C = specificity, D = MAE. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Finance", "q": "Consider the following statements regarding Basis in the Futures Market. Fill in the blanks with the most appropriate options.<br>The difference between the futures price and the spot price is known as ______. When the futures price is higher than the spot price, the market is said to be in a ______, and the basis is ______. However, the basis becomes negative in a ______.", "o": ["Premium; Normal Market; Positive; Inverted Market", "Basis; Normal Market; Positive; Inverted Market", "Basis; Inverted Market; Negative; Normal Market", "Spread; Normal Market; Negative; Inverted Market", "Basis; Normal Market; Negative; Inverted Market"], "a": 1, "e": "As the question defines it (futures − spot), futures above spot (contango, normal market) gives a positive basis; backwardation (inverted market) gives a negative one. TRAP: if basis is defined as spot − futures, the signs flip, so read the definition in the stem. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Economics", "q": "Consider the following statements regarding Public Private Partnership (PPP) in India:<br>1. Public Private Partnership involves collaboration between the government and private sector for the development and delivery of public infrastructure.<br>2. In a Public Private Partnership, the terms Build, Operate, Own and Transfer represent key activities or responsibilities that may be assigned to the private sector under different contractual arrangements.<br>3. A Public Private Partnership involves a contractual or concession agreement that defines the roles and responsibilities of both parties and provides for sharing of risks between them.<br>Which of the statements given above is/are correct?", "o": ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3", "1 only"], "a": 3, "e": "All three are standard features of PPP: government plus private partner, BOT/BOOT type assignments, and a concession agreement that shares risk. <i>Answer source: EduTap answer slide.<\/i>", "st": null}, {"s": "Finance", "q": "Match the following financial instruments given in Column I with their respective descriptions in Column II.<br><br><table class=\"dt\"><tr><th>Column I<\/th><th>Column II<\/th>< const KEY = "pfrda-mock:" + DATA.id;
const L = ["A","B","C","D","E"];
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app");
let S = null; // state
let tick = null;

function load(){ try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function secOf(q){ return DATA.sections.find(s => s.name === q.s); }
function markOf(q){ const s = secOf(q); return s.marks / s.n; }
function fmt(n){ return (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,""); }
function fmtT(ms){ ms = Math.max(0, ms); const t = Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); }
function esc(t){ const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* ---------- start screen ---------- */
function startScreen(){
  clearInterval(tick);
  const prev = load();
  const total = DATA.qs.length;
  const rows = DATA.sections.map(s => `<tr><td>${s.name}</td><td class="r num">${s.n}</td><td class="r num">${s.marks}</td><td class="r num">${fmt(s.marks/s.n)}</td><td class="r num">−${fmt(s.marks/s.n*DATA.neg)}</td></tr>`).join("");
  let resume = "";
  if (prev && prev.phase === "test") resume = `<button class="btn primary" id="resume">Resume attempt (${fmtT(prev.deadline - Date.now())} left)</button>`;
  if (prev && prev.phase === "done") resume = `<button class="btn primary" id="seeres">See last result</button>`;
  app.innerHTML = `<div class="wrap start">
    <div class="panel">
      <div class="eyebrow">PFRDA Grade A · Phase II · Paper 2</div>
      <h1 style="margin-top:6px">${DATA.title}</h1>
      <p class="note" style="margin:8px 0 14px">${DATA.blurb}</p>
      <dl class="facts">
        <div><dt>Questions</dt><dd class="num">${total}</dd></div>
        <div><dt>Marks</dt><dd class="num">${DATA.sections.reduce((a,s)=>a+s.marks,0)}</dd></div>
        <div><dt>Time</dt><dd class="num">${DATA.minutes} min</dd></div>
        <div><dt>Wrong answer</dt><dd>−¼ of its marks</dd></div>
      </dl>
    </div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">Sections</div>
      <div class="tbl"><table class="sec"><tr><th>Section</th><th class="r">Qs</th><th class="r">Marks</th><th class="r">Per Q</th><th class="r">Wrong</th></tr>${rows}</table></div>
      <p class="note" style="margin:10px 0 0">One ${DATA.minutes}-minute timer for the whole paper (the real paper gives 40 minutes for 50 questions, so this is scaled to the questions recovered so far). The test submits itself when time runs out.</p><p class="note" style="margin:10px 0 0">${DATA.gaps}</p>
    </div>
    <div class="row">${resume}<button class="btn ${resume ? "" : "primary"}" id="go">${prev ? "Start a fresh attempt" : "Start test"}</button></div>
  </div>`;
  $("#go").onclick = () => { S = { phase:"test", deadline: Date.now() + DATA.minutes*60000, started: Date.now(), cur:0, ans:Array(total).fill(null), flag:Array(total).fill(false), seen:Array(total).fill(false) }; save(); testScreen(); };
  if ($("#resume")) $("#resume").onclick = () => { S = prev; if (S.deadline <= Date.now()) { finish(); } else testScreen(); };
  if ($("#seeres")) $("#seeres").onclick = () => { S = prev; resultScreen(); };
}

/* ---------- test screen ---------- */
function testScreen(){
  app.innerHTML = `<div class="bar"><div class="bar-in"><div class="t">${DATA.short}</div><div class="timer" id="timer">--:--</div><button class="btn" id="palbtn" style="min-height:36px;padding:6px 10px">Questions</button></div>
    <div class="chips" id="chips"></div></div>
    <div class="wrap"><div id="q"></div></div>
    <div class="foot"><div class="foot-in">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn primary" id="next">Save &amp; next →</button>
      <button class="btn" id="flag">Mark for review</button>
      <button class="btn ghost" id="clear">Clear answer</button>
    </div></div>
    <div id="sheet"></div>`;
  $("#prev").onclick = () => go(S.cur - 1);
  $("#next").onclick = () => go(S.cur + 1);
  $("#flag").onclick = () => { S.flag[S.cur] = !S.flag[S.cur]; save(); if (S.flag[S.cur]) go(S.cur + 1); else renderQ(); };
  $("#clear").onclick = () => { S.ans[S.cur] = null; save(); renderQ(); };
  $("#palbtn").onclick = openPalette;
  renderQ();
  clearInterval(tick); tick = setInterval(tickFn, 500); tickFn();
}
function tickFn(){
  const left = S.deadline - Date.now();
  const t = $("#timer"); if (!t) return;
  t.textContent = fmtT(left);
  t.classList.toggle("low", left < 5*60000);
  if (left <= 0) finish();
}
function go(i){ if (i < 0 || i >= DATA.qs.length) { if (i >= DATA.qs.length) openPalette(); return; } S.cur = i; save(); renderQ(); window.scrollTo(0,0); }
function renderQ(){
  const i = S.cur, q = DATA.qs[i];
  S.seen[i] = true; save();
  $("#chips").innerHTML = DATA.sections.map(s => `<button class="chip" data-s="${esc(s.name)}" aria-pressed="${s.name===q.s}">${s.name}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => go(DATA.qs.findIndex(x => x.s === b.dataset.s)));
  const act = $("#chips [aria-pressed=true]"); if (act) act.scrollIntoView({inline:"nearest", block:"nearest"});
  const stem = q.st ? `<details class="stem" open><summary>Directions / passage</summary><div class="stem-body">${DATA.stems[q.st]}</div></details>` : "";
  $("#q").innerHTML = `<div class="qhead"><div><span class="eyebrow">${q.s}</span><h2 class="num" style="font-size:18px;margin-top:2px">Question ${i+1} <span class="note">of ${DATA.qs.length}</span></h2></div>
     <div class="marks num">+${fmt(markOf(q))} / −${fmt(markOf(q)*DATA.neg)}${S.flag[i] ? ' · <span class="pill" style="background:var(--flag-soft);color:var(--flag)">Marked</span>' : ""}</div></div>
     ${stem}<p class="qtext">${q.q}</p>
     <div class="opts" role="radiogroup">${q.o.map((o,k) => `<button class="opt" role="radio" aria-checked="${S.ans[i]===k}" data-k="${k}"><span class="k">${L[k]}</span><span>${o}</span></button>`).join("")}</div>`;
  $("#q").querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; S.ans[i] = (S.ans[i] === k ? null : k); save(); renderQ(); });
  $("#flag").textContent = S.flag[i] ? "Unmark" : "Mark for review";
  $("#prev").disabled = i === 0;
  $("#next").textContent = i === DATA.qs.length - 1 ? "Review & submit" : "Save & next →";
}
function openPalette(){
  const answered = S.ans.filter(a => a !== null).length;
  const flagged = S.flag.filter(Boolean).length;
  const groups = DATA.sections.map(s => {
    const btns = DATA.qs.map((q,i) => q.s === s.name ? i : -1).filter(i => i >= 0).map(i => {
      const cls = S.flag[i] ? "st-flag" : S.ans[i] !== null ? "st-ans" : S.seen[i] ? "st-seen" : "";
      return `<button class="${cls} ${i===S.cur?"st-cur":""}" data-i="${i}">${i+1}</button>`; }).join("");
    return `<div class="pal-sec">${s.name}</div><div class="pal">${btns}</div>`; }).join("");
  $("#sheet").innerHTML = `<div class="sheet" id="sh"><div class="sheet-in" role="dialog" aria-label="Question palette">
     <div class="row" style="justify-content:space-between;align-items:center"><h3>Questions</h3><button class="btn" id="shx" style="min-height:36px">Close</button></div>
     <div class="legend"><span><i class="st-ans"></i>Answered</span><span><i class="st-flag"></i>Marked for review</span><span><i class="st-seen"></i>Seen, not answered</span><span><i></i>Not visited</span></div>
     ${groups}
     <div class="confirm"><p style="margin:0 0 10px"><b class="num">${answered}</b> of ${DATA.qs.length} answered${flagged ? `, <b class="num">${flagged}</b> marked for review (marked answers still count)` : ""}. <span class="num">${fmtT(S.deadline-Date.now())}</span> left.</p>
       <div class="row"><button class="btn danger" id="sub1">Submit test</button></div><div id="sub2"></div></div>
  </div></div>`;
  $("#shx").onclick = () => $("#sheet").innerHTML = "";
  $("#sh").onclick = e => { if (e.target.id === "sh") $("#sheet").innerHTML = ""; };
  $("#sheet").querySelectorAll(".pal button").forEach(b => b.onclick = () => { $("#sheet").innerHTML = ""; go(+b.dataset.i); });
  $("#sub1").onclick = () => { $("#sub2").innerHTML = `<p class="note" style="margin:10px 0">You can't change answers after submitting. Submit now?</p><div class="row"><button class="btn danger" id="subyes">Yes, submit</button><button class="btn" id="subno">Keep going</button></div>`;
    $("#subyes").onclick = finish; $("#subno").onclick = () => $("#sub2").innerHTML = ""; };
}
function finish(){
  clearInterval(tick);
  S.phase = "done"; S.ended = Math.min(Date.now(), S.deadline); save();
  resultScreen();
}

/* ---------- results ---------- */
function grade(){
  const per = DATA.sections.map(s => ({ name:s.name, n:s.n, max:s.marks, c:0, w:0, u:0, score:0 }));
  DATA.qs.forEach((q,i) => { const p = per.find(x => x.name === q.s), m = markOf(q), a = S.ans[i];
    if (a === null) p.u++; else if (a === q.a) { p.c++; p.score += m; } else { p.w++; p.score -= m*DATA.neg; } });
  return per;
}
let filter = "all";
function resultScreen(){
  clearInterval(tick);
  const per = grade();
  const tot = per.reduce((a,p) => a + p.score, 0), max = per.reduce((a,p) => a + p.max, 0);
  const c = per.reduce((a,p) => a+p.c, 0), w = per.reduce((a,p) => a+p.w, 0), u = per.reduce((a,p) => a+p.u, 0);
  const used = Math.round(((S.ended||Date.now()) - S.started)/60000);
  const rows = per.map(p => `<tr><td>${p.name}</td><td class="r num">${p.c}</td><td class="r num">${p.w}</td><td class="r num">${p.u}</td><td class="r num"><b>${fmt(p.score)}</b>/${p.max}</td><td class="r num">${p.c+p.w ? Math.round(p.c/(p.c+p.w)*100)+"%" : "–"}</td></tr>`).join("");
  app.innerHTML = `<div class="wrap start">
    <div class="panel"><div class="eyebrow">${DATA.short} · Result</div>
      <div class="score" style="margin-top:6px"><span class="big">${fmt(tot)}</span><span class="note num">/ ${max} marks</span></div>
      <div class="row" style="margin-top:8px"><span class="pill p-ok num">${c} correct</span><span class="pill p-bad num">${w} wrong (−${fmt(per.reduce((a,p)=>a+p.w*(p.max/p.n)*DATA.neg,0))})</span><span class="pill p-skip num">${u} not attempted</span><span class="pill num" style="background:var(--accent-soft);color:var(--accent)">${used} of ${DATA.minutes} min used</span></div>
      <p class="note" style="margin:10px 0 0">${DATA.resnote}</p>
    </div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">By section</div>
      <div class="tbl"><table class="sec"><tr><th>Section</th><th class="r">✓</th><th class="r">✗</th><th class="r">–</th><th class="r">Score</th><th class="r">Accuracy</th></tr>${rows}</table></div></div>
    <div class="panel" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">Answers &amp; explanations</div>
      <div class="row" id="filt">${["all","wrong","skipped","correct"].map(f => `<button class="chip" data-f="${f}" aria-pressed="${filter===f}">${{all:"All",wrong:"Wrong",skipped:"Not attempted",correct:"Correct"}[f]}</button>`).join("")}</div></div>
      <div class="rev" id="rev"></div></div>
    <div class="row"><button class="btn" id="again">Retake this mock</button></div>
  </div>`;
  $("#filt").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; resultScreen(); });
  $("#again").onclick = () => { wipe(); S = null; filter = "all"; startScreen(); };
  const list = DATA.qs.map((q,i) => ({q,i})).filter(({q,i}) => { const a = S.ans[i];
    return filter==="all" || (filter==="wrong" && a!==null && a!==q.a) || (filter==="skipped" && a===null) || (filter==="correct" && a===q.a); });
  $("#rev").innerHTML = list.length ? list.map(({q,i}) => { const a = S.ans[i];
    const tag = a===null ? '<span class="pill p-skip">Not attempted</span>' : a===q.a ? '<span class="pill p-ok">Correct</span>' : '<span class="pill p-bad">Wrong</span>';
    const stem = q.st ? `<details class="stem"><summary>Directions / passage</summary><div class="stem-body">${DATA.stems[q.st]}</div></details>` : "";
    return `<div class="panel rq"><div class="qhead"><span class="eyebrow">Q${i+1} · ${q.s}</span>${tag}</div>${stem}<p class="qtext" style="font-size:16px">${q.q}</p>
      <div class="opts">${q.o.map((o,k) => `<div class="opt ${k===q.a?"right":(k===a?"wrong":"")}"><span class="k">${L[k]}</span><span>${o}${k===q.a?" ✓":""}${k===a&&k!==q.a?" (your answer)":""}</span></div>`).join("")}</div>
      <div class="exp"><b>Answer: ${L[q.a]}.</b> ${q.e}</div></div>`; }).join("") : '<p class="note">No questions in this filter.</p>';
}

/* boot */
(function(){ const prev = load();
  if (prev && prev.phase === "test" && prev.deadline > Date.now()) { S = prev; testScreen(); }
  else if (prev && prev.phase === "test") { S = prev; finish(); }
  else startScreen(); })();
</script>

</body>
</html>
