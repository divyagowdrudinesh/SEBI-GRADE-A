(function(){
  var P1 = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>PFRDA Paper 1 Mock 2<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n<style>\n/* Layout: exam console. Sticky timer bar, three question tabs, passage above the answer box. */\n:root{\n  --bg:#f3f5f7; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d6dde4;\n  --accent:#1f5f8b; --accent-soft:#e3eef6; --warn:#a2560b; --warn-soft:#fbefe1; --ok:#2f6b3a; --bad:#a3302a;\n  --display:\"Source Serif 4\", Georgia, \"Times New Roman\", serif;\n  --body:\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#11161c; --panel:#19212a; --ink:#e3e9ef; --muted:#97a4b2; --line:#2c3743;\n  --accent:#7cb6e0; --accent-soft:#1d3346; --warn:#e7a35c; --warn-soft:#3a2a17; --ok:#82c68f; --bad:#ef8a83; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#11161c; --panel:#19212a; --ink:#e3e9ef; --muted:#97a4b2; --line:#2c3743;\n  --accent:#7cb6e0; --accent-soft:#1d3346; --warn:#e7a35c; --warn-soft:#3a2a17; --ok:#82c68f; --bad:#ef8a83; color-scheme:dark}\nhtml{color-scheme:light}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}\n.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}\nh1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}\nh1{font-size:1.7rem;line-height:1.2}\nh2{font-size:1.25rem}\nh3{font-size:1.05rem}\np{margin:0}\n.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}\n.meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:.9rem}\n.meta b{color:var(--ink);font-weight:600}\ntable.pat{border-collapse:collapse;width:100%;font-size:.92rem}\n.tablebox{overflow-x:auto}\ntable.pat th,table.pat td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}\ntable.pat th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\ntable.pat td.n{font-variant-numeric:tabular-nums;white-space:nowrap}\nul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}\n.note{background:var(--warn-soft);border-color:transparent}\n.note h3{color:var(--warn)}\nbutton{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);padding:9px 16px;cursor:pointer}\nbutton.ghost{background:transparent;color:var(--accent)}\nbutton.danger{border-color:var(--bad);background:transparent;color:var(--bad)}\nbutton:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n/* exam bar */\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}\n.bar-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.clock{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}\n.clock.low{color:var(--warn)} .clock.out{color:var(--bad)}\n.tabs{display:flex;gap:6px;flex-wrap:wrap}\n.tab{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:7px 12px}\n.tab[aria-selected=\"true\"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}\n.tab small{font-family:var(--mono);color:var(--muted);margin-left:6px}\n.passage{font-family:var(--display);font-size:1.02rem;line-height:1.65;display:flex;flex-direction:column;gap:12px;max-width:68ch}\n.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline}\n.marks{font-family:var(--mono);font-size:.85rem;color:var(--muted)}\ntextarea,input[type=text]{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}\ntextarea{min-height:220px;resize:vertical;line-height:1.6}\ntextarea.short{min-height:120px}\ntextarea[readonly],input[readonly]{opacity:.75}\n.wc{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}\n.wc.ok{color:var(--ok)} .wc.over,.wc.under{color:var(--warn)}\n.topics{display:flex;flex-direction:column;gap:8px}\n.topics label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}\n.topics label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}\n.topics input{margin-top:4px}\n.rcq{display:flex;flex-direction:column;gap:6px}\n.confirm{border-color:var(--bad)}\n.out{font-family:var(--mono);font-size:.82rem;min-height:260px}\n.status{font-size:.9rem;color:var(--ok)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body style=\"margin:0\">\n<div id=\"intro\" class=\"wrap\">\n  <div class=\"panel note\">\n    <span class=\"eyebrow\">Full exam simulation \u00b7 Paper 1 of 2<\/span>\n    <h2>Paper 1 now, then Paper 2 straight after<\/h2>\n    <p>This page runs Phase II in the real order: <b>Paper 1 descriptive (60 min)<\/b>, then <b>Paper 2 objective (40 min, 50 questions, \u2212\u00bc)<\/b>. Paper 2 starts by itself when Paper 1's time runs out or you finish it, and <b>you cannot go back to Paper 1<\/b>. Allow 1 hour 45 minutes with no break. Copy buttons for both papers appear at the end.<\/p>\n  <\/div>\n  <div class=\"panel\">\n    <span class=\"eyebrow\">PFRDA Grade A 2026 \u00b7 Phase II \u00b7 Paper 1<\/span>\n    <h1>Descriptive English mock 2<\/h1>\n    <div class=\"meta\"><span><b>60 min<\/b> total<\/span><span><b>100 marks<\/b><\/span><span><b>3 questions<\/b>, all compulsory<\/span><span>Typed, like the real paper<\/span><\/div>\n    <p>Take this on a laptop or desktop with a physical keyboard. Spellcheck is off, as in the exam console. The timer keeps running if you reload the page, and your answers are saved in this browser as you type.<\/p>\n  <\/div>\n\n  <div class=\"panel\">\n    <h2>Instructions<\/h2>\n    <ul>\n      <li>All questions are compulsory. Figures to the right show the marks for each question.<\/li>\n      <li>Answers must be written only in English, in your own words.<\/li>\n      <li>Marks will be deducted if the word limit is not observed.<\/li>\n      <li>Your Friday order: <b>RC first (25 min), then the pr\u00e9cis (15), then the essay (20)<\/b>. The paper opens on Q3. Move to the pr\u00e9cis when the clock shows <b>35:00<\/b> and to the essay at <b>20:00<\/b>, finished or not. The page records the time on each question.<\/li>\n      <li>When you finish (or time runs out) Paper 2 begins. Your Paper 1 answers are kept and can be copied at the end of Paper 2.<\/li>\n    <\/ul>\n    <div class=\"tablebox\"><table class=\"pat\">\n      <thead><tr><th>Q<\/th><th>Task<\/th><th>Limit<\/th><th>Marks<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>1<\/td><td>Essay on one of four topics<\/td><td class=\"n\">about 250 words<\/td><td class=\"n\">30<\/td><\/tr>\n        <tr><td>2<\/td><td>Pr\u00e9cis of a passage, with a suitable title<\/td><td class=\"n\">within 120 words<\/td><td class=\"n\">30<\/td><\/tr>\n        <tr><td>3<\/td><td>Reading comprehension, 5 questions<\/td><td class=\"n\">own words<\/td><td class=\"n\">40<\/td><\/tr>\n      <\/tbody>\n    <\/table><\/div>\n  <\/div>\n\n  <div class=\"panel note\">\n    <h3>What this mock covers and what it leaves out<\/h3>\n    <p>This mock fills the gaps Mock 1 named. Together the two cover every format in the PFRDA Phase II papers of 2021, 2022 and 2025. All topics and passages are new: none comes from Mock 1, the Essay Desk, the model essays, the baseline or the Pr\u00e9cis &amp; RC Desk.<\/p>\n    <ul>\n      <li><b>Covered:<\/b> the 2021\u201322 essay limit (about 250 words; aim 240\u2013260), a heavy-cut pr\u00e9cis \"within 120 words\" from a passage of about 520 words (2022 shape, here an evolution passage), and the 2025 RC of <b>5 questions at 8 marks<\/b>, with a concept, a compare, a cause-and-effect, a role-of question and a two-part question on the author's purpose. Essay families: health awareness (2022), cultural heritage (2022), rural development and cooperatives (2021), and education and work (2025 internships).<\/li>\n      <li><b>Not covered here (Mock 1 had them):<\/b> the 250\u2013270 essay and 140\u2013160 pr\u00e9cis of 2025, a quotation essay, and the 4-question RC. Still never practised in a mock: a pr\u00e9cis worded \"in 120\" with no buffer below, which you treat the same as \"within 120\". If Friday's paper states a different limit, follow the paper.<\/li>\n      <li><b>Never seen in these papers, so not included:<\/b> letter, report or email writing.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"panel\">\n    <div class=\"row\">\n      <button id=\"startBtn\">Start the 60-minute paper<\/button>\n      <span id=\"resumeNote\" class=\"status\" hidden><\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"exam\" hidden>\n  <div class=\"bar\"><div class=\"bar-in\">\n    <span class=\"row\" style=\"gap:8px\"><span id=\"clock\" class=\"clock\" aria-live=\"off\">60:00<\/span><span class=\"wc\">Pr\u00e9cis at 35:00 \u00b7 Essay at 20:00<\/span><\/span>\n    <div class=\"tabs\" role=\"tablist\">\n      <button class=\"tab\" role=\"tab\" data-q=\"3\" aria-selected=\"true\">Q3 RC<small id=\"tw3\">0<\/small><\/button>\n      <button class=\"tab\" role=\"tab\" data-q=\"2\" aria-selected=\"false\">Q2 Pr\u00e9cis<small id=\"tw2\">0<\/small><\/button>\n      <button class=\"tab\" role=\"tab\" data-q=\"1\" aria-selected=\"false\">Q1 Essay<small id=\"tw1\">0<\/small><\/button>\n    <\/div>\n    <button id=\"finishBtn\" class=\"ghost\">Finish<\/button>\n  <\/div><\/div>\n\n  <div class=\"wrap\">\n    <div id=\"confirmBox\" class=\"panel confirm\" hidden>\n      <p><b>Finish now?<\/b> You still have <span id=\"leftTxt\"><\/span>. Your answers will be locked and Paper 2 starts at once. You cannot come back.<\/p>\n      <div class=\"row\"><button id=\"confirmYes\">Finish and go to Paper 2<\/button><button id=\"confirmNo\" class=\"ghost\">Keep writing<\/button><\/div>\n    <\/div>\n\n    <!-- Q1 -->\n    <section id=\"q1\" class=\"panel\" role=\"tabpanel\">\n      <div class=\"qhead\"><h2>Q1. Essay<\/h2><span class=\"marks\">30 marks<\/span><\/div>\n      <p>Write an essay of about 250 words on <b>any one<\/b> of the following topics.<\/p>\n      <div class=\"topics\">\n        <label><input type=\"radio\" name=\"topic\" value=\"1\" id=\"t1\"><span>1. Antimicrobial resistance: a silent pandemic.<\/span><\/label>\n        <label><input type=\"radio\" name=\"topic\" value=\"2\" id=\"t2\"><span>2. Heritage tourism as a driver of local economies in India.<\/span><\/label>\n        <label><input type=\"radio\" name=\"topic\" value=\"3\" id=\"t3\"><span>3. Role of Farmer Producer Organisations in raising farmers' incomes.<\/span><\/label>\n        <label><input type=\"radio\" name=\"topic\" value=\"4\" id=\"t4\"><span>4. Bridging the gap between education and employability in India.<\/span><\/label>\n      <\/div>\n      <textarea id=\"a1\" spellcheck=\"false\" autocorrect=\"off\" autocapitalize=\"sentences\" placeholder=\"Choose a topic above, then write your essay here.\"><\/textarea>\n      <span class=\"wc\" id=\"wc1\" data-min=\"240\" data-max=\"260\">0 words \u00b7 target 240\u2013260<\/span>\n    <\/section>\n\n    <!-- Q2 -->\n    <section id=\"q2\" class=\"panel\" role=\"tabpanel\" hidden>\n      <div class=\"qhead\"><h2>Q2. Pr\u00e9cis<\/h2><span class=\"marks\">30 marks<\/span><\/div>\n      <p>Make a pr\u00e9cis of the following passage <b>within 120 words<\/b> and give it a suitable title.<\/p>\n      <div class=\"passage\">\n        <p>For most of history, a library was a building that guarded books. In ancient Nalanda and Alexandria, and in the monastery and university collections that followed, books were rare and costly, and the librarian's first duty was to preserve them. Access was a privilege of scholars, monks and the wealthy. The library was a store of knowledge, and its doors were not open to everyone.<\/p>\n        <p>The nineteenth and twentieth centuries turned this store into a public service. Cheap printing made books affordable, and reformers argued that an educated citizenry needed free access to them. Public libraries funded by taxes spread across Europe and North America, and in India the library movement found a champion in S. R. Ranganathan, whose Five Laws of Library Science, published in 1931, began with the simple principle that \"books are for use\". Several Indian states passed public library laws, starting with Madras in 1948. Libraries became places where workers, students and job-seekers could read newspapers, prepare for examinations and educate themselves.<\/p>\n        <p>The internet seemed at first to threaten this role. If information could be found on a phone in seconds, why visit a building to borrow a book? Visitor numbers in many libraries fell, budgets were cut, and some branches closed. Critics declared the library an institution of the past.<\/p>\n        <p>Instead, libraries have reinvented themselves once again. Many now lend e-books and audiobooks, offer free internet and computers, and run classes in digital skills for people who have never used an email account or filled in an online form. India's National Digital Library, developed at IIT Kharagpur, gives students free access to millions of digital resources. Libraries also host reading clubs for children, help elderly people use government websites, and provide quiet, safe study spaces for students from crowded homes, many of them young women preparing for competitive examinations. The modern library is less a warehouse of books than a community centre for learning.<\/p>\n        <p>This new role matters because the digital divide is real. Owning a smartphone is not the same as knowing how to judge whether online information is reliable, and the flood of information has made misinformation easier to spread. Librarians, trained to find, sort and evaluate sources, are well placed to teach these skills.<\/p>\n        <p>Yet the transformation is uneven. Many public libraries in India, especially in villages and small towns, still have outdated collections, irregular hours, untrained staff and no internet. Several states have no library law at all, and library funding is often the first item cut when budgets are tight.<\/p>\n        <p>If libraries are to fulfil their promise, they need steady funding, trained staff, reliable connectivity and partnerships with schools and local bodies. An institution that adapts to its users has outlived empires, scribes and printing presses. With support, the library can also help India's citizens find their way through the age of information.<\/p>\n      <\/div>\n      <label for=\"a2t\"><b>Title<\/b><\/label>\n      <input type=\"text\" id=\"a2t\" spellcheck=\"false\" autocorrect=\"off\" placeholder=\"Your title\">\n      <textarea id=\"a2\" spellcheck=\"false\" autocorrect=\"off\" placeholder=\"Write your pr\u00e9cis here.\"><\/textarea>\n      <span class=\"wc\" id=\"wc2\" data-min=\"110\" data-max=\"120\">0 words \u00b7 target 110\u2013120 (title not counted)<\/span>\n    <\/section>\n\n    <!-- Q3 -->\n    <section id=\"q3\" class=\"panel\" role=\"tabpanel\" hidden>\n      <div class=\"qhead\"><h2>Q3. Reading comprehension<\/h2><span class=\"marks\">40 marks \u00b7 8 each<\/span><\/div>\n      <p>Read the passage below and answer the questions based on it <b>in your own words<\/b>.<\/p>\n      <div class=\"passage\">\n        <p>The Hindu Kush Himalaya, stretching across eight countries from Afghanistan to Myanmar, holds more ice than any region outside the poles. That is why its glaciers are often called the \"third pole\" or the \"water towers of Asia\". Every summer their melt, together with snow and monsoon rain, feeds rivers such as the Indus, the Ganga and the Brahmaputra, on which well over a billion people depend for drinking water, irrigation and hydropower.<\/p>\n        <p>These water towers are shrinking. A 2023 assessment by the International Centre for Integrated Mountain Development (ICIMOD) found that the region's glaciers lost ice about 65 per cent faster in the 2010s than in the decade before, and that up to 80 per cent of their present volume could disappear by the end of the century if emissions stay high. Mountains warm faster than the global average, so even modest global warming means a sharp change at high altitude.<\/p>\n        <p>The paradox is that, for a while, melting glaciers will deliver more water, not less. As ice melts faster, the rivers it feeds swell, and farmers and dam operators may come to rely on the extra flow. But this is like drawing on a bank account that is not being refilled. Scientists expect many Himalayan basins to reach \"peak water\" around the middle of the century, after which summer flows will fall just when demand from growing cities and farms is highest. Rivers that depend most on meltwater, such as the Indus, are the most exposed.<\/p>\n        <p>Retreating glaciers also bring sudden danger. As the ice withdraws, meltwater collects in lakes held back by loose rock and debris. If an avalanche, a landslide or heavy rain breaches this natural dam, the lake can empty within hours, sending a wall of water and rubble down the valley. Such glacial lake outburst floods are not new, but they are becoming more frequent as the number and size of these lakes grow. In October 2023 the South Lhonak lake in Sikkim burst, destroying the Teesta III hydropower dam downstream and killing dozens of people. The Chamoli disaster in Uttarakhand in 2021, set off by a massive rock and ice avalanche, showed how quickly mountain hazards can overwhelm projects built in narrow valleys.<\/p>\n        <p>Mountain communities are the first to feel these changes, yet they are often the last to be consulted. Herders and farmers who have read the mountains for generations notice shifts in snowfall and springs long before instruments record them, and their knowledge can make early warning systems more effective. Where sirens and sensors have been installed above dangerous lakes, villagers trained to respond have gained precious minutes to escape.<\/p>\n        <p>Protecting the water towers ultimately requires deep cuts in global emissions, which no single country can deliver. But much can be done locally and regionally: mapping and monitoring risky lakes, lowering their water levels in advance, sharing river data across borders, and building dams and roads only after careful study of the hazards. The glaciers took thousands of years to form. How the region responds in the next few decades will decide whether their loss is managed or simply suffered.<\/p>\n      <\/div>\n      <div class=\"rcq\"><label for=\"r1\"><b>1.<\/b> Why are the Himalayan glaciers described as the &quot;water towers of Asia&quot;? <span class=\"marks\">8<\/span><\/label><textarea id=\"r1\" class=\"short\" spellcheck=\"false\" autocorrect=\"off\"><\/textarea><span class=\"wc\" id=\"wr1\" data-min=\"70\" data-max=\"85\">0 words<\/span><\/div>\n      <div class=\"rcq\"><label for=\"r2\"><b>2.<\/b> Compare the short-term and long-term effects of melting glaciers on the rivers they feed. <span class=\"marks\">8<\/span><\/label><textarea id=\"r2\" class=\"short\" spellcheck=\"false\" autocorrect=\"off\"><\/textarea><span class=\"wc\" id=\"wr2\" data-min=\"70\" data-max=\"85\">0 words<\/span><\/div>\n      <div class=\"rcq\"><label for=\"r3\"><b>3.<\/b> How do glacial lake outburst floods occur, and why are they becoming a greater threat? <span class=\"marks\">8<\/span><\/label><textarea id=\"r3\" class=\"short\" spellcheck=\"false\" autocorrect=\"off\"><\/textarea><span class=\"wc\" id=\"wr3\" data-min=\"70\" data-max=\"85\">0 words<\/span><\/div>\n      <div class=\"rcq\"><label for=\"r4\"><b>4.<\/b> Examine the role of mountain communities in responding to glacier-related hazards. <span class=\"marks\">8<\/span><\/label><textarea id=\"r4\" class=\"short\" spellcheck=\"false\" autocorrect=\"off\"><\/textarea><span class=\"wc\" id=\"wr4\" data-min=\"70\" data-max=\"85\">0 words<\/span><\/div>\n      <div class=\"rcq\"><label for=\"r5\"><b>5.<\/b> What measures does the author suggest, and what is the author's main purpose in writing the passage? <span class=\"marks\">8<\/span><\/label><textarea id=\"r5\" class=\"short\" spellcheck=\"false\" autocorrect=\"off\"><\/textarea><span class=\"wc\" id=\"wr5\" data-min=\"70\" data-max=\"85\">0 words<\/span><\/div>\n    <\/section>\n\n    <section id=\"done\" class=\"panel\" hidden>\n      <h2 id=\"doneHead\">Paper finished<\/h2>\n      <p>Press <b>Copy my answers<\/b> and paste the whole block into the thread. If copying doesn't work, the text below is already selected; copy it yourself.<\/p>\n      <div class=\"row\"><button id=\"copyBtn\">Copy my answers<\/button><span id=\"copyStatus\" class=\"status\" aria-live=\"polite\"><\/span><\/div>\n      <textarea id=\"outBox\" class=\"out\" readonly><\/textarea>\n      <div class=\"row\" hidden>\n        <button id=\"resetBtn\" class=\"danger\">Clear and start again<\/button>\n      <\/div>\n      <div id=\"resetBox\" class=\"row\" hidden>\n        <span>This deletes your answers from this browser.<\/span>\n        <button id=\"resetYes\" class=\"danger\">Delete answers<\/button><button id=\"resetNo\" class=\"ghost\">Cancel<\/button>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n  var KEY='pfrda-fullsim-p1-v1', LIMIT=3600;\n  var ids=['a1','a2t','a2','r1','r2','r3','r4','r5'];\n  var S={start:null,ended:null,cur:3,spent:{1:0,2:0,3:0},topic:null,ans:{}};\n  function load(){try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object')S=Object.assign(S,o);}}catch(e){}}\n  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}\n  function $(id){return document.getElementById(id);}\n  function words(t){t=(t||'').trim();return t?t.split(/\\s+/).length:0;}\n  function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}\n  function now(){return Date.now()/1000;}\n  function elapsed(){if(!S.start)return 0;var end=S.ended||now();return Math.min(LIMIT,end-S.start);}\n\n  function setWC(el,n){\n    var min=+el.dataset.min,max=+el.dataset.max,base=n+' words';\n    if(min){el.textContent=base+' \u00b7 target '+min+'\u2013'+max+(el.id==='wc2'?' (title not counted)':'');\n      el.className='wc '+(n===0?'':n<min?'under':n>max?'over':'ok');}\n    else el.textContent=base;\n  }\n  function counts(){\n    var e=words($('a1').value),p=words($('a2').value),r=0;\n    setWC($('wc1'),e);setWC($('wc2'),p);\n    for(var i=1;i<=5;i++){var n=words($('r'+i).value);r+=n;setWC($('wr'+i),n);}\n    $('tw1').textContent=e;$('tw2').textContent=p;$('tw3').textContent=r;\n    return {e:e,p:p,r:r};\n  }\n  function show(q){\n    S.cur=q;\n    [1,2,3].forEach(function(i){$('q'+i).hidden=(i!==q)||!!S.ended;});\n    document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',String(+b.dataset.q===q));});\n    save();\n  }\n  var last=null;\n  function tick(){\n    var t=now();\n    if(S.start&&!S.ended){\n      if(last!==null){S.spent[S.cur]=(S.spent[S.cur]||0)+Math.min(5,t-last);}\n      last=t;\n      var left=LIMIT-elapsed(),c=$('clock');\n      c.textContent=fmt(left);\n      c.className='clock'+(left<=0?' out':left<=600?' low':'');\n      if(left<=0){finish(true);return;}\n      save();\n    }\n  }\n  function lock(){ids.forEach(function(id){$(id).readOnly=true;});document.querySelectorAll('input[name=topic]').forEach(function(r){r.disabled=true;});}\n  function summary(){\n    var c=counts(),topicTxt='(no topic chosen)';\n    if(S.topic){var lab=$('t'+S.topic).nextElementSibling;topicTxt=lab.textContent;}\n    var used=elapsed(),L=[];\n    L.push('PFRDA PHASE II PAPER 1 MOCK 2 (NOV 2026) \u00b7 my answers');\n    L.push('Time used: '+fmt(used)+' of 60:00'+(used>=LIMIT?' (time ran out)':''));\n    L.push('Time per question: Q3 RC '+fmt(S.spent[3]||0)+' \u00b7 Q2 pr\u00e9cis '+fmt(S.spent[2]||0)+' \u00b7 Q1 essay '+fmt(S.spent[1]||0));\n    L.push('');\n    L.push('Q1 ESSAY \u00b7 topic '+topicTxt+' \u00b7 '+c.e+' words');\n    L.push($('a1').value.trim()||'(blank)');\n    L.push('');\n    L.push('Q2 PR\u00c9CIS \u00b7 '+c.p+' words');\n    L.push('Title: '+($('a2t').value.trim()||'(none)'));\n    L.push($('a2').value.trim()||'(blank)');\n    L.push('');\n    L.push('Q3 RC \u00b7 '+c.r+' words in total');\n    for(var i=1;i<=5;i++){L.push(i+'. '+($('r'+i).value.trim()||'(blank)')+' ['+words($('r'+i).value)+' words]');}\n    return L.join('\\n');\n  }\n  function finish(timeout){\n    if(!S.ended){S.ended=Math.min(now(),S.start+LIMIT);}\n    save();lock();\n    $('confirmBox').hidden=true;\n    [1,2,3].forEach(function(i){$('q'+i).hidden=true;});\n    $('done').hidden=false;\n    $('doneHead').textContent=timeout?'Time is up':'Paper finished';\n    $('clock').textContent=fmt(LIMIT-elapsed());\n    $('finishBtn').hidden=true;\n    document.querySelectorAll('.tab').forEach(function(b){b.disabled=true;});\n    var o=$('outBox');o.value=summary();\n    try{parent.postMessage({sim:'p1done',text:o.value,timeout:!!timeout},'*');}catch(e){}\n    try{o.focus();o.select();}catch(e){}\n  }\n  function begin(){\n    if(!S.start){S.start=now();}\n    $('intro').hidden=true;$('exam').hidden=false;\n    ids.forEach(function(id){if(S.ans[id]!=null)$(id).value=S.ans[id];});\n    if(S.topic)$('t'+S.topic).checked=true;\n    counts();\n    if(S.ended||elapsed()>=LIMIT){finish(elapsed()>=LIMIT&&!S.ended);return;}\n    show(S.cur||3);last=null;tick();\n    setInterval(tick,1000);\n    save();\n  }\n\n  load();\n  if(S.start){setTimeout(begin,0);}\n  if(S.start){$('startBtn').textContent=S.ended?'See my answers':'Resume the paper';\n    var rn=$('resumeNote');rn.hidden=false;rn.textContent=S.ended?'You have finished this paper.':'Paper in progress: '+fmt(LIMIT-elapsed())+' left.';}\n  $('startBtn').addEventListener('click',begin);\n  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){show(+b.dataset.q);window.scrollTo(0,0);});});\n  ids.forEach(function(id){$(id).addEventListener('input',function(){S.ans[id]=$(id).value;counts();save();});});\n  document.querySelectorAll('input[name=topic]').forEach(function(r){r.addEventListener('change',function(){S.topic=r.value;save();});});\n  $('finishBtn').addEventListener('click',function(){$('leftTxt').textContent=fmt(LIMIT-elapsed())+' left';$('confirmBox').hidden=false;window.scrollTo(0,0);});\n  $('confirmNo').addEventListener('click',function(){$('confirmBox').hidden=true;});\n  $('confirmYes').addEventListener('click',function(){finish(false);});\n  $('copyBtn').addEventListener('click',function(){\n    var o=$('outBox'),st=$('copyStatus');\n    function fallback(){try{o.focus();o.select();}catch(e){}st.textContent='Text selected. Copy it with Ctrl+C or Cmd+C.';}\n    try{navigator.clipboard.writeText(o.value).then(function(){st.textContent='Copied. Paste it into the thread.';},fallback);}catch(e){fallback();}\n  });\n  $('resetBtn').addEventListener('click',function(){$('resetBox').hidden=false;});\n  $('resetNo').addEventListener('click',function(){$('resetBox').hidden=true;});\n  $('resetYes').addEventListener('click',function(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();});\n})();\n<\/script>\n\n<\/body>\n<\/html>\n", P2 = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>PFRDA 2025 Phase II Paper 2<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n<style>\n/* Layout: exam-hall CBT console. Sticky timer bar, one question per screen, fixed action bar, sheet for the question palette. */\n:root{\n  --bg:#f3f5f7; --panel:#ffffff; --ink:#18212b; --muted:#5b6672; --line:#d9dee4;\n  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef6;\n  --ok:#1d7a4a; --ok-soft:#e1f2e8; --bad:#b4352c; --bad-soft:#f8e3e1;\n  --flag:#7a4cb0; --flag-soft:#eee6f8; --skip:#8a6a12; --skip-soft:#f6efd9;\n  --ui:\"IBM Plex Sans\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --read:\"Source Serif 4\",Georgia,\"Times New Roman\",serif;\n  --mono:\"IBM Plex Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;\n  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;\n  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;\n  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;\n  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;\n  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;\n  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums}\nh1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}\n.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}\n.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}\n.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}\n.btn.ghost{background:transparent}\n.btn.danger{color:var(--bad);border-color:var(--bad)}\n/* start */\n.start{display:grid;gap:16px}\n.start .panel{padding:18px}\n.start h1{font-size:24px}\n.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}\n.facts div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}\n.facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;font-weight:600}\n.tbl{overflow-x:auto}\ntable.sec{border-collapse:collapse;width:100%;font-size:14px}\ntable.sec th,table.sec td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}\ntable.sec td.r,table.sec th.r{text-align:right}\n.note{font-size:14px;color:var(--muted)}\n.row{display:flex;gap:10px;flex-wrap:wrap}\n/* top bar */\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}\n.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}\n.bar .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}\n.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--accent-soft)}\n.timer.low{background:var(--bad-soft);color:var(--bad)}\n.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:0 auto;scrollbar-width:none}\n.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n/* question */\n.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.qhead .marks{font-size:13px;color:var(--muted)}\ndetails.stem{margin-bottom:12px}\ndetails.stem summary{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0;cursor:pointer}\n.stem-body{font-family:var(--read);font-size:16.5px;line-height:1.6;max-height:55vh;overflow:auto;padding:4px 14px;border-left:3px solid var(--line);min-width:0}\n.stem-body p{margin:0 0 10px}\ntable.dt{border-collapse:collapse;font-family:var(--ui);font-size:15px;margin:6px 0 10px}\ntable.dt th,table.dt td{border:1px solid var(--line);padding:6px 12px;text-align:center}\n.qtext{font-size:17px;margin:0 0 14px;min-width:0;overflow-wrap:anywhere}\n.opts{display:grid;gap:10px}\n.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;min-height:52px}\n.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}\n.opt[aria-checked=\"true\"]{border-color:var(--accent);background:var(--accent-soft)}\n.opt[aria-checked=\"true\"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}\n.opt span:last-child{min-width:0;overflow-wrap:anywhere}\n/* bottom bar */\n.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}\n.foot-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.foot-in .btn{width:100%;font-size:14px;padding:8px 6px}\n@media (min-width:560px){.foot-in{grid-template-columns:repeat(4,1fr)}}\n/* sheet */\n.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}\n.sheet-in{background:var(--panel);width:100%;max-width:760px;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}\n.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin:8px 0 14px}\n.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}\n.pal-sec{margin:12px 0 4px;font-size:13px;font-weight:600}\n.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}\n.pal button{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px}\n.st-ans{background:var(--ok-soft)!important;border-color:var(--ok)!important;color:var(--ok)}\n.st-flag{background:var(--flag-soft)!important;border-color:var(--flag)!important;color:var(--flag)}\n.st-seen{background:var(--skip-soft)!important;border-color:var(--skip)!important;color:var(--skip)}\n.st-cur{outline:2px solid var(--ink);outline-offset:1px}\n.confirm{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px}\n/* results */\n.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}\n.score .big{font-family:var(--mono);font-size:40px;font-weight:600}\n.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}\n.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-skip{background:var(--skip-soft);color:var(--skip)}\n.rev{display:grid;gap:12px;margin-top:12px}\n.rq{padding:14px}\n.rq .opt{cursor:default;min-height:0;padding:8px 12px}\n.rq .opt.right{border-color:var(--ok);background:var(--ok-soft)}\n.rq .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}\n.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px;overflow-wrap:anywhere}\n.exp b{font-weight:600}\n@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}\n<\/style>\n\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n\n<script>\nconst DATA = {\"id\": \"fullsim-p2-2025-v1\", \"title\": \"PFRDA 2025 Phase II \u00b7 Paper 2\", \"short\": \"2025 Paper 2\", \"pass2\": 15, \"rule\": \"<ol style=\\\"margin:0;padding-left:20px;line-height:1.55\\\"><li><b>Pass 1 (first 25 min).<\\/b> Go straight through. Answer only what you are sure of. Anything that needs more than about a minute, or would be a guess, gets <i>Mark for review<\\/i> and you move on. Numericals you know the formula for count as sure.<\\/li><li><b>NOT / incorrect / cannot questions<\\/b> (7 in this paper). Read the stem twice, then mark each option T or F in your head. The answer is the odd one out: the F in a NOT question. Do not pick the first true-sounding option.<\\/li><li><b>Pass 2 (from 15:00 left; the page tells you).<\\/b> Open Questions, take marked ones first. Answer only where you can cut at least one option: with five options and \u2212\u00bc, a blind guess is worth zero on average, and every cut option makes it worth more.<\\/li><li><b>At 2:00 left<\\/b> stop working new questions and check nothing you meant to answer is blank.<\\/li><\\/ol>\", \"blurb\": \"The actual PFRDA Phase II Paper 2 from 2025 (General), all 50 questions as EduTap recollected them, in the paper's order and with EduTap's options and answer key. 2 marks each, 40 minutes, a quarter of the marks off per wrong answer. Treat it as exam day: no notes, no pausing. A few of these questions were tagged as PYQs on some deck cards, so some may feel familiar; your score may run a little high.\", \"gaps\": \"<b>What this paper does not cover.<\\/b> It is one year's paper: no AI &amp; ML, Media, or Marketing &amp; Communication (new in 2026), no Budget 2026-27 or Economic Survey, and no current affairs at all (2022 had 3). It has no Pension Act-section or UPS questions, and only 5 Finance questions. The 2022 real paper and Paper 2 Mock 3 cover more of those. Four pension facts have changed since 2025 (NPS Trust days, entry age, exit split, T+0); answer as of 2025, and the explanations flag the 2026 position.\", \"resnote\": \"2025 UR cut-off for Paper 2 was 60.5 out of 100; you scored 62.5 on the 2022 real paper. Aim for 70 or more. Explanations marked \\\"2026 note\\\" tell you where a 2025 fact has since changed.\", \"minutes\": 40, \"neg\": 0.25, \"sections\": [{\"name\": \"Finance\", \"n\": 5, \"marks\": 10}, {\"name\": \"Management\", \"n\": 7, \"marks\": 14}, {\"name\": \"Economics\", \"n\": 7, \"marks\": 14}, {\"name\": \"Companies Act\", \"n\": 7, \"marks\": 14}, {\"name\": \"Costing\", \"n\": 10, \"marks\": 20}, {\"name\": \"Commerce & Accountancy\", \"n\": 6, \"marks\": 12}, {\"name\": \"Pension\", \"n\": 8, \"marks\": 16}], \"stems\": {}, \"qs\": [{\"s\": \"Finance\", \"q\": \"Which of the following is not a subsidiary of RBI?\", \"o\": [\"REBIT\", \"DICGC\", \"IFTAS\", \"PFRDA\", \"BRBNMPL\"], \"a\": 3, \"e\": \"PFRDA is a statutory regulator under the PFRDA Act, 2013 (Ministry of Finance), not an RBI subsidiary. ReBIT (IT/cyber security), DICGC (deposit insurance), IFTAS (financial technology services) and BRBNMPL (note printing) are wholly owned by RBI.\", \"st\": null, \"neg\": true}, {\"s\": \"Finance\", \"q\": \"Which of the following is not a component of GST?\", \"o\": [\"CGST\", \"IGST\", \"SGST\", \"UTGST\", \"UIGST\"], \"a\": 4, \"e\": \"GST has four parts: CGST and SGST (intra-state), IGST (inter-state and imports) and UTGST (UTs without a legislature). 'UIGST' does not exist.\", \"st\": null, \"neg\": true}, {\"s\": \"Finance\", \"q\": \"Which of the following best defines a non-scheduled Bank in India?\", \"o\": [\"Banks which are included in the Second Schedule of the RBI Act, 1934\", \"Banks that cannot borrow from the RBI in emergencies\", \"Banks which are not covered in the Second Schedule of the RBI Act, 1934 and can borrow money from RBI in case of emergency\", \"Banks which provide only demand deposits\", \"Banks that are nationalised by the government\"], \"a\": 2, \"e\": \"Non-scheduled = not in the Second Schedule of the RBI Act, 1934. EduTap's key treats them as still able to borrow from RBI in an emergency. A is the definition of a scheduled bank; D and E are irrelevant to the schedule.\", \"st\": null, \"neg\": false}, {\"s\": \"Finance\", \"q\": \"Private equity is formed as ________, is registered with ________, and called ________?\", \"o\": [\"Company, RBI, Mutual Fund\", \"Trust, SEBI, Alternate Investment Fund\", \"Partnership, IRDAI, Venture Capital Fund\", \"Trust, PFRDA, Pension Fund\", \"LLP, Ministry of Corporate Affairs, Debt Fund\"], \"a\": 1, \"e\": \"PE funds in India are usually set up as trusts and registered with SEBI as Alternative Investment Funds (Category II) under the SEBI (AIF) Regulations, 2012.\", \"st\": null, \"neg\": false}, {\"s\": \"Finance\", \"q\": \"An investor invests Rs 20 lakhs in the futures of a blue-chip company at Rs 1050 per share. The market price later falls to Rs 1020. The futures contract lot size is 100 shares and the stock's beta are 1.25. What is the required number of contracts to hedge the portfolio?\", \"o\": [\"24\", \"25\", \"16\", \"20\", \"10\"], \"a\": 0, \"e\": \"Contracts = (portfolio value \u00d7 beta) \u00f7 (futures price \u00d7 lot size) = (20,00,000 \u00d7 1.25) \u00f7 (1,050 \u00d7 100) = 25,00,000 \u00f7 1,05,000 = 23.8 \u2248 24. The fall to 1,020 is a distractor.\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"Self-esteem is under which level of Maslow's hierarchy?\", \"o\": [\"Level 1\", \"Level 2\", \"Level 3\", \"Level 4\", \"Level 5\"], \"a\": 3, \"e\": \"1 physiological, 2 safety, 3 social/belonging, 4 esteem (self-esteem, recognition), 5 self-actualisation.\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"The process of laying objectives and goals is associated with which function of management?\", \"o\": [\"Planning\", \"Organizing\", \"Directing\", \"Staffing\", \"Controlling\"], \"a\": 0, \"e\": \"Planning is deciding in advance what to do: setting objectives and the course of action. The other functions carry out or check the plan.\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"Which of the following is the developmental role of HRD?\", \"o\": [\"Employee Engagement\", \"Recruitment\", \"Selection\", \"Improving working conditions\", \"Induction and Orientation\"], \"a\": 0, \"e\": \"Engagement is developmental (building commitment and growth). Recruitment, selection, induction and working conditions are administrative or maintenance roles.\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"There is a theory given by Goleman, which says 'do as I instruct', identify it?\", \"o\": [\"Affiliative Leadership\", \"Coercive Leadership\", \"Democratic Leadership\", \"Pacesetting Leadership\", \"Coaching Leadership\"], \"a\": 1, \"e\": \"Goleman's six styles: Coercive 'Do what I tell you'; Authoritative 'Come with me'; Affiliative 'People come first'; Democratic 'What do you think?'; Pacesetting 'Do as I do, now'; Coaching 'Try this'. Trap: Pacesetting is 'do as I <i>do<\\/i>', Coercive is 'do as I <i>say<\\/i>'.\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"Which of the following correctly represents the meanings of E, S, and L in the PESTEL analysis framework?\", \"o\": [\"E = Environmental, S = Structural, L = Legislative\", \"E = Economic, S = Social, L = Legal\", \"E = Emotional, S = Societal, L = Logistical\", \"E = Ecological, S = Service, L = Lawful\", \"E = Educational, S = Supportive, L = Local\"], \"a\": 1, \"e\": \"PESTEL = Political, Economic, Social, Technological, Environmental, Legal. Only B has all three right (the first E is Economic).\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"Which of the following best describes the Pygmalion effect?\", \"o\": [\"It is a phenomenon where negative feedback leads to poor performance in individuals.\", \"It is a psychological phenomenon where higher expectations lead to improved performance in individuals, often resulting in a self-fulfilling prophecy.\", \"It refers to the tendency of people to imitate the behaviour of others.\", \"It is an effect where low expectations lead to higher achievements.\", \"It describes the impact of the workplace environment on employee satisfaction.\"], \"a\": 1, \"e\": \"Pygmalion (Rosenthal) effect: high expectations raise performance, a self-fulfilling prophecy. The reverse (low expectations lower performance) is the Golem effect.\", \"st\": null, \"neg\": false}, {\"s\": \"Management\", \"q\": \"Match the following:<br>1. Business can beat competitors through<br>2. Organisation achieves targets with<br>3. The firm grows in new markets through<br>4. Employees stay motivated by<br>5. Customer loyalty increases due to<br><br>A. Innovation &nbsp; B. Recognition &nbsp; C. Team Work &nbsp; D. Market Research &nbsp; E. Service Quality\", \"o\": [\"1\u2013A, 2\u2013C, 3\u2013D, 4\u2013B, 5\u2013E\", \"1\u2013B, 2\u2013C, 3\u2013A, 4\u2013E, 5\u2013D\", \"1\u2013E, 2\u2013A, 3\u2013C, 4\u2013B, 5\u2013D\", \"1\u2013D, 2\u2013B, 3\u2013A, 4\u2013E, 5\u2013C\", \"1\u2013A, 2\u2013B, 3\u2013E, 4\u2013C, 5\u2013D\"], \"a\": 0, \"e\": \"Competitors \u2192 innovation; targets \u2192 teamwork; new markets \u2192 market research; motivation \u2192 recognition; loyalty \u2192 service quality. Shortcut: lock 1\u2013A and 4\u2013B, only A has both.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"What is the formula for GDP Deflator?\", \"o\": [\"Nominal GDP / Price Index * 100\", \"Nominal GDP / Real GDP * 100\", \"(Nominal GDP \u2013 Real GDP) / Real GDP * 100\", \"Real GDP / Price Index * 100\", \"Real GDP / Nominal GDP * 100\"], \"a\": 1, \"e\": \"GDP deflator = (Nominal GDP \u00f7 Real GDP) \u00d7 100. E is the inverse; C is a growth-style formula.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"Which of the following is most significant index for price?<br>1. GDP Deflator<br>2. Wholesale Price Index (WPI)<br>3. Consumer Price Index (CPI)\", \"o\": [\"1 and 2\", \"2 and 3\", \"3 only\", \"1, 2, and 3\", \"1 and 3\"], \"a\": 2, \"e\": \"CPI (Combined) is RBI's nominal anchor under flexible inflation targeting, so it is the most significant. 'Most significant' asks for one index, so '3 only'.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"A rise in the general price level caused by an increase in aggregate demand over available supply describes the _____\", \"o\": [\"Demand Pull Inflation\", \"Cost Push Inflation\", \"Cost Pull Inflation\", \"Demand Push Inflation\", \"None of the above\"], \"a\": 0, \"e\": \"Excess demand over supply = demand-pull. Cost-push comes from rising input costs. 'Cost pull' and 'demand push' are made-up mixes.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"Which of the following correctly represents the formula of the Money Multiplier?\", \"o\": [\"Reserve Deposits (M2) / Broad Money (M3)\", \"Broad Money (M3) / Narrow Money (M0)\", \"Cash Reserve Ratio \u00d7 Broad Money\", \"Narrow Money (M0) / Broad Money (M3)\", \"Monetary Base / Narrow Money\"], \"a\": 1, \"e\": \"Money multiplier = M3 \u00f7 M0 (broad money \u00f7 reserve money). The option calls M0 'narrow money', which is loose (narrow money is M1), but B is the only ratio of the right shape.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"Which of the following statement/s are considered for calculating the national income?<br>1. All the addition of value to the intermediate goods by a firm using the factors of production is included in the added method<br>2. All the expenditures made on goods and services produced in the domestic territory during a year is included in the expenditure method<br>3. All the income generated from factors of production, that is wages, interest, rent etc. is included\", \"o\": [\"1 and 2\", \"2 and 3\", \"1 and 3\", \"All of the above\", \"2 only\"], \"a\": 3, \"e\": \"The three methods: value added (product), expenditure and income. Each statement describes one, so all three.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"Under the flexible inflation targeting framework adopted by the Reserve Bank of India (RBI) as per the RBI Act, 1934, what is the tolerance band for CPI Inflation?\", \"o\": [\"3% \u00b1 2%\", \"4% \u00b1 2%\", \"5% \u00b1 2%\", \"6% \u00b1 2%\", \"2% \u00b1 2%\"], \"a\": 1, \"e\": \"Target CPI inflation 4% with a band of \u00b12% (2\u20136%), under Section 45ZA of the RBI Act, 1934.\", \"st\": null, \"neg\": false}, {\"s\": \"Economics\", \"q\": \"What is the relationship between M, V, P, and T in the Fisher's transaction approach to Demand for Money?\", \"o\": [\"MV = PT\", \"MV = P + T\", \"MV = P/T\", \"MV + PT = 0\", \"MV \u2212 PT = 1\"], \"a\": 0, \"e\": \"Fisher's equation of exchange: MV = PT (money \u00d7 velocity = price level \u00d7 transactions).\", \"st\": null, \"neg\": false}, {\"s\": \"Companies Act\", \"q\": \"As per the Companies Act, 2013, when an auditor resigns, to whom must the auditor intimate their resignation?\", \"o\": [\"The Shareholders of the company\", \"The Registrar of Companies (RoC)\", \"The Board of Directors of the company\", \"The Ministry of Corporate Affairs (MCA)\", \"The Securities and Exchange Board of India (SEBI)\"], \"a\": 1, \"e\": \"Section 140(2): a resigning auditor files a statement in Form ADT-3 with the company and the Registrar within 30 days of resignation.\", \"st\": null, \"neg\": false}, {\"s\": \"Companies Act\", \"q\": \"Under Section 125 of the Companies Act, 2013, the funds accumulated in the Investor Education and Protection Fund (IEPF) cannot be used for which of the following purposes?\", \"o\": [\"To refund unclaimed dividends to shareholders\", \"To fund investor awareness programs\", \"To finance the purchase of unsubscribed shares\", \"To promote financial literacy among investors\", \"To defray expenses incurred in administering the IEPF\"], \"a\": 2, \"e\": \"Section 125(3) lists the uses: refunds of unclaimed dividends/matured deposits etc., investor education and awareness, distribution of disgorged amounts, legal expenses in class actions and administration of the fund. Financing share purchases is not a permitted use.\", \"st\": null, \"neg\": true}, {\"s\": \"Companies Act\", \"q\": \"Under Section 44 of the Indian Companies Act, 2013, shares and debentures are classified as:\", \"o\": [\"Movable property only\", \"Immovable property only\", \"Both movable and immovable property\", \"Neither movable nor immovable property\", \"Recognized as intangible assets under company accounts\"], \"a\": 0, \"e\": \"Section 44: shares, debentures or other interest of a member are movable property, transferable as the articles provide.\", \"st\": null, \"neg\": false}, {\"s\": \"Companies Act\", \"q\": \"As per the Companies Act, 2013, when a public issue is made, the company must inform which of the following?\", \"o\": [\"Government Authorities\", \"Stock Exchanges where securities are proposed to be listed\", \"Shareholders only\", \"Registrar of Companies\", \"Credit Rating Agencies\"], \"a\": 1, \"e\": \"Section 40(1): before a public offer, the company must apply to one or more recognised stock exchanges for permission to deal in the securities.\", \"st\": null, \"neg\": false}, {\"s\": \"Companies Act\", \"q\": \"Under the Companies Act, 2013, who is primarily responsible for addressing the grievances of shareholders?\", \"o\": [\"The Board of Directors\", \"The Stakeholders Relationship Committee\", \"Remuneration and Nomination Committee\", \"The Securities and Exchange Board of India (SEBI)\", \"The Audit Committee\"], \"a\": 1, \"e\": \"Section 178(5): a company with more than 1,000 security holders must have a Stakeholders Relationship Committee to resolve their grievances.\", \"st\": null, \"neg\": false}, {\"s\": \"Companies Act\", \"q\": \"Under the Companies Act, 2013, who is considered a \\\"small shareholder\\\" based on the value of shares held?\", \"o\": [\"A shareholder holding shares worth less than Rs 50,000\", \"A shareholder holding shares worth less than Rs 10,000\", \"A shareholder holding shares worth less than Rs 20,000\", \"A shareholder holding shares worth less than Rs 1,00,000\", \"A shareholder holding shares worth less than Rs 5,000\"], \"a\": 2, \"e\": \"Section 151 explanation: a small shareholder holds shares of nominal value of not more than \u20b920,000. 1,000 small shareholders (or 1/10th) can elect one small shareholders' director in a listed company.\", \"st\": null, \"neg\": false}, {\"s\": \"Companies Act\", \"q\": \"Which of the following criteria best defines a \\\"startup\\\" as per the standard definition?<br>1. Age of the business (less than 7 years)<br>2. Profitability (must be profitable within the first 5 years)<br>3. Originality of the product or service (unique and innovative offering)\", \"o\": [\"1 only\", \"1 and 2 only\", \"3 only\", \"1 and 3 only\", \"All of the above\"], \"a\": 2, \"e\": \"DPIIT definition (Feb 2019): up to 10 years from incorporation, turnover not above \u20b9100 crore in any year, working on innovation or a scalable model. Statement 1 is wrong (7 years was the old limit), statement 2 is never a criterion, so 3 only.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"Which type of costing method is used in the sugar industry?\", \"o\": [\"Job Costing\", \"Batch Costing\", \"Process Costing\", \"Contract Costing\", \"Unit Costing\"], \"a\": 2, \"e\": \"Continuous production through stages (crushing, boiling, crystallising) of a uniform product = process costing. Same for cement, chemicals, oil refining.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"Which of the following is the primary objective of Cost Accounting?\", \"o\": [\"Cost Ascertainment\", \"Cost Book Keeping\", \"Cost Audit\", \"Cost Control\", \"Decision Making\"], \"a\": 0, \"e\": \"The first and primary objective is ascertainment of cost; control and decision support build on it.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"The Number of defects in six sigma are_______?\", \"o\": [\"3.4 Defects Per Million\", \"3.4 defects per 10 million\", \"5.3 defects per million\", \"2700 defects per million\", \"63 defects per million\"], \"a\": 0, \"e\": \"Six Sigma = 3.4 defects per million opportunities (99.99966% defect-free).\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"A company plans to manufacture 50,000 mixer grinders and sell each at Rs 5,000. The project requires an investment of Rs 60 crore, and the company desires a 15% ROI. At what cost per unit should the company manufacture the product?\", \"o\": [\"Rs 4,200\", \"Rs 4,350\", \"Rs 3,200\", \"Rs 4,600\", \"Rs 4,750\"], \"a\": 2, \"e\": \"Target cost = price \u2212 required profit. Revenue 50,000 \u00d7 5,000 = \u20b925 cr; profit 15% \u00d7 60 cr = \u20b99 cr; target cost \u20b916 cr \u00f7 50,000 = \u20b93,200.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"Which of the following is NOT a principle of Total Quality Management (TQM) according to Deming's 14 Points?\", \"o\": [\"Eliminate inspection. Built-in quality.\", \"Drive out fear.\", \"Dependence on inspection to ensure quality.\", \"Institute training on the job.\", \"Break down barriers. Work as a team.\"], \"a\": 2, \"e\": \"Deming's point 3 is 'Cease dependence on inspection; build quality in'. Option C states the opposite, so it is not a principle.\", \"st\": null, \"neg\": true}, {\"s\": \"Costing\", \"q\": \"A manufacturing company has the following data for a product:<br>Prime Cost: Rs 50,000<br>Factory rent: 150% of Depreciation<br>Depreciation: Rs 2,000<br>Calculate the Factory Cost of the product.\", \"o\": [\"Rs 55,000\", \"Rs 54,500\", \"Rs 50,000\", \"Rs 56,000\", \"Rs 53,250\"], \"a\": 0, \"e\": \"Factory overheads = depreciation 2,000 + rent (150% \u00d7 2,000) 3,000 = 5,000. Factory cost = 50,000 + 5,000 = \u20b955,000.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"A company has the following data for a material cost analysis using Activity Based Costing (ABC):<br>Material Cost = Rs 2,00,000<br>Number of orders = 35<br>Material Ordering Cost = Rs 5,000<br>Material Handling Cost = Rs 3,000<br>Labour Cost = Rs 3,00,000<br>What is the total material cost?\", \"o\": [\"Rs 2,05,000\", \"Rs 2,08,000\", \"Rs 2,11,000\", \"Rs 2,14,000\", \"Rs 2,18,000\"], \"a\": 1, \"e\": \"Material cost + material-related activity costs = 2,00,000 + 5,000 + 3,000 = \u20b92,08,000. Labour and the number of orders are distractors.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"Which of the following statements is incorrect regarding the classification of costs on a payable basis as variable?\", \"o\": [\"Cost varies directly with the level of production.\", \"Material cost is a typical example of variable cost.\", \"Administration cost is a variable cost.\", \"Direct labor cost can be treated as a variable cost.\", \"Selling commission varies with sales and is a variable cost.\"], \"a\": 2, \"e\": \"Administration overheads (office rent, salaries) are mostly fixed, so calling them variable is the incorrect statement.\", \"st\": null, \"neg\": true}, {\"s\": \"Costing\", \"q\": \"Which of the following best defines \\\"opportunity cost\\\"?\", \"o\": [\"The monetary cost of producing goods and services.\", \"The cost incurred on labor in a specific project.\", \"The value of the best alternative foregone when a choice is made.\", \"The fixed cost associated with running a business.\", \"The sum of all explicit costs only.\"], \"a\": 2, \"e\": \"Opportunity cost = value of the next best alternative given up. It is not recorded in the books.\", \"st\": null, \"neg\": false}, {\"s\": \"Costing\", \"q\": \"Costs cannot be classified on the basis of which of the following?\", \"o\": [\"Cost by Nature (Material, Labour, Overheads)\", \"Cost by Function (Production, Selling, Distribution)\", \"Cost by Expenditure (Administrative)\", \"Cost by Behavior (Fixed, Variable, Semi-variable)\", \"Cost by Time (Historical, Standard, Predetermined)\"], \"a\": 2, \"e\": \"Recognised bases: nature/element, function, behaviour/variability, time, controllability, normality, relation to product. 'By expenditure' is not one (administration is a function).\", \"st\": null, \"neg\": true}, {\"s\": \"Commerce & Accountancy\", \"q\": \"A company has a current market price of Rs 125 per share. It issues Right Shares at Rs 50 each at 20% premium in the ratio of 1:5. Calculate the Ex-right price and the Value of Right per share.\", \"o\": [\"Ex-right price = Rs 114.16; Value of right = Rs 10.84\", \"Ex-right price = Rs 112.50; Value of right = Rs 12.50\", \"Ex-right price = Rs 95.00; Value of right = Rs 30.00\", \"Ex-right price = Rs 110.00; Value of right = Rs 15.00\", \"Ex-right price = Rs 100.83; Value of right = Rs 24.17\"], \"a\": 0, \"e\": \"Issue price = 50 + 20% premium = \u20b960. TERP = (5 \u00d7 125 + 1 \u00d7 60) \u00f7 6 = 685 \u00f7 6 = \u20b9114.17. Value of right (per existing share) = 125 \u2212 114.17 = \u20b910.83 (EduTap rounds to 114.16/10.84).\", \"st\": null, \"neg\": false}, {\"s\": \"Commerce & Accountancy\", \"q\": \"Which of the following is considered an asset covered under Accounting Standard (AS) 2 Valuation of Inventories?\", \"o\": [\"Investment in shares and securities\", \"Harvested crops at government minimum assured price\", \"Government securities purchased\", \"Construction work-in-progress (WIP) for long-term projects\", \"Assets used for ordinary course of business\"], \"a\": 4, \"e\": \"AS 2 covers assets held for sale in the ordinary course of business, in production for such sale, or as materials to be consumed. Excluded: financial instruments (A, C), producers' agricultural produce at NRV (B), construction contract WIP (D, under AS 7).\", \"st\": null, \"neg\": false}, {\"s\": \"Commerce & Accountancy\", \"q\": \"What is the effect of issuing bonus shares by a company?\", \"o\": [\"Number of shares in circulation increases\", \"Company's total net worth increases\", \"Paid-up share capital decreases\", \"Shareholders' total wealth decreases\", \"Company's liabilities increase\"], \"a\": 0, \"e\": \"Bonus issue capitalises reserves: share count and paid-up capital rise, reserves fall by the same amount, so net worth and shareholder wealth are unchanged.\", \"st\": null, \"neg\": false}, {\"s\": \"Commerce & Accountancy\", \"q\": \"Which of the following statements about non-integrated foreign operations is incorrect  will be incurred to sell it. What is the value at which this remaining inventory should be reported in the financial statements as per AS 2?\", \"o\": [\"16.0 lakhs\", \"15.0 lakhs\", \"14.4 lakhs\", \"13.6 lakhs\", \"12.0 lakhs\"], \"a\": 3, \"e\": \"Cost of remaining 40% = \u20b914 lakh. NRV = 16 \u2212 15% \u00d7 16 = \u20b913.6 lakh. Lower of cost and NRV = \u20b913.6 lakh.\", \"st\": null, \"neg\": false}, {\"s\": \"Pension\", \"q\": \"The scheme launched for workers in the unorganised sector, not covered under any Central or State Government pension scheme, where the Government contributes Rs 1,000 per year is known as \u2014\", \"o\": [\"Atal Pension Yojana\", \"NPS \u2013 All Citizens Model\", \"NPS\u2013Lite Swavalamban\", \"PM Shram Yogi Maandhan\", \"PM Kisan Maan Dhan Yojana\"], \"a\": 2, \"e\": \"Swavalamban (2010): Govt co-contribution \u20b91,000 a year for unorganised-sector NPS-Lite subscribers saving \u20b91,000\u201312,000 a year. <i>2026 note:<\\/i> closed to new entrants from 2015 and migrated to APY. APY's Govt co-contribution (50%, max \u20b91,000 a year for 5 years) applied only to those who joined by 31 Mar 2016, so the plain 'Govt contributes Rs 1,000 per year' scheme is Swavalamban.\", \"st\": null, \"neg\": false}, {\"s\": \"Pension\", \"q\": \"As per PFRDA (Redressal of Subscriber Grievance) Regulations, 2015, every intermediary (such as CRA, POP, Trustee Bank, etc.) must resolve or reply to a grievance received from a subscriber within how many days of its receipt?\", \"o\": [\"7 days\", \"15 days\", \"30 days\", \"45 days\", \"60 days\"], \"a\": 2, \"e\": \"Level 1, intermediary: 30 days. Then NPS Trust 21 days, appeal to the Ombudsman within 45 days, award within 90 days.\", \"st\": null, \"neg\": false}, {\"s\": \"Pension\", \"q\": \"As per the PFRDA (Redressal of Subscriber Grievance) Regulations, 2015 (as amended), the NPS Trust must resolve or reply to a grievance received from a subscriber within how many days of its receipt?\",
