<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFRDA Paper 1 Mock 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: exam-hall CBT console. Sticky timer bar, one question per screen, fixed action bar, sheet for the question palette. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#18212b; --muted:#5b6672; --line:#d9dee4;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef6;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --bad:#b4352c; --bad-soft:#f8e3e1;
  --flag:#7a4cb0; --flag-soft:#eee6f8; --skip:#8a6a12; --skip-soft:#f6efd9;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;
  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;
  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;
  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;
  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
/* start */
.start{display:grid;gap:16px}
.start .panel{padding:18px}
.start h1{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
.facts div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;font-weight:600}
.tbl{overflow-x:auto}
table.sec{border-collapse:collapse;width:100%;font-size:14px}
table.sec th,table.sec td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.sec td.r,table.sec th.r{text-align:right}
.note{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--accent-soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qhead .marks{font-size:13px;color:var(--muted)}
details.stem{margin-bottom:12px}
details.stem summary{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0;cursor:pointer}
.stem-body{font-family:var(--read);font-size:16.5px;line-height:1.6;max-height:55vh;overflow:auto;padding:4px 14px;border-left:3px solid var(--line);min-width:0}
.stem-body p{margin:0 0 10px}
table.dt{border-collapse:collapse;font-family:var(--ui);font-size:15px;margin:6px 0 10px}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.qtext{font-size:17px;margin:0 0 14px;min-width:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;min-height:52px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
/* bottom bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot-in .btn{width:100%;font-size:14px;padding:8px 6px}
@media (min-width:560px){.foot-in{grid-template-columns:repeat(4,1fr)}}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--panel);width:100%;max-width:760px;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.pal-sec{margin:12px 0 4px;font-size:13px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pal button{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px}
.st-ans{background:var(--ok-soft)!important;border-color:var(--ok)!important;color:var(--ok)}
.st-flag{background:var(--flag-soft)!important;border-color:var(--flag)!important;color:var(--flag)}
.st-seen{background:var(--skip-soft)!important;border-color:var(--skip)!important;color:var(--skip)}
.st-cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px}
/* results */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:40px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-skip{background:var(--skip-soft);color:var(--skip)}
.rev{display:grid;gap:12px;margin-top:12px}
.rq{padding:14px}
.rq .opt{cursor:default;min-height:0;padding:8px 12px}
.rq .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.rq .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px;overflow-wrap:anywhere}
.exp b{font-weight:600}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>

</head>
<body>
<div id="app"></div>

<script>
const DATA = {"id": "p1m1-v1", "title": "PFRDA Paper 1 Mock 1", "short": "PFRDA P1 · Mock 1", "blurb": "English, Quantitative Aptitude, Reasoning and General Awareness, modelled on the 2022 and 2025 papers and the 2026 pattern. All questions are new.", "minutes": 60, "neg": 0.25, "sections": [{"name": "English Language", "n": 20, "marks": 25}, {"name": "Quantitative Aptitude", "n": 20, "marks": 25}, {"name": "Reasoning", "n": 30, "marks": 25}, {"name": "General Awareness", "n": 20, "marks": 25}], "stems": {"rc": "<p><b>Directions:<\/b> Read the passage carefully and answer the questions.<\/p>\n<p>For most of the twentieth century, a job came bundled with security: a monthly wage, a provident fund and, at the end of a long career, a pension. The rise of platform work has quietly unbundled that arrangement. Delivery riders, ride-hailing drivers and freelance designers are paid per task, and the platforms that coordinate them insist that they are \"partners\", not employees. The label matters, because labour law in most countries attaches social-security obligations to the employer–employee relationship.<\/p>\n<p>Supporters of the platform model argue that it offers what traditional employment rarely did: flexibility. A student can work three evenings a week; a homemaker can log in while the children are at school. Critics reply that this flexibility is often <b>illusory<\/b>. Algorithms decide who gets the next order, rating systems penalise workers who decline tasks, and incentive schemes reward exactly the long, unbroken hours that \"flexible\" work was supposed to make unnecessary.<\/p>\n<p>The deeper problem is time. A worker in her twenties rarely thinks about retirement, and a worker paid by the task has no employer to make that decision for her. Without automatic deductions, saving for old age depends on willpower, and willpower is a poor substitute for design. Behavioural economists have shown repeatedly that people save far more when enrolment is the default and opting out requires effort.<\/p>\n<p>Policymakers have begun to respond. India's Code on Social Security, 2020 recognises gig and platform workers as a distinct category and envisages a fund financed partly by platform contributions. Such measures are a beginning, but they will succeed only if contributions are <b>portable<\/b> across platforms, simple to make and visible to the worker. A safety net that a worker cannot see is one she is unlikely to trust, and one she does not trust is one she will not use. The real test of the new arrangements, therefore, is not whether they exist on paper but whether they ______.<\/p>", "pj": "<p><b>Directions:<\/b> Rearrange the following five sentences (A)–(E) to form a meaningful paragraph, then answer the questions.<\/p>\n<p>(A) Within a few years, however, it had grown into the backbone of everyday retail payments in the country.<br>\n(B) When the Unified Payments Interface was launched in 2016, few expected it to change much beyond a niche of tech-savvy users.<br>\n(C) This success has prompted several countries to link their own payment systems with it.<br>\n(D) Its growth was driven by a simple design: any bank account could send money to any other using just a mobile phone.<br>\n(E) Such cross-border linkages, in turn, are making remittances cheaper and faster for millions of migrant workers.<\/p>", "swap": "<p><b>Directions:<\/b> In each sentence, four words are marked (A), (B), (C) and (D). They may or may not be in their correct places. Choose the interchange that makes the sentence meaningful and correct. If no change is needed, choose \"No interchange required\".<\/p>", "err": "<p><b>Directions:<\/b> Each sentence is divided into parts (A), (B), (C) and (D). Find the part that contains a grammatical or usage error. If there is no error, choose \"No error\".<\/p>", "fill": "<p><b>Directions:<\/b> Choose the pair of words that best fills both blanks.<\/p>", "quad": "<p><b>Directions:<\/b> Two equations (I) and (II) are given. Solve both and choose the correct relationship between x and y.<\/p>", "cas": "<p><b>Directions:<\/b> Read the information and answer the questions.<\/p>\n<p>In a recruitment drive for two posts, X and Y, the ratio of applicants for X to applicants for Y was 8 : 7. There were 4,800 applicants for X. 35% of the applicants for X and 40% of the applicants for Y qualified the written test. Of those who qualified, 25% for X and 30% for Y were finally selected. Of those selected, 80% for X and 75% for Y joined.<\/p>", "di": "<p><b>Directions:<\/b> The table shows the number of laptops sold by five stores in a year and the percentage of those that were gaming laptops. All other laptops sold were non-gaming laptops.<\/p>\n<table class=\"dt\"><tr><th>Store<\/th><th>Laptops sold<\/th><th>% gaming<\/th><\/tr>\n<tr><td>A<\/td><td>480<\/td><td>25%<\/td><\/tr>\n<tr><td>B<\/td><td>560<\/td><td>30%<\/td><\/tr>\n<tr><td>C<\/td><td>420<\/td><td>40%<\/td><\/tr>\n<tr><td>D<\/td><td>640<\/td><td>15%<\/td><\/tr>\n<tr><td>E<\/td><td>500<\/td><td>32%<\/td><\/tr><\/table>", "floor": "<p><b>Directions:<\/b> Study the information and answer the questions.<\/p>\n<p>Eight persons, P, Q, R, S, T, U, V and W, live on different floors of an eight-storey building. The lowermost floor is numbered 1 and the topmost floor is numbered 8. Each of them is from a different city: Agra, Bhopal, Chennai, Delhi, Goa, Indore, Jaipur and Kochi.<\/p>\n<p>R lives on an odd-numbered floor. Three persons live between R and S, and S lives below R. V lives immediately below R. The person from Goa lives immediately below R. The person from Jaipur lives immediately above R. W lives three floors above Q. Q lives immediately above the person from Indore. Only one person lives between the person from Goa and the person from Indore. The person from Chennai lives below U. P lives immediately below T, and P lives above the person from Jaipur. The person from Agra lives immediately below the person from Kochi. The person from Bhopal lives two floors below the person from Delhi.<\/p>", "date": "<p><b>Directions:<\/b> Study the information and answer the questions.<\/p>\n<p>Eight persons, A, B, C, D, E, F, G and H, have a meeting each on the 10th and 24th of April, May, July and October of the same year, one person per date. Each of them likes a different subject: English, Hindi, Maths, Physics, Chemistry, Biology, History and Geography.<\/p>\n<p>H has a meeting on the 10th of a month having 31 days. Two persons have meetings between H and C, and C meets after H. A meets in a month having 31 days, but not in October. The number of persons who meet before G is the same as the number of persons who meet after D. F meets after C. E meets before B. The one who likes Biology meets immediately before D. The one who likes Geography meets on the 10th of a month, and three persons meet between the ones who like Geography and Physics. The one who likes Physics meets in May. The one who likes History meets on the 10th of the month having 30 days. The one who likes English meets immediately after the one who likes Physics. F likes Hindi. The one who likes Maths meets in the same month as the one who likes History. B does not like English.<\/p>", "io": "<p><b>Directions:<\/b> A machine rearranges a line of numbers step by step. Study the illustration and answer the questions.<\/p>\n<p><b>Input:<\/b> 34 71 18 56 92 27 63 45<br>\n<b>Step 1:<\/b> 92 34 71 56 27 63 45 18<br>\n<b>Step 2:<\/b> 92 71 34 56 63 45 27 18<br>\n<b>Step 3:<\/b> 92 71 63 56 45 34 27 18<br>\nStep 3 is the last step for this input.<\/p>\n<p>Apply the same logic to the input: <b>48 15 83 62 29 97 36 54<\/b><\/p>", "syl": "<p><b>Directions:<\/b> Take the statements to be true even if they seem at variance with commonly known facts. Decide which conclusion(s) logically follow.<\/p>", "ineq": "<p><b>Directions:<\/b> Assume the statement is true and decide which conclusion(s) definitely follow.<\/p>"}, "qs": [{"s": "English Language", "q": "Which of the following best completes the blank at the end of the passage?", "o": ["eliminate platform work altogether", "actually change how workers save for their old age", "are approved by Parliament within a year", "replace the employer–employee relationship in every sector", "raise the profits of platform companies"], "a": 1, "e": "The paragraph argues that measures must be portable, simple and visible because a safety net workers cannot see or trust will not be used. So the real test is whether the arrangements change actual saving behaviour, not whether they exist on paper. The other options are never discussed as goals.", "st": "rc"}, {"s": "English Language", "q": "According to the passage, why does calling platform workers \"partners\" matter?", "o": ["Partners are exempt from income tax", "Labour law usually ties social-security obligations to the employer–employee relationship", "Partners must register separately with every platform they use", "Partners cannot be rated by customers", "Partners are paid a higher rate per task than employees"], "a": 1, "e": "The first paragraph says: \"The label matters, because labour law in most countries attaches social-security obligations to the employer–employee relationship.\" If workers are not employees, platforms escape those obligations.", "st": "rc"}, {"s": "English Language", "q": "How do critics view the flexibility offered by platform work?", "o": ["As a reason to ban platform companies", "As the main cause of low wages in traditional jobs", "As genuine, but available only to students", "As more valuable to workers than a pension", "As often illusory, because algorithms, ratings and incentives push workers into long, unbroken hours"], "a": 4, "e": "Paragraph 2: critics say flexibility is \"often illusory\" because algorithms allot orders, ratings penalise refusals, and incentives reward long, unbroken hours.", "st": "rc"}, {"s": "English Language", "q": "Which of the following can be inferred from the passage?", "o": ["Behavioural economists oppose the platform model", "Platform workers are legally treated as employees in India", "Most platform workers are students or homemakers", "The Code on Social Security, 2020 has fully solved the problem of old-age saving", "Making enrolment in a retirement scheme the default would likely raise savings among platform workers"], "a": 4, "e": "The passage says people save far more when enrolment is the default and that platform workers lack automatic deductions. Together these imply default enrolment would raise their savings. The passage calls the Code \"a beginning\", so the last option is wrong. Students and homemakers are given only as examples.", "st": "rc"}, {"s": "English Language", "q": "Which word is closest in meaning to <b>illusory<\/b> as used in the passage?", "o": ["obvious", "deceptive", "temporary", "imaginative", "generous"], "a": 1, "e": "Illusory means based on illusion, not real: the flexibility only appears to exist. 'Deceptive' fits. 'Imaginative' means creative, which is a different sense.", "st": "rc"}, {"s": "English Language", "q": "Which word is most nearly OPPOSITE in meaning to <b>portable<\/b> as used in the passage?", "o": ["transferable", "movable", "convenient", "fixed", "flexible"], "a": 3, "e": "Portable contributions can move with the worker across platforms. The opposite is 'fixed', meaning tied to one place or platform. 'Transferable' and 'movable' are synonyms.", "st": "rc"}, {"s": "English Language", "q": "Each of the candidates who appeared for the interview (A)/ were asked to submit (B)/ a copy of the (C)/ educational certificates. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 1, "e": "The subject is 'Each', which is singular, so the verb must be 'was asked', not 'were asked'. The error is in part B.", "st": "err"}, {"s": "English Language", "q": "Had the regulator acted sooner, (A)/ the losses suffered by investors (B)/ could have been (C)/ substantially reduce. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 3, "e": "After 'could have been', the passive needs the past participle: 'substantially reduced'. The error is in part D. 'Had the regulator acted' is a correct inverted conditional.", "st": "err"}, {"s": "English Language", "q": "The number of investors opting for (A)/ systematic investment plans (B)/ have increased sharply (C)/ over the last five years. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 2, "e": "'The number of ...' takes a singular verb: 'has increased'. (Compare: 'A number of investors have ...'.) The error is in part C.", "st": "err"}, {"s": "English Language", "q": "No sooner had the results been announced (A)/ than the students rushed (B)/ to the notice board (C)/ to check their scores. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 4, "e": "'No sooner had ... than' is the correct construction, the tenses are right, and 'their' agrees with 'students'. There is no error.", "st": "err"}, {"s": "English Language", "q": "Which sentence should come FIRST after rearrangement?", "o": ["Sentence A", "Sentence B", "Sentence C", "Sentence D", "Sentence E"], "a": 1, "e": "The order is B-A-D-C-E. B introduces UPI's 2016 launch and low expectations. A contrasts with it ('however, it had grown'). D explains that growth ('Its growth'). C refers to 'This success' and the link-ups with other countries. E follows from C ('Such cross-border linkages').", "st": "pj"}, {"s": "English Language", "q": "Which sentence should come FOURTH after rearrangement?", "o": ["Sentence A", "Sentence B", "Sentence C", "Sentence D", "Sentence E"], "a": 2, "e": "The order is B-A-D-C-E, so the fourth sentence is C.", "st": "pj"}, {"s": "English Language", "q": "The auditor's report <b>highlighted (A)<\/b> several discrepancies in the accounts, which the management later <b>rectified (B)<\/b> after a detailed <b>reconciliation (C)<\/b> of all pending <b>entries (D)<\/b>.", "o": ["A-B only", "B-C only", "A-B and C-D", "A-D and B-C", "No interchange required"], "a": 4, "e": "The sentence already reads correctly: the report highlighted discrepancies, which were rectified after reconciling pending entries. No interchange is needed.", "st": "swap"}, {"s": "English Language", "q": "The committee <b>rejected (A)<\/b> the proposal because its <b>benefits (B)<\/b> clearly outweighed its <b>costs (C)<\/b>, and members unanimously <b>endorsed (D)<\/b> the decision.", "o": ["A-B only", "B-C only", "A-B and C-D", "A-D and B-C", "No interchange required"], "a": 1, "e": "Rejecting a proposal because its benefits outweigh its costs is illogical. Swap B and C: 'because its costs clearly outweighed its benefits'.", "st": "swap"}, {"s": "English Language", "q": "Heavy <b>prices (A)<\/b> during the monsoon damaged the standing crops, and the resulting shortage drove up the <b>rainfall (B)<\/b> of vegetables, hurting urban <b>consumers (C)<\/b> who <b>depend (D)<\/b> on market supplies.", "o": ["A-B only", "B-C only", "A-B and C-D", "A-D and B-C", "No interchange required"], "a": 0, "e": "Swap A and B: 'Heavy rainfall during the monsoon damaged the crops ... drove up the prices of vegetables'. C and D are already correct.", "st": "swap"}, {"s": "English Language", "q": "Investors usually <b>bear (A)<\/b> a higher return for <b>demanding (B)<\/b> greater risk, which is why <b>equity (C)<\/b> can be expected to lag behind <b>government bonds (D)<\/b> over long periods.", "o": ["A-B only", "B-C only", "A-B and C-D", "A-D and B-C", "No interchange required"], "a": 2, "e": "Swap A-B: investors 'demand' a higher return for 'bearing' risk. Swap C-D: because riskier assets earn more, 'government bonds' can be expected to lag behind 'equity'.", "st": "swap"}, {"s": "English Language", "q": "The minister's speech was ______ on rhetoric but ______ on specifics, leaving analysts unsure of the policy's direction.", "o": ["weak, strong", "heavy, light", "brief, detailed", "silent, vocal", "light, heavy"], "a": 1, "e": "Analysts were left unsure, so the speech had plenty of rhetoric and few specifics: 'heavy on rhetoric but light on specifics'. 'Light, heavy' or 'brief, detailed' would have given analysts clarity.", "st": "fill"}, {"s": "English Language", "q": "Despite the company's ______ quarterly results, its share price ______ as investors worried about rising debt.", "o": ["modest, stabilised", "robust, slumped", "dismal, soared", "weak, plunged", "impressive, surged"], "a": 1, "e": "'Despite' signals a contrast, and debt worries push the price down. So: good results, falling price: 'robust, slumped'. 'Weak, plunged' has no contrast.", "st": "fill"}, {"s": "English Language", "q": "The new regulation is intended to ______ fraud, not to ______ honest businesses with paperwork.", "o": ["curb, burden", "tolerate, relieve", "detect, exempt", "encourage, reward", "prevent, assist"], "a": 0, "e": "The regulation aims to curb fraud, not to burden honest firms. 'Burden ... with paperwork' is the natural collocation. 'Assist ... with paperwork' reverses the intended contrast.", "st": "fill"}, {"s": "English Language", "q": "Her argument was so ______ that even her harshest critics found it difficult to ______ it.", "o": ["flimsy, accept", "lengthy, admire", "tentative, support", "cogent, refute", "vague, ignore"], "a": 3, "e": "Harsh critics would want to refute the argument, and they struggled to because it was so convincing. 'Cogent' means clear and convincing.", "st": "fill"}, {"s": "Quantitative Aptitude", "q": "I. x² − 17x + 72 = 0<br>II. y² − 13y + 40 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 2, "e": "I: (x − 8)(x − 9) = 0, so x = 8, 9.<br>II: (y − 5)(y − 8) = 0, so y = 5, 8.<br>Compare: 8 = 8, 8 > 5, 9 > 8, 9 > 5. Every x is ≥ every y, so x ≥ y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. x² + 11x + 30 = 0<br>II. y² + 7y + 12 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 1, "e": "I: (x + 5)(x + 6) = 0, so x = −5, −6.<br>II: (y + 3)(y + 4) = 0, so y = −3, −4.<br>The largest x (−5) is below the smallest y (−4), so x < y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. 2x² − 11x + 15 = 0<br>II. 3y² − 14y + 16 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 4, "e": "I: (2x − 5)(x − 3) = 0, so x = 2.5, 3.<br>II: (3y − 8)(y − 2) = 0, so y = 2, 8/3 ≈ 2.67.<br>x = 2.5 is less than y = 2.67 but greater than y = 2. No single relation holds, so no relation can be established.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. x² − 22x + 120 = 0<br>II. y² − 29y + 210 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 1, "e": "I: (x − 10)(x − 12) = 0, so x = 10, 12.<br>II: (y − 14)(y − 15) = 0, so y = 14, 15.<br>Every x is less than every y, so x < y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. x² = 361<br>II. y = √361", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 3, "e": "I: x = +19 or −19.<br>II: √ denotes the positive root, so y = 19.<br>x = 19 = y, or x = −19 < y. So x ≤ y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "Two trains, 240 m and 210 m long, cross each other completely in 15 seconds when running in opposite directions. Running in the same direction, the faster train crosses the slower one in 75 seconds. What is the speed of the faster train?", "o": ["57.6 km/h", "64.8 km/h", "54 km/h", "72 km/h", "43.2 km/h"], "a": 1, "e": "Total length = 240 + 210 = 450 m.<br>Opposite directions: a + b = 450/15 = 30 m/s.<br>Same direction: a − b = 450/75 = 6 m/s.<br>So a = (30 + 6)/2 = 18 m/s = 18 × 18/5 = 64.8 km/h.", "st": null}, {"s": "Quantitative Aptitude", "q": "A and B start a business with ₹45,000 and ₹60,000. After 4 months, A adds ₹15,000 and B withdraws ₹20,000. C joins after 6 months with ₹75,000. The total profit at the end of the year is ₹2,00,400. What is B's share?", "o": ["₹79,200", "₹72,000", "₹67,200", "₹54,000", "₹64,800"], "a": 2, "e": "Capital × months:<br>A = 45,000×4 + 60,000×8 = 6,60,000<br>B = 60,000×4 + 40,000×8 = 5,60,000<br>C = 75,000×6 = 4,50,000<br>Ratio 66 : 56 : 45, total 167.<br>B's share = 2,00,400 × 56/167 = 1,200 × 56 = ₹67,200.", "st": null}, {"s": "Quantitative Aptitude", "q": "The present ages of P and Q are in the ratio 5 : 7. Six years ago, the ratio was 3 : 5. R is 4 years older than the average present age of P and Q. What will R's age be after 5 years?", "o": ["25 years", "31 years", "29 years", "26 years", "27 years"], "a": 4, "e": "(5k − 6)/(7k − 6) = 3/5, so 25k − 30 = 21k − 18 and k = 3.<br>P = 15, Q = 21, average = 18.<br>R = 18 + 4 = 22. After 5 years: 27.", "st": null}, {"s": "Quantitative Aptitude", "q": "The compound interest on a sum at 20% per annum (compounded annually) for 2 years exceeds the simple interest on the same sum at 16% per annum for 2 years by ₹1,320. What is the sum?", "o": ["₹13,200", "₹10,500", "₹12,000", "₹11,000", "₹11,500"], "a": 3, "e": "CI for 2 years at 20% = P(1.2² − 1) = 0.44P.<br>SI for 2 years at 16% = 0.32P.<br>0.44P − 0.32P = 0.12P = 1,320, so P = ₹11,000.", "st": null}, {"s": "Quantitative Aptitude", "q": "The perimeter of a rectangle equals the circumference of a circle of radius 42 cm. The length and breadth of the rectangle are in the ratio 7 : 4. What is the area of the rectangle? (Take π = 22/7.)", "o": ["3,969 cm²", "3,888 cm²", "4,116 cm²", "4,200 cm²", "4,032 cm²"], "a": 4, "e": "Circumference = 2 × 22/7 × 42 = 264 cm.<br>2(7k + 4k) = 264, so k = 12.<br>Length = 84, breadth = 48, area = 84 × 48 = 4,032 cm².", "st": null}, {"s": "Quantitative Aptitude", "q": "A batter's average after 12 innings is 46. After the 13th innings, the average rises by 2. How many runs were scored in the 13th innings?", "o": ["74", "68", "72", "76", "70"], "a": 2, "e": "Runs after 12 innings = 12 × 46 = 552.<br>Runs after 13 innings = 13 × 48 = 624.<br>13th innings = 624 − 552 = 72.", "st": null}, {"s": "Quantitative Aptitude", "q": "A can finish a job in 10 days and B in 15 days. They work on alternate days, with A working on the first day. In how many days will the job be finished?", "o": ["12½ days", "12 days", "11½ days", "13 days", "11 days"], "a": 1, "e": "Each 2-day cycle does 1/10 + 1/15 = 1/6 of the job.<br>5 cycles (10 days) do 5/6, leaving 1/6.<br>Day 11 (A): 1/10, leaving 1/6 − 1/10 = 1/15.<br>Day 12 (B): B does exactly 1/15 in a full day. Total: 12 days.", "st": null}, {"s": "Quantitative Aptitude", "q": "How many candidates in all, for posts X and Y together, did NOT qualify the written test?", "o": ["5,640", "5,280", "5,820", "5,460", "6,000"], "a": 0, "e": "Applicants: X = 4,800; Y = 4,800 × 7/8 = 4,200.<br>Qualified: X = 35% of 4,800 = 1,680; Y = 40% of 4,200 = 1,680.<br>Not qualified: X = 3,120; Y = 2,520. Total = 5,640.", "st": "cas"}, {"s": "Quantitative Aptitude", "q": "The candidates who joined post Y are what percentage of the applicants for post Y?", "o": ["7.5%", "12%", "8%", "9%", "10.5%"], "a": 3, "e": "Y qualified = 1,680. Selected = 30% of 1,680 = 504. Joined = 75% of 504 = 378.<br>378/4,200 × 100 = 9%.", "st": "cas"}, {"s": "Quantitative Aptitude", "q": "What is the ratio of the candidates selected for X who did not join to the candidates who joined Y?", "o": ["1 : 4", "2 : 7", "4 : 15", "3 : 10", "2 : 9"], "a": 4, "e": "X selected = 25% of 1,680 = 420. Joined = 80% of 420 = 336, so 84 did not join.<br>Y joined = 378.<br>84 : 378 = 2 : 9 (dividing both by 42).", "st": "cas"}, {"s": "Quantitative Aptitude", "q": "What is the total number of gaming laptops sold by all five stores?", "o": ["688", "698", "736", "712", "724"], "a": 3, "e": "Gaming: A = 25% of 480 = 120; B = 30% of 560 = 168; C = 40% of 420 = 168; D = 15% of 640 = 96; E = 32% of 500 = 160.<br>Total = 120 + 168 + 168 + 96 + 160 = 712.", "st": "di"}, {"s": "Quantitative Aptitude", "q": "The number of non-gaming laptops sold by store D is approximately what percent more than the number sold by store A?", "o": ["48.50%", "53.33%", "51.11%", "55.00%", "46.67%"], "a": 2, "e": "Non-gaming: D = 640 − 96 = 544; A = 480 − 120 = 360.<br>(544 − 360)/360 × 100 = 184/360 × 100 = 51.11%.", "st": "di"}, {"s": "Quantitative Aptitude", "q": "What is the ratio of gaming laptops sold by stores B and C together to non-gaming laptops sold by store E?", "o": ["7 : 8", "84 : 85", "21 : 20", "85 : 84", "42 : 43"], "a": 1, "e": "Gaming B + C = 168 + 168 = 336. Non-gaming E = 500 − 160 = 340.<br>336 : 340 = 84 : 85.", "st": "di"}, {"s": "Quantitative Aptitude", "q": "What is the average number of non-gaming laptops sold per store?", "o": ["381.2", "372.4", "377.6", "385.0", "369.8"], "a": 2, "e": "Non-gaming: A 360, B 392, C 252, D 544, E 340. Sum = 1,888.<br>Average = 1,888/5 = 377.6.", "st": "di"}, {"s": "Quantitative Aptitude", "q": "If a gaming laptop sells for ₹80,000 and a non-gaming laptop for ₹45,000, what was store C's total revenue from laptops?", "o": ["₹238.2 lakh", "₹259.4 lakh", "₹247.8 lakh", "₹252.6 lakh", "₹241.5 lakh"], "a": 2, "e": "C: gaming = 168, non-gaming = 252.<br>168 × 0.80 lakh = 134.4 lakh; 252 × 0.45 lakh = 113.4 lakh.<br>Total = ₹247.8 lakh.", "st": "di"}, {"s": "Reasoning", "q": "Who lives on the topmost floor?", "o": ["P", "R", "T", "W", "U"], "a": 2, "e": "Final arrangement (floor: person, city): 8: T, Kochi · 7: P, Agra · 6: W, Jaipur · 5: R, Delhi · 4: V, Goa · 3: Q, Bhopal · 2: U, Indore · 1: S, Chennai.<br>How: R is on an odd floor with S four floors below, so R is 5 or 7. V and Goa sit just below R, and Jaipur just above. If R were 7, Jaipur would be 8, leaving no floor for P above Jaipur. So R = 5, S = 1, V = 4 (Goa) and Jaipur = 6. P is above Jaipur and just below T, so P = 7 and T = 8. Indore is two floors from Goa (2 or 6), and 6 is Jaipur, so Indore = 2, Q = 3, W = 6 and U = 2. The cities left for floors 1, 3, 5, 7 and 8 are Agra, Bhopal, Chennai, Delhi and Kochi. Agra just below Kochi gives 7 and 8. Chennai is below U (floor 2), so Chennai = 1, and then Bhopal = 3 and Delhi = 5.", "st": "floor"}, {"s": "Reasoning", "q": "Which city is V from?", "o": ["Jaipur", "Goa", "Delhi", "Bhopal", "Indore"], "a": 1, "e": "Final arrangement (floor: person, city): 8: T, Kochi · 7: P, Agra · 6: W, Jaipur · 5: R, Delhi · 4: V, Goa · 3: Q, Bhopal · 2: U, Indore · 1: S, Chennai.<br>How: R is on an odd floor with S four floors below, so R is 5 or 7. V and Goa sit just below R, and Jaipur just above. If R were 7, Jaipur would be 8, leaving no floor for P above Jaipur. So R = 5, S = 1, V = 4 (Goa) and Jaipur = 6. P is above Jaipur and just below T, so P = 7 and T = 8. Indore is two floors from Goa (2 or 6), and 6 is Jaipur, so Indore = 2, Q = 3, W = 6 and U = 2. The cities left for floors 1, 3, 5, 7 and 8 are Agra, Bhopal, Chennai, Delhi and Kochi. Agra just below Kochi gives 7 and 8. Chennai is below U (floor 2), so Chennai = 1, and then Bhopal = 3 and Delhi = 5.", "st": "floor"}, {"s": "Reasoning", "q": "How many persons live between Q and the person from Kochi?", "o": ["Five", "Two", "None", "Three", "Four"], "a": 4, "e": "Q is on floor 3 and Kochi (T) on floor 8. Floors 4, 5, 6 and 7 lie between them: four persons.<br>Final arrangement (floor: person, city): 8: T, Kochi · 7: P, Agra · 6: W, Jaipur · 5: R, Delhi · 4: V, Goa · 3: Q, Bhopal · 2: U, Indore · 1: S, Chennai.<br>How: R is on an odd floor with S four floors below, so R is 5 or 7. V and Goa sit just below R, and Jaipur just above. If R were 7, Jaipur would be 8, leaving no floor for P above Jaipur. So R = 5, S = 1, V = 4 (Goa) and Jaipur = 6. P is above Jaipur and just below T, so P = 7 and T = 8. Indore is two floors from Goa (2 or 6), and 6 is Jaipur, so Indore = 2, Q = 3, W = 6 and U = 2. The cities left for floors 1, 3, 5, 7 and 8 are Agra, Bhopal, Chennai, Delhi and Kochi. Agra just below Kochi gives 7 and 8. Chennai is below U (floor 2), so Chennai = 1, and then Bhopal = 3 and Delhi = 5.", "st": "floor"}, {"s": "Reasoning", "q": "Four of the following five are alike in a certain way and form a group. Who does NOT belong to the group?", "o": ["W", "U", "T", "R", "V"], "a": 3, "e": "U (2), V (4), W (6) and T (8) live on even-numbered floors. R lives on floor 5, an odd floor.<br>Final arrangement (floor: person, city): 8: T, Kochi · 7: P, Agra · 6: W, Jaipur · 5: R, Delhi · 4: V, Goa · 3: Q, Bhopal · 2: U, Indore · 1: S, Chennai.<br>How: R is on an odd floor with S four floors below, so R is 5 or 7. V and Goa sit just below R, and Jaipur just above. If R were 7, Jaipur would be 8, leaving no floor for P above Jaipur. So R = 5, S = 1, V = 4 (Goa) and Jaipur = 6. P is above Jaipur and just below T, so P = 7 and T = 8. Indore is two floors from Goa (2 or 6), and 6 is Jaipur, so Indore = 2, Q = 3, W = 6 and U = 2. The cities left for floors 1, 3, 5, 7 and 8 are Agra, Bhopal, Chennai, Delhi and Kochi. Agra just below Kochi gives 7 and 8. Chennai is below U (floor 2), so Chennai = 1, and then Bhopal = 3 and Delhi = 5.", "st": "floor"}, {"s": "Reasoning", "q": "Which of the following is true?", "o": ["P is from Agra", "S lives immediately below Q", "The person from Delhi lives on an even-numbered floor", "W lives below R", "None of these"], "a": 0, "e": "P is on floor 7, which is Agra ✓. S (1) is not immediately below Q (3). Delhi is on floor 5 (odd). W (6) is above R (5).<br>Final arrangement (floor: person, city): 8: T, Kochi · 7: P, Agra · 6: W, Jaipur · 5: R, Delhi · 4: V, Goa · 3: Q, Bhopal · 2: U, Indore · 1: S, Chennai.<br>How: R is on an odd floor with S four floors below, so R is 5 or 7. V and Goa sit just below R, and Jaipur just above. If R were 7, Jaipur would be 8, leaving no floor for P above Jaipur. So R = 5, S = 1, V = 4 (Goa) and Jaipur = 6. P is above Jaipur and just below T, so P = 7 and T = 8. Indore is two floors from Goa (2 or 6), and 6 is Jaipur, so Indore = 2, Q = 3, W = 6 and U = 2. The cities left for floors 1, 3, 5, 7 and 8 are Agra, Bhopal, Chennai, Delhi and Kochi. Agra just below Kochi gives 7 and 8. Chennai is below U (floor 2), so Chennai = 1, and then Bhopal = 3 and Delhi = 5.", "st": "floor"}, {"s": "Reasoning", "q": "Who likes Chemistry?", "o": ["A", "G", "B", "E", "C"], "a": 2, "e": "Final arrangement: 10 Apr: E, History · 24 Apr: G, Maths · 10 May: H, Physics · 24 May: A, English · 10 Jul: B, Chemistry · 24 Jul: C, Biology · 10 Oct: D, Geography · 24 Oct: F, Hindi.<br>How: History is on 10 April (the only 30-day month), so Maths is 24 April. Physics is in May, and Geography is on a 10th four places away, so Physics = 10 May, Geography = 10 October and English = 24 May. H is on the 10th of a 31-day month, with C three places later and F after C. Only H = 10 May and C = 24 July work. So H likes Physics. F likes Hindi, comes after C, and cannot be on 10 October (Geography), so F = 24 October. July's subjects are Chemistry and Biology. Biology is just before D, so D is on 24 July or 10 October. 24 July is C, so D = 10 October (Geography) and C likes Biology. One person meets after D, so one meets before G: G = 24 April (Maths). E is before B, so E = 10 April (History). A and B take 24 May and 10 July. B does not like English, so B = 10 July (Chemistry) and A = 24 May (English).", "st": "date"}, {"s": "Reasoning", "q": "How many persons have meetings between G and the one who likes Geography?", "o": ["Two", "One", "Five", "Three", "Four"], "a": 4, "e": "G meets on 24 April and Geography (D) on 10 October. Between them: 10 May, 24 May, 10 July and 24 July, which is four persons.<br>Final arrangement: 10 Apr: E, History · 24 Apr: G, Maths · 10 May: H, Physics · 24 May: A, English · 10 Jul: B, Chemistry · 24 Jul: C, Biology · 10 Oct: D, Geography · 24 Oct: F, Hindi.<br>How: History is on 10 April (the only 30-day month), so Maths is 24 April. Physics is in May, and Geography is on a 10th four places away, so Physics = 10 May, Geography = 10 October and English = 24 May. H is on the 10th of a 31-day month, with C three places later and F after C. Only H = 10 May and C = 24 July work. So H likes Physics. F likes Hindi, comes after C, and cannot be on 10 October (Geography), so F = 24 October. July's subjects are Chemistry and Biology. Biology is just before D, so D is on 24 July or 10 October. 24 July is C, so D = 10 October (Geography) and C likes Biology. One person meets after D, so one meets before G: G = 24 April (Maths). E is before B, so E = 10 April (History). A and B take 24 May and 10 July. B does not like English, so B = 10 July (Chemistry) and A = 24 May (English).", "st": "date"}, {"s": "Reasoning", "q": "Four of the following five are alike in a certain way and form a group. Who does NOT belong to the group?", "o": ["F", "C", "G", "A", "H"], "a": 4, "e": "G, A, C and F all meet on the 24th. H meets on the 10th.<br>Final arrangement: 10 Apr: E, History · 24 Apr: G, Maths · 10 May: H, Physics · 24 May: A, English · 10 Jul: B, Chemistry · 24 Jul: C, Biology · 10 Oct: D, Geography · 24 Oct: F, Hindi.<br>How: History is on 10 April (the only 30-day month), so Maths is 24 April. Physics is in May, and Geography is on a 10th four places away, so Physics = 10 May, Geography = 10 October and English = 24 May. H is on the 10th of a 31-day month, with C three places later and F after C. Only H = 10 May and C = 24 July work. So H likes Physics. F likes Hindi, comes after C, and cannot be on 10 October (Geography), so F = 24 October. July's subjects are Chemistry and Biology. Biology is just before D, so D is on 24 July or 10 October. 24 July is C, so D = 10 October (Geography) and C likes Biology. One person meets after D, so one meets before G: G = 24 April (Maths). E is before B, so E = 10 April (History). A and B take 24 May and 10 July. B does not like English, so B = 10 July (Chemistry) and A = 24 May (English).", "st": "date"}, {"s": "Reasoning", "q": "Which of the following is correct?", "o": ["D meets on 24 October", "A likes English", "E likes Maths", "H meets in July", "None of these"], "a": 1, "e": "A meets on 24 May and likes English ✓. D meets on 10 October, E likes History, and H meets in May.<br>Final arrangement: 10 Apr: E, History · 24 Apr: G, Maths · 10 May: H, Physics · 24 May: A, English · 10 Jul: B, Chemistry · 24 Jul: C, Biology · 10 Oct: D, Geography · 24 Oct: F, Hindi.<br>How: History is on 10 April (the only 30-day month), so Maths is 24 April. Physics is in May, and Geography is on a 10th four places away, so Physics = 10 May, Geography = 10 October and English = 24 May. H is on the 10th of a 31-day month, with C three places later and F after C. Only H = 10 May and C = 24 July work. So H likes Physics. F likes Hindi, comes after C, and cannot be on 10 October (Geography), so F = 24 October. July's subjects are Chemistry and Biology. Biology is just before D, so D is on 24 July or 10 October. 24 July is C, so D = 10 October (Geography) and C likes Biology. One person meets after D, so one meets before G: G = 24 April (Maths). E is before B, so E = 10 April (History). A and B take 24 May and 10 July. B does not like English, so B = 10 July (Chemistry) and A = 24 May (English).", "st": "date"}, {"s": "Reasoning", "q": "Who meets immediately after the one who likes Physics?", "o": ["C", "A", "B", "E", "G"], "a": 1, "e": "Physics is H on 10 May. The next date, 24 May, is A.<br>Final arrangement: 10 Apr: E, History · 24 Apr: G, Maths · 10 May: H, Physics · 24 May: A, English · 10 Jul: B, Chemistry · 24 Jul: C, Biology · 10 Oct: D, Geography · 24 Oct: F, Hindi.<br>How: History is on 10 April (the only 30-day month), so Maths is 24 April. Physics is in May, and Geography is on a 10th four places away, so Physics = 10 May, Geography = 10 October and English = 24 May. H is on the 10th of a 31-day month, with C three places later and F after C. Only H = 10 May and C = 24 July work. So H likes Physics. F likes Hindi, comes after C, and cannot be on 10 October (Geography), so F = 24 October. July's subjects are Chemistry and Biology. Biology is just before D, so D is on 24 July or 10 October. 24 July is C, so D = 10 October (Geography) and C likes Biology. One person meets after D, so one meets before G: G = 24 April (Maths). E is before B, so E = 10 April (History). A and B take 24 May and 10 July. B does not like English, so B = 10 July (Chemistry) and A = 24 May (English).", "st": "date"}, {"s": "Reasoning", "q": "How many steps are needed to complete the arrangement?", "o": ["Two", "Four", "Five", "Three", "Six"], "a": 1, "e": "Step 3 is not yet in order (48 is before 54), so a fourth step is needed.<br>Logic: in each step, the largest remaining number goes to the leftmost free place and the smallest remaining number to the rightmost free place. The others keep their order.<br>Input: 48 15 83 62 29 97 36 54<br>Step 1: 97 48 83 62 29 36 54 15<br>Step 2: 97 83 48 62 36 54 29 15<br>Step 3: 97 83 62 48 54 36 29 15<br>Step 4: 97 83 62 54 48 36 29 15 (final)", "st": "io"}, {"s": "Reasoning", "q": "Which number is third from the left in Step 2?", "o": ["36", "48", "54", "83", "62"], "a": 1, "e": "Logic: in each step, the largest remaining number goes to the leftmost free place and the smallest remaining number to the rightmost free place. The others keep their order.<br>Input: 48 15 83 62 29 97 36 54<br>Step 1: 97 48 83 62 29 36 54 15<br>Step 2: 97 83 48 62 36 54 29 15<br>Step 3: 97 83 62 48 54 36 29 15<br>Step 4: 97 83 62 54 48 36 29 15 (final)", "st": "io"}, {"s": "Reasoning", "q": "What is the sum of the second number from the right in Step 1 and the fourth number from the left in Step 3?", "o": ["116", "102", "110", "91", "98"], "a": 1, "e": "Step 1, second from right: 54. Step 3, fourth from left: 48. Sum = 102.<br>Logic: in each step, the largest remaining number goes to the leftmost free place and the smallest remaining number to the rightmost free place. The others keep their order.<br>Input: 48 15 83 62 29 97 36 54<br>Step 1: 97 48 83 62 29 36 54 15<br>Step 2: 97 83 48 62 36 54 29 15<br>Step 3: 97 83 62 48 54 36 29 15<br>Step 4: 97 83 62 54 48 36 29 15 (final)", "st": "io"}, {"s": "Reasoning", "q": "What is the difference between the fifth number from the left in Step 3 and the third number from the right in Step 1?", "o": ["6", "18", "25", "20", "12"], "a": 1, "e": "Step 3, fifth from left: 54. Step 1, third from right: 36. Difference = 18.<br>Logic: in each step, the largest remaining number goes to the leftmost free place and the smallest remaining number to the rightmost free place. The others keep their order.<br>Input: 48 15 83 62 29 97 36 54<br>Step 1: 97 48 83 62 29 36 54 15<br>Step 2: 97 83 48 62 36 54 29 15<br>Step 3: 97 83 62 48 54 36 29 15<br>Step 4: 97 83 62 54 48 36 29 15 (final)", "st": "io"}, {"s": "Reasoning", "q": "Which number is fourth from the right in the final step?", "o": ["54", "36", "29", "48", "62"], "a": 3, "e": "Final: 97 83 62 54 48 36 29 15. From the right: 15, 29, 36, 48. The fourth is 48.<br>Logic: in each step, the largest remaining number goes to the leftmost free place and the smallest remaining number to the rightmost free place. The others keep their order.<br>Input: 48 15 83 62 29 97 36 54<br>Step 1: 97 48 83 62 29 36 54 15<br>Step 2: 97 83 48 62 36 54 29 15<br>Step 3: 97 83 62 48 54 36 29 15<br>Step 4: 97 83 62 54 48 36 29 15 (final)", "st": "io"}, {"s": "Reasoning", "q": "<b>Statements:<\/b> Some Pens are Books. All Books are Copies. No Copy is a Bag.<br><b>Conclusions:<\/b><br>I. Some Pens are not Bags.<br>II. All Books being Pens is a possibility.", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 4, "e": "I: The pens that are books are copies, and no copy is a bag, so those pens are not bags. Follows.<br>II: Nothing stops every book from also being a pen. Possible, so it follows.<br>Both follow.", "st": "syl"}, {"s": "Reasoning", "q": "<b>Statements:<\/b> All Tables are Chairs. Only a few Chairs are Sofas. No Sofa is a Bed.<br><b>Conclusions:<\/b><br>I. All Tables being Sofas is a possibility.<br>II. Some Beds are Chairs.", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 0, "e": "'Only a few Chairs are Sofas' means some chairs are sofas and some are not.<br>I: Tables can lie entirely inside the chairs that are sofas. Possible, so it follows.<br>II: The relation between beds and chairs is not definite, so it does not follow.<br>Only I follows.", "st": "syl"}, {"s": "Reasoning", "q": "<b>Statements:<\/b> Some Rivers are Lakes. All Lakes are Ponds. No Pond is a Sea.<br><b>Conclusions:<\/b><br>I. Some Rivers are Seas.<br>II. No River is a Sea.", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 2, "e": "Rivers that are lakes are ponds, so they are not seas. Other rivers may or may not be seas, so neither conclusion is definite on its own.<br>I ('Some … are') and II ('No … is') have the same subject and predicate and together cover all cases. Either I or II follows.", "st": "syl"}, {"s": "Reasoning", "q": "<b>Statement:<\/b> A > B ≥ C = D < E ≤ F<br><b>Conclusions:<\/b><br>I. A > D<br>II. B > E", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 0, "e": "I: A > B ≥ C = D, so A > D. True.<br>II: B ≥ C = D < E. The signs open in opposite directions, so no relation can be fixed. False.<br>Only I follows.", "st": "ineq"}, {"s": "Reasoning", "q": "<b>Statement:<\/b> M ≤ N < O = P ≥ Q > R<br><b>Conclusions:<\/b><br>I. M < P<br>II. R < O", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 4, "e": "I: M ≤ N < O = P, so M < P. True.<br>II: O = P ≥ Q > R, so O > R. True.<br>Both follow.", "st": "ineq"}, {"s": "Reasoning", "q": "<b>Statement:<\/b> X ≥ Y = Z > W ≤ V<br><b>Conclusions:<\/b><br>I. V > Z<br>II. V ≤ Z", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 2, "e": "Z > W ≤ V: the relation between V and Z cannot be fixed, so neither is definite alone.<br>Together, V > Z and V ≤ Z cover every possibility, so one of them must be true. Either I or II follows.", "st": "ineq"}, {"s": "Reasoning", "q": "Pointing to a girl in a photograph, Arjun said, \"She is the daughter of the only son of my paternal grandfather.\" How is the girl related to Arjun?", "o": ["Daughter", "Cousin", "Aunt", "Niece", "Sister"], "a": 4, "e": "The only son of Arjun's paternal grandfather is Arjun's father. His daughter is Arjun's sister.", "st": null}, {"s": "Reasoning", "q": "A + B means A is the father of B; A − B means A is the sister of B; A × B means A is the brother of B; A ÷ B means A is the mother of B. In the expression P ÷ Q × R − S + T, how is P related to T?", "o": ["Grandmother", "Mother", "Sister", "Grandfather", "Aunt"], "a": 0, "e": "P ÷ Q: P is the mother of Q. Q × R: Q is the brother of R. R − S: R is the sister of S. So Q, R and S are siblings, and P is the mother of all three.<br>S + T: S is the father of T. So P is T's grandmother.", "st": null}, {"s": "Reasoning", "q": "Ravi walks 10 m north, turns right and walks 6 m, turns right and walks 18 m, then turns left and walks 9 m. How far is he from his starting point, and in which direction?", "o": ["23 m, South-East", "17 m, South-East", "17 m, South-West", "17 m, North-East", "15 m, South-East"], "a": 1, "e": "Take the start as (0, 0). North 10 gives (0, 10). Right is east, 6 m: (6, 10). Right is south, 18 m: (6, −8). Left from south is east, 9 m: (15, −8).<br>Distance = √(15² + 8²) = √289 = 17 m. He is east and south of the start: South-East.", "st": null}, {"s": "Reasoning", "q": "Point A is 8 m west of point B. Point C is 6 m south of B. Point D is 8 m west of C. In which direction is D from A?", "o": ["South-West", "South", "West", "South-East", "North"], "a": 1, "e": "Put B at (0, 0). A = (−8, 0), C = (0, −6), D = (−8, −6). D is directly below A, so D is 6 m south of A.", "st": null}, {"s": "Reasoning", "q": "<b>Statements:<\/b><br>(A) Several state electricity boards have announced scheduled power cuts in industrial areas.<br>(B) Coal stocks at most thermal power plants have fallen below the critical level.<br>Which of the following best describes the relationship?", "o": ["(A) is the cause and (B) is its effect", "(B) is the cause and (A) is its effect", "Both are independent causes", "Both are effects of independent causes", "Both are effects of some common cause"], "a": 1, "e": "Low coal stocks at thermal plants reduce power generation, which forces boards to schedule power cuts. (B) causes (A).", "st": null}, {"s": "Reasoning", "q": "<b>Statement:<\/b> The government should make digital payment mandatory for every transaction above ₹5,000, because this will curb tax evasion.<br>Which of the following, if true, most WEAKENS the argument?", "o": ["Digital payments are faster than cash for most merchants", "Banks have expanded UPI access in rural areas", "Most tax evasion happens through under-reported property deals and fake invoices, which digital payment does not prevent", "Digital payments leave an audit trail that tax authorities can examine", "Several countries have raised tax collections after promoting digital payments"], "a": 2, "e": "The argument assumes that cash payments above ₹5,000 are a main route for tax evasion. If most evasion happens through channels that digital payment does not touch, the proposed measure will not achieve its aim. The second and third options strengthen the argument; the last two are irrelevant.", "st": null}, {"s": "Reasoning", "q": "In the number 5839264718, each digit in an odd position (1st, 3rd, 5th, …) is increased by 1 and each digit in an even position is decreased by 1. How many digits appear more than once in the new number?", "o": ["None", "Four", "Two", "One", "Three"], "a": 4, "e": "Original: 5 8 3 9 2 6 4 7 1 8.<br>Odd positions +1: 5→6, 3→4, 2→3, 4→5, 1→2. Even positions −1: 8→7, 9→8, 6→5, 7→6, 8→7.<br>New number: 6 7 4 8 3 5 5 6 2 7. Repeated digits: 6, 7 and 5, which is three.", "st": null}, {"s": "Reasoning", "q": "In the word PRODUCTION, each consonant is replaced by the next letter of the English alphabet and each vowel by the previous letter. How many letters appear more than once in the new arrangement?", "o": ["One", "None", "Two", "Three", "More than three"], "a": 0, "e": "P→Q, R→S, O→N, D→E, U→T, C→D, T→U, I→H, O→N, N→O. New word: QSNETDUHNO. Only N appears twice, so one letter repeats.", "st": null}, {"s": "Reasoning", "q": "How many pairs of letters in the word MONITOR have as many letters between them in the word as in the English alphabet (in either direction)?", "o": ["Three", "One", "Two", "Four", "More than four"], "a": 0, "e": "Positions: M1 O2 N3 I4 T5 O6 R7.<br>O–N (adjacent; O and N are adjacent in the alphabet) ✓<br>N–R (3 letters between in both the word and the alphabet: O, P, Q) ✓<br>T–R (1 letter between in both; S in the alphabet) ✓<br>No other pair works. Total: three.", "st": null}, {"s": "General Awareness", "q": "Under which section of the RBI Act, 1934 is the Monetary Policy Committee constituted?", "o": ["Section 7", "Section 17", "Section 24", "Section 45ZB", "Section 45ZA"], "a": 3, "e": "Section 45ZB of the RBI Act, 1934 constitutes the MPC. It must meet at least four times a year. Section 45ZA covers the inflation target set by the Centre. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "After how many years are unclaimed balances in bank accounts transferred to RBI's Depositor Education and Awareness (DEA) Fund?", "o": ["7 years", "10 years", "3 years", "15 years", "5 years"], "a": 1, "e": "Banks transfer deposits unclaimed for 10 years to the DEA Fund, set up under Section 26A of the Banking Regulation Act, 1949. count was in 1931). It will also be India's first digital Census. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "Renaming Kerala as 'Keralam' is done by Parliament under which Article of the Constitution?", "o": ["Article 2", "Article 1", "Article 368", "Article 3", "Article 4"], "a": 3, "e": "Article 3 empowers Parliament to alter the name, area or boundaries of a State. The Kerala (Alteration of Name) Bill, 2026 amends the First and Fourth Schedules (Article 4 covers such consequential changes). (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "Consider the statements:<br>1. Dividends unclaimed for 7 years are transferred to the Investor Education and Protection Fund.<br>2. The IEPF is established under Section 125 of the Companies Act, 2013.<br>3. Bank deposits unclaimed for 7 years are transferred to the IEPF.<br>Which is/are correct?", "o": ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3", "1 only"], "a": 0, "e": "1 ✓ and 2 ✓. 3 ✗: unclaimed bank deposits go to RBI's DEA Fund after 10 years, not to the IEPF.", "st": null}, {"s": "General Awareness", "q": "Which body implements the Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)?", "o": ["ESIC", "SIDBI", "NSDC", "EPFO", "Labour Bureau"], "a": 3, "e": "PM-VBRY (launched 1 August 2025, outlay ₹99,446 crore) is under the Ministry of Labour & Employment and implemented through EPFO. It gives first-time employees up to ₹15,000 and gives employers incentives for additional hiring. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "Who is the President of the 81st session of the UN General Assembly (from September 2026)?", "o": ["Annalena Baerbock (Germany)", "Dennis Francis (Trinidad and Tobago)", "Philemon Yang (Cameroon)", "Csaba Kőrösi (Hungary)", "Khalilur Rahman (Bangladesh)"], "a": 4, "e": "Khalilur Rahman of Bangladesh presides over the 81st session. Annalena Baerbock presided over the 80th session. (Your Jun 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "The Digital Rupee (e₹) held by a person is a liability of:", "o": ["The Reserve Bank of India", "The bank that issued the wallet", "The payment app provider", "NPCI", "The Government of India"], "a": 0, "e": "CBDC is sovereign currency issued by the RBI, so, like a banknote, it is the RBI's liability. A bank deposit is the bank's liability. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "S&P Global Ratings has affirmed India's long-term sovereign credit rating at:", "o": ["BBB, stable outlook", "BBB+, positive outlook", "BBB−, stable outlook", "BB+, positive outlook", "A−, stable outlook"], "a": 0, "e": "S&P affirmed India at 'BBB' with a stable outlook. It had upgraded India from BBB− to BBB in August 2025. It expects FY27 growth of 6.6%. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "In August 2026, which entity had its banking licence cancelled by the RBI, followed by a High Court winding-up order?", "o": ["Fino Payments Bank", "Jio Payments Bank", "Airtel Payments Bank", "Paytm Payments Bank Limited", "India Post Payments Bank"], "a": 3, "e": "The RBI cancelled Paytm Payments Bank's licence, and the Delhi High Court ordered it wound up. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "The Government has approved a field trial of polymer banknotes in which denominations?", "o": ["₹10 only", "₹100 only", "₹10 and ₹50", "₹10 and ₹20", "₹20 and ₹50"], "a": 3, "e": "1 billion pieces each of ₹10 and ₹20 notes (2 billion in all). Under Section 25 of the RBI Act, the Central Government approves a note's design, form and material on the RBI's recommendation. (Your Aug 2026 GA deck.)", "st": null}, {"s": "General Awareness", "q": "NABARD was established on 12 July 1982 on the recommendation of which committee?", "o": ["Raghuram Rajan Committee", "Rangarajan Committee", "Khusro Committee", "CRAFICARD (B. Sivaraman)", "Narasimham Committee"], "a": 3, " let S = null; // state
let tick = null;

function load(){ try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function secOf(q){ return DATA.sections.find(s => s.name === q.s); }
function markOf(q){ const s = secOf(q); return s.marks / s.n; }
function fmt(n){ return (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,""); }
function fmtT(ms){ ms = Math.max(0, ms); const t = Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); }
function esc(t){ const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* ---------- start screen ---------- */
function startScreen(){
  clearInterval(tick);
  const prev = load();
  const total = DATA.qs.length;
  const rows = DATA.sections.map(s => `<tr><td>${s.name}</td><td class="r num">${s.n}</td><td class="r num">${s.marks}</td><td class="r num">${fmt(s.marks/s.n)}</td><td class="r num">−${fmt(s.marks/s.n*DATA.neg)}</td></tr>`).join("");
  let resume = "";
  if (prev && prev.phase === "test") resume = `<button class="btn primary" id="resume">Resume attempt (${fmtT(prev.deadline - Date.now())} left)</button>`;
  if (prev && prev.phase === "done") resume = `<button class="btn primary" id="seeres">See last result</button>`;
  app.innerHTML = `<div class="wrap start">
    <div class="panel">
      <div class="eyebrow">PFRDA Grade A 2026 · Phase I</div>
      <h1 style="margin-top:6px">${DATA.title}</h1>
      <p class="note" style="margin:8px 0 14px">${DATA.blurb}</p>
      <dl class="facts">
        <div><dt>Questions</dt><dd class="num">${total}</dd></div>
        <div><dt>Marks</dt><dd class="num">${DATA.sections.reduce((a,s)=>a+s.marks,0)}</dd></div>
        <div><dt>Time</dt><dd class="num">${DATA.minutes} min</dd></div>
        <div><dt>Wrong answer</dt><dd>−¼ of its marks</dd></div>
      </dl>
    </div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">Sections</div>
      <div class="tbl"><table class="sec"><tr><th>Section</th><th class="r">Qs</th><th class="r">Marks</th><th class="r">Per Q</th><th class="r">Wrong</th></tr>${rows}</table></div>
      <p class="note" style="margin:10px 0 0">One timer for the whole paper, with no sectional timing, as in the real exam. You can move between sections freely. The test submits itself when time runs out.</p>
    </div>
    <div class="row">${resume}<button class="btn ${resume ? "" : "primary"}" id="go">${prev ? "Start a fresh attempt" : "Start test"}</button></div>
  </div>`;
  $("#go").onclick = () => { S = { phase:"test", deadline: Date.now() + DATA.minutes*60000, started: Date.now(), cur:0, ans:Array(total).fill(null), flag:Array(total).fill(false), seen:Array(total).fill(false) }; save(); testScreen(); };
  if ($("#resume")) $("#resume").onclick = () => { S = prev; if (S.deadline <= Date.now()) { finish(); } else testScreen(); };
  if ($("#seeres")) $("#seeres").onclick = () => { S = prev; resultScreen(); };
}

/* ---------- test screen ---------- */
function testScreen(){
  app.innerHTML = `<div class="bar"><div class="bar-in"><div class="t">${DATA.short}</div><div class="timer" id="timer">--:--</div><button class="btn" id="palbtn" style="min-height:36px;padding:6px 10px">Questions</button></div>
    <div class="chips" id="chips"></div></div>
    <div class="wrap"><div id="q"></div></div>
    <div class="foot"><div class="foot-in">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn primary" id="next">Save &amp; next →</button>
      <button class="btn" id="flag">Mark for review</button>
      <button class="btn ghost" id="clear">Clear answer</button>
    </div></div>
    <div id="sheet"></div>`;
  $("#prev").onclick = () => go(S.cur - 1);
  $("#next").onclick = () => go(S.cur + 1);
  $("#flag").onclick = () => { S.flag[S.cur] = !S.flag[S.cur]; save(); if (S.flag[S.cur]) go(S.cur + 1); else renderQ(); };
  $("#clear").onclick = () => { S.ans[S.cur] = null; save(); renderQ(); };
  $("#palbtn").onclick = openPalette;
  renderQ();
  clearInterval(tick); tick = setInterval(tickFn, 500); tickFn();
}
function tickFn(){
  const left = S.deadline - Date.now();
  const t = $("#timer"); if (!t) return;
  t.textContent = fmtT(left);
  t.classList.toggle("low", left < 5*60000);
  if (left <= 0) finish();
}
function go(i){ if (i < 0 || i >= DATA.qs.length) { if (i >= DATA.qs.length) openPalette(); return; } S.cur = i; save(); renderQ(); window.scrollTo(0,0); }
function renderQ(){
  const i = S.cur, q = DATA.qs[i];
  S.seen[i] = true; save();
  $("#chips").innerHTML = DATA.sections.map(s => `<button class="chip" data-s="${esc(s.name)}" aria-pressed="${s.name===q.s}">${s.name}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => go(DATA.qs.findIndex(x => x.s === b.dataset.s)));
  const act = $("#chips [aria-pressed=true]"); if (act) act.scrollIntoView({inline:"nearest", block:"nearest"});
  const stem = q.st ? `<details class="stem" open><summary>Directions / passage</summary><div class="stem-body">${DATA.stems[q.st]}</div></details>` : "";
  $("#q").innerHTML = `<div class="qhead"><div><span class="eyebrow">${q.s}</span><h2 class="num" style="font-size:18px;margin-top:2px">Question ${i+1} <span class="note">of ${DATA.qs.length}</span></h2></div>
     <div class="marks num">+${fmt(markOf(q))} / −${fmt(markOf(q)*DATA.neg)}${S.flag[i] ? ' · <span class="pill" style="background:var(--flag-soft);color:var(--flag)">Marked</span>' : ""}</div></div>
     ${stem}<p class="qtext">${q.q}</p>
     <div class="opts" role="radiogroup">${q.o.map((o,k) => `<button class="opt" role="radio" aria-checked="${S.ans[i]===k}" data-k="${k}"><span class="k">${L[k]}</span><span>${o}</span></button>`).join("")}</div>`;
  $("#q").querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; S.ans[i] = (S.ans[i] === k ? null : k); save(); renderQ(); });
  $("#flag").textContent = S.flag[i] ? "Unmark" : "Mark for review";
  $("#prev").disabled = i === 0;
  $("#next").textContent = i === DATA.qs.length - 1 ? "Review & submit" : "Save & next →";
}
function openPalette(){
  const answered = S.ans.filter(a => a !== null).length;
  const flagged = S.flag.filter(Boolean).length;
  const groups = DATA.sections.map(s => {
    const btns = DATA.qs.map((q,i) => q.s === s.name ? i : -1).filter(i => i >= 0).map(i => {
      const cls = S.flag[i] ? "st-flag" : S.ans[i] !== null ? "st-ans" : S.seen[i] ? "st-seen" : "";
      return `<button class="${cls} ${i===S.cur?"st-cur":""}" data-i="${i}">${i+1}</button>`; }).join("");
    return `<div class="pal-sec">${s.name}</div><div class="pal">${btns}</div>`; }).join("");
  $("#sheet").innerHTML = `<div class="sheet" id="sh"><div class="sheet-in" role="dialog" aria-label="Question palette">
     <div class="row" style="justify-content:space-between;align-items:center"><h3>Questions</h3><button class="btn" id="shx" style="min-height:36px">Close</button></div>
     <div class="legend"><span><i class="st-ans"></i>Answered</span><span><i class="st-flag"></i>Marked for review</span><span><i class="st-seen"></i>Seen, not answered</span><span><i></i>Not visited</span></div>
     ${groups}
     <div class="confirm"><p style="margin:0 0 10px"><b class="num">${answered}</b> of ${DATA.qs.length} answered${flagged ? `, <b class="num">${flagged}</b> marked for review (marked answers still count)` : ""}. <span class="num">${fmtT(S.deadline-Date.now())}</span> left.</p>
       <div class="row"><button class="btn danger" id="sub1">Submit test</button></div><div id="sub2"></div></div>
  </div></div>`;
  $("#shx").onclick = () => $("#sheet").innerHTML = "";
  $("#sh").onclick = e => { if (e.target.id === "sh") $("#sheet").innerHTML = ""; };
  $("#sheet").querySelectorAll(".pal button").forEach(b => b.onclick = () => { $("#sheet").innerHTML = ""; go(+b.dataset.i); });
  $("#sub1").onclick = () => { $("#sub2").innerHTML = `<p class="note" style="margin:10px 0">You can't change answers after submitting. Submit now?</p><div class="row"><button class="btn danger" id="subyes">Yes, submit</button><button class="btn" id="subno">Keep going</button></div>`;
    $("#subyes").onclick = finish; $("#subno").onclick = () => $("#sub2").innerHTML = ""; };
}
function finish(){
  clearInterval(tick);
  S.phase = "done"; S.ended = Math.min(Date.now(), S.deadline); save();
  resultScreen();
}

/* ---------- results ---------- */
function grade(){
  const per = DATA.sections.map(s => ({ name:s.name, n:s.n, max:s.marks, c:0, w:0, u:0, score:0 }));
  DATA.qs.forEach((q,i) => { const p = per.find(x => x.name === q.s), m = markOf(q), a = S.ans[i];
    if (a === null) p.u++; else if (a === q.a) { p.c++; p.score += m; } else { p.w++; p.score -= m*DATA.neg; } });
  return per;
}
let filter = "all";
function resultScreen(){
  clearInterval(tick);
  const per = grade();
  const tot = per.reduce((a,p) => a + p.score, 0), max = per.reduce((a,p) => a + p.max, 0);
  const c = per.reduce((a,p) => a+p.c, 0), w = per.reduce((a,p) => a+p.w, 0), u = per.reduce((a,p) => a+p.u, 0);
  const used = Math.round(((S.ended||Date.now()) - S.started)/60000);
  const rows = per.map(p => `<tr><td>${p.name}</td><td class="r num">${p.c}</td><td class="r num">${p.w}</td><td class="r num">${p.u}</td><td class="r num"><b>${fmt(p.score)}</b>/${p.max}</td><td class="r num">${p.c+p.w ? Math.round(p.c/(p.c+p.w)*100)+"%" : "–"}</td></tr>`).join("");
  app.innerHTML = `<div class="wrap start">
    <div class="panel"><div class="eyebrow">${DATA.short} · Result</div>
      <div class="score" style="margin-top:6px"><span class="big">${fmt(tot)}</span><span class="note num">/ ${max} marks</span></div>
      <div class="row" style="margin-top:8px"><span class="pill p-ok num">${c} correct</span><span class="pill p-bad num">${w} wrong (−${fmt(per.reduce((a,p)=>a+p.w*(p.max/p.n)*DATA.neg,0))})</span><span class="pill p-skip num">${u} not attempted</span><span class="pill num" style="background:var(--accent-soft);color:var(--accent)">${used} of ${DATA.minutes} min used</span></div>
      <p class="note" style="margin:10px 0 0">Your target is about 40 per paper. PFRDA sets a cut-off for each paper plus an aggregate cut-off, so use the section table to find where marks leak.</p>
    </div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">By section</div>
      <div class="tbl"><table class="sec"><tr><th>Section</th><th class="r">✓</th><th class="r">✗</th><th class="r">–</th><th class="r">Score</th><th class="r">Accuracy</th></tr>${rows}</table></div></div>
    <div class="panel" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">Answers &amp; explanations</div>
      <div class="row" id="filt">${["all","wrong","skipped","correct"].map(f => `<button class="chip" data-f="${f}" aria-pressed="${filter===f}">${{all:"All",wrong:"Wrong",skipped:"Not attempted",correct:"Correct"}[f]}</button>`).join("")}</div></div>
      <div class="rev" id="rev"></div></div>
    <div class="row"><button class="btn" id="again">Retake this mock</button></div>
  </div>`;
  $("#filt").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; resultScreen(); });
  $("#again").onclick = () => { wipe(); S = null; filter = "all"; startScreen(); };
  const list = DATA.qs.map((q,i) => ({q,i})).filter(({q,i}) => { const a = S.ans[i];
    return filter==="all" || (filter==="wrong" && a!==null && a!==q.a) || (filter==="skipped" && a===null) || (filter==="correct" && a===q.a); });
  $("#rev").innerHTML = list.length ? list.map(({q,i}) => { const a = S.ans[i];
    const tag = a===null ? '<span class="pill p-skip">Not attempted</span>' : a===q.a ? '<span class="pill p-ok">Correct</span>' : '<span class="pill p-bad">Wrong</span>';
    const stem = q.st ? `<details class="stem"><summary>Directions / passage</summary><div class="stem-body">${DATA.stems[q.st]}</div></details>` : "";
    return `<div class="panel rq"><div class="qhead"><span class="eyebrow">Q${i+1} · ${q.s}</span>${tag}</div>${stem}<p class="qtext" style="font-size:16px">${q.q}</p>
      <div class="opts">${q.o.map((o,k) => `<div class="opt ${k===q.a?"right":(k===a?"wrong":"")}"><span class="k">${L[k]}</span><span>${o}${k===q.a?" ✓":""}${k===a&&k!==q.a?" (your answer)":""}</span></div>`).join("")}</div>
      <div class="exp"><b>Answer: ${L[q.a]}.</b> ${q.e}</div></div>`; }).join("") : '<p class="note">No questions in this filter.</p>';
}

/* boot */
(function(){ const prev = load();
  if (prev && prev.phase === "test" && prev.deadline > Date.now()) { S = prev; testScreen(); }
  else if (prev && prev.phase === "test") { S = prev; finish(); }
  else startScreen(); })();
</script>

</body>
</html>
