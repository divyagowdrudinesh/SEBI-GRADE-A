<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFRDA Paper 1 Mock 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: exam-hall CBT console. Sticky timer bar, one question per screen, fixed action bar, sheet for the question palette. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#18212b; --muted:#5b6672; --line:#d9dee4;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef6;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --bad:#b4352c; --bad-soft:#f8e3e1;
  --flag:#7a4cb0; --flag-soft:#eee6f8; --skip:#8a6a12; --skip-soft:#f6efd9;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;
  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;
  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --panel:#182029; --ink:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fb3e0; --accent-ink:#0b1a26; --accent-soft:#1b3346;
  --ok:#5cc58d; --ok-soft:#173326; --bad:#ef7f75; --bad-soft:#3a1d1b;
  --flag:#b991ea; --flag-soft:#2c2140; --skip:#e0bd5a; --skip-soft:#352c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
/* start */
.start{display:grid;gap:16px}
.start .panel{padding:18px}
.start h1{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
.facts div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;font-weight:600}
.tbl{overflow-x:auto}
table.sec{border-collapse:collapse;width:100%;font-size:14px}
table.sec th,table.sec td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.sec td.r,table.sec th.r{text-align:right}
.note{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--accent-soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qhead .marks{font-size:13px;color:var(--muted)}
details.stem{margin-bottom:12px}
details.stem summary{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0;cursor:pointer}
.stem-body{font-family:var(--read);font-size:16.5px;line-height:1.6;max-height:55vh;overflow:auto;padding:4px 14px;border-left:3px solid var(--line);min-width:0}
.stem-body p{margin:0 0 10px}
table.dt{border-collapse:collapse;font-family:var(--ui);font-size:15px;margin:6px 0 10px}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.qtext{font-size:17px;margin:0 0 14px;min-width:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;min-height:52px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
/* bottom bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot-in .btn{width:100%;font-size:14px;padding:8px 6px}
@media (min-width:560px){.foot-in{grid-template-columns:repeat(4,1fr)}}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--panel);width:100%;max-width:760px;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.pal-sec{margin:12px 0 4px;font-size:13px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pal button{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px}
.st-ans{background:var(--ok-soft)!important;border-color:var(--ok)!important;color:var(--ok)}
.st-flag{background:var(--flag-soft)!important;border-color:var(--flag)!important;color:var(--flag)}
.st-seen{background:var(--skip-soft)!important;border-color:var(--skip)!important;color:var(--skip)}
.st-cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px}
/* results */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:40px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-skip{background:var(--skip-soft);color:var(--skip)}
.rev{display:grid;gap:12px;margin-top:12px}
.rq{padding:14px}
.rq .opt{cursor:default;min-height:0;padding:8px 12px}
.rq .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.rq .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px;overflow-wrap:anywhere}
.exp b{font-weight:600}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>

</head>
<body>
<div id="app"></div>

<script>
const DATA = {"id": "p1m3-v1", "title": "PFRDA Paper 1 Mock 3", "short": "PFRDA P1 · Mock 3", "blurb": "Built on the official 2026 pattern and the 2022 and 2025 papers: three 5-question puzzles, input-output, bar-graph DI and quadratics, word-swap English, and finance- and pension-heavy GA. All questions are new.", "minutes": 60, "neg": 0.25, "sections": [{"name": "English Language", "n": 20, "marks": 25}, {"name": "Quantitative Aptitude", "n": 20, "marks": 25}, {"name": "Reasoning", "n": 30, "marks": 25}, {"name": "General Awareness", "n": 20, "marks": 25}], "stems": {"rc": "<p><b>Directions:<\/b> Read the passage carefully and answer the questions.<\/p>\n<p>For decades, the typical Indian household kept its savings in two places: bank deposits and physical assets such as gold and land. That pattern is changing. Monthly inflows into mutual funds through systematic investment plans (SIPs) have risen steadily, the number of demat accounts has multiplied, and a growing share of new investors comes from smaller towns rather than the metros. Commentators have hailed this as the 'financialisation' of household savings.<\/p>\n<p>The shift has clear benefits. Money that once sat idle in lockers is now channelled into companies and government securities, deepening capital markets and lowering the cost of capital for firms. Households, for their part, gain access to assets that have historically outpaced inflation over long periods. Regular, small contributions also instil a discipline that lump-sum investing rarely does.<\/p>\n<p>Yet the transition carries risks that are easy to overlook in a rising market. Many first-time investors have never experienced a <b>prolonged<\/b> downturn, and some treat equity funds as if they were fixed deposits with higher returns. When markets fall, such investors are prone to stop their SIPs or redeem in panic, locking in losses at precisely the wrong time. A second concern is the rise of unregulated advice on social media, where promises of quick gains can draw savers into products they do not understand.<\/p>\n<p>None of this argues for slowing the shift; it argues for accompanying it with better financial literacy and clearer disclosures. Regulators have taken steps in this direction, requiring risk labels on mutual fund schemes and acting against unregistered advisers. But the most durable safeguard is an investor who understands that market-linked returns are, by definition, uncertain, and who invests with a time horizon long enough to ride out the inevitable bad years. The goal is not merely more investors, but more <b>resilient<\/b> ones.<\/p>", "err": "<p><b>Directions:<\/b> Each sentence is divided into parts (A), (B), (C) and (D). Find the part that contains a grammatical or usage error. If there is no error, choose \"No error\".<\/p>", "fill": "<p><b>Directions:<\/b> Choose the pair of words that best fills both blanks in the sentence.<\/p>", "swap": "<p><b>Directions:<\/b> Four words in the sentence are printed in bold and marked (A), (B), (C) and (D). They may be in the wrong places. Choose the interchange that makes the sentence meaningful and grammatically correct. If the sentence is already correct, choose \"No interchange required\".<\/p>", "pj": "<p><b>Directions:<\/b> Rearrange the five sentences (A)–(E) to form a meaningful paragraph, then answer the questions.<\/p>\n<p>(A) Launched in 2016, it allowed users to link several bank accounts to a single mobile app.<br>\n(B) Few payment systems have changed everyday life in India as much as the Unified Payments Interface.<br>\n(C) Within a few years, scanning a QR code had become the default way to pay, from large malls to roadside stalls.<br>\n(D) Its success has since prompted several countries to link their own payment systems with it.<br>\n(E) Because transfers were instant and free for users, small merchants adopted it quickly.<\/p>", "bar": "<p><b>Directions:<\/b> The bar graph shows the number of insurance policies sold by five agents, A to E, in 2024 and 2025. Study it and answer the questions.<\/p><svg viewBox=\"0 0 340 230\" width=\"100%\" style=\"max-width:420px;display:block;margin:6px 0 4px\" role=\"img\" aria-label=\"Policies sold by agents A to E in 2024 and 2025\"><line x1=\"34\" x2=\"334\" y1=\"190.0\" y2=\"190.0\" style=\"stroke:var(--line)\" stroke-width=\"1\"/><text x=\"30\" y=\"194.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--muted)\">0<\/text><line x1=\"34\" x2=\"334\" y1=\"141.4\" y2=\"141.4\" style=\"stroke:var(--line)\" stroke-width=\"1\"/><text x=\"30\" y=\"145.4\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--muted)\">100<\/text><line x1=\"34\" x2=\"334\" y1=\"92.9\" y2=\"92.9\" style=\"stroke:var(--line)\" stroke-width=\"1\"/><text x=\"30\" y=\"96.9\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--muted)\">200<\/text><line x1=\"34\" x2=\"334\" y1=\"44.3\" y2=\"44.3\" style=\"stroke:var(--line)\" stroke-width=\"1\"/><text x=\"30\" y=\"48.3\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--muted)\">300<\/text><rect x=\"46\" y=\"73.4\" width=\"20\" height=\"116.6\" rx=\"2\" style=\"fill:var(--muted)\"/><text x=\"56\" y=\"69.4\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">240<\/text><rect x=\"68\" y=\"44.3\" width=\"20\" height=\"145.7\" rx=\"2\" style=\"fill:var(--accent)\"/><text x=\"78\" y=\"40.3\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">300<\/text><text x=\"67\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--ink)\">A<\/text><rect x=\"104\" y=\"102.6\" width=\"20\" height=\"87.4\" rx=\"2\" style=\"fill:var(--muted)\"/><text x=\"114\" y=\"98.6\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">180<\/text><rect x=\"126\" y=\"58.9\" width=\"20\" height=\"131.1\" rx=\"2\" style=\"fill:var(--accent)\"/><text x=\"136\" y=\"54.9\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">270<\/text><text x=\"125\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--ink)\">B<\/text><rect x=\"162\" y=\"34.6\" width=\"20\" height=\"155.4\" rx=\"2\" style=\"fill:var(--muted)\"/><text x=\"172\" y=\"30.6\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">320<\/text><rect x=\"184\" y=\"54.0\" width=\"20\" height=\"136.0\" rx=\"2\" style=\"fill:var(--accent)\"/><text x=\"194\" y=\"50.0\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">280<\/text><text x=\"183\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--ink)\">C<\/text><rect x=\"220\" y=\"117.1\" width=\"20\" height=\"72.9\" rx=\"2\" style=\"fill:var(--muted)\"/><text x=\"230\" y=\"113.1\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">150<\/text><rect x=\"242\" y=\"80.7\" width=\"20\" height=\"109.3\" rx=\"2\" style=\"fill:var(--accent)\"/><text x=\"252\" y=\"76.7\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">225<\/text><text x=\"241\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--ink)\">D<\/text><rect x=\"278\" y=\"63.7\" width=\"20\" height=\"126.3\" rx=\"2\" style=\"fill:var(--muted)\"/><text x=\"288\" y=\"59.7\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">260<\/text><rect x=\"300\" y=\"32.1\" width=\"20\" height=\"157.9\" rx=\"2\" style=\"fill:var(--accent)\"/><text x=\"310\" y=\"28.1\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:var(--ink)\">325<\/text><text x=\"299\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--ink)\">E<\/text><rect x=\"60\" y=\"216\" width=\"10\" height=\"10\" style=\"fill:var(--muted)\"/><text x=\"74\" y=\"225\" font-size=\"11\" style=\"fill:var(--ink)\">2024<\/text><rect x=\"120\" y=\"216\" width=\"10\" height=\"10\" style=\"fill:var(--accent)\"/><text x=\"134\" y=\"225\" font-size=\"11\" style=\"fill:var(--ink)\">2025<\/text><\/svg>", "cas": "<p><b>Directions:<\/b> Read the information and answer the questions.<\/p>\n<p>A company has 600 employees, and the ratio of men to women is 7 : 5. 40% of the men and 40% of the women have opted for NPS. One-third of the employees who opted for NPS chose Active choice, and the rest chose Auto choice. 45 of the employees who chose Active choice are men.<\/p>", "quad": "<p><b>Directions:<\/b> Two equations (I) and (II) are given. Solve both and choose the correct relationship between x and y.<\/p>", "flat": "<p><b>Directions:<\/b> Study the information and answer the questions.<\/p>\n<p>Eight persons, A, B, C, D, E, F, G and H, live in a four-storey building. The ground floor is numbered 1 and the top floor is numbered 4. Each floor has two flats: a West flat and an East flat. The West flat of each floor is exactly above the West flat of the floor below, and the same holds for the East flats. Each person lives in a different flat and has a different profession: Actor, Banker, Chef, Doctor, Engineer, Lawyer, Pilot and Teacher.<\/p>\n<p>C lives in an East flat on an odd-numbered floor. H lives in a West flat on the floor immediately above C's floor. A lives on the same floor as H. The Engineer lives in the East flat of floor 1. D lives in a West flat on a floor above B's floor. G lives on the same floor as D. The Pilot lives in the West flat of the top floor. The Doctor lives on the same floor as B, but B is not the Doctor. B and E both live in West flats. The Teacher lives on floor 2, but H is not the Teacher. The Chef lives on the same floor as the Doctor. The Banker lives in an East flat on a floor above the Doctor's floor. The Actor lives in a West flat on a floor below the Lawyer's floor.<\/p>", "month": "<p><b>Directions:<\/b> Study the information and answer the questions.<\/p>\n<p>Seven persons, P, Q, R, S, T, U and V, visit a bank branch in seven different months of the same year: January, March, April, June, July, September and November. Each opens a different type of account: FD, RD, Savings, Current, PPF, NPS and SSY. \"Immediately before/after\" refers to the order of these seven months.<\/p>\n<p>P visits in a month that has 30 days. Two persons visit between P and R, and R visits after P. U visits immediately after P. Q visits immediately before V. S visits in a month that has 31 days, and before Q. Only one person visits before the one who opens a PPF account. The one who opens an SSY account visits in the last of the given months. T opens a Savings account. The one who opens an FD visits immediately after the one who opens a PPF account. The one who opens an RD visits immediately after the one who opens a Current account. The Current account is opened in a month that has 30 days.<\/p>", "circ": "<p><b>Directions:<\/b> Study the information and answer the questions.<\/p>\n<p>Eight persons, S, T, U, V, W, X, Y and Z, sit around a circular table, all facing the centre.<\/p>\n<p>Only two persons sit between S and T. X sits third to the left of T. Z sits second to the right of X. U sits immediately to the right of S. W is an immediate neighbour of S, but not of X. Y is not an immediate neighbour of Z.<\/p>", "io": "<p><b>Directions:<\/b> A machine rearranges a line of numbers step by step. Study the illustration and answer the questions.<\/p>\n<p><b>Input:<\/b> 46 23 71 12 58 39 84 17<br>\n<b>Step 1:<\/b> 17 46 23 71 12 58 39 84<br>\n<b>Step 2:<\/b> 17 23 46 71 12 39 58 84<br>\n<b>Step 3:<\/b> 17 23 39 71 12 46 58 84<br>\nStep 3 is the last step for this input.<\/p>\n<p>Apply the same logic to the input: <b>37 84 19 62 53 26 91 48 75 30<\/b><\/p>", "syl": "<p><b>Directions:<\/b> Take the statements as true even if they seem to differ from known facts. Decide which conclusion(s) logically follow.<\/p>"}, "qs": [{"s": "English Language", "q": "Which of the following best states the main idea of the passage?", "o": ["SIPs guarantee returns that are higher than inflation", "Social media is the main reason for the growth of mutual fund investment in India", "The shift of household savings into financial markets is welcome, but it needs investor education and safeguards to last", "Regulators should slow the growth of new investors from smaller towns", "Household savings should return to bank deposits and gold because markets are risky"], "a": 2, "e": "The passage welcomes 'financialisation' (paragraph 2), notes its risks (paragraph 3), and concludes that the shift should be 'accompanied' by literacy and disclosures, not slowed (paragraph 4).", "st": "rc"}, {"s": "English Language", "q": "Which of the following is NOT mentioned in the passage as a benefit of the shift?", "o": ["Protection of the invested amount against loss", "The discipline of regular, small contributions", "A lower cost of capital for firms", "Deeper capital markets", "Access to assets that have historically beaten inflation"], "a": 0, "e": "Paragraph 2 lists deeper markets, cheaper capital, inflation-beating assets and SIP discipline. The passage says the opposite of capital protection: market-linked returns are 'by definition, uncertain'.", "st": "rc"}, {"s": "English Language", "q": "According to the passage, why are some first-time investors likely to stop their SIPs when markets fall?", "o": ["Banks offer them better fixed-deposit rates during downturns", "Risk labels on schemes tell them to exit", "Regulators require them to redeem during a downturn", "Their SIP contributions are too small to matter", "They have never been through a long downturn and treat equity funds like fixed deposits with higher returns"], "a": 4, "e": "Paragraph 3: they 'have never experienced a prolonged downturn, and some treat equity funds as if they were fixed deposits with higher returns', so they panic when markets fall.", "st": "rc"}, {"s": "English Language", "q": "Which word is most similar in meaning to <b>resilient<\/b> as used in the passage?", "o": ["Impulsive", "Affluent", "Hesitant", "Fragile", "Robust"], "a": 4, "e": "Resilient means able to withstand or recover from setbacks, i.e. robust. The passage wants investors who can 'ride out the inevitable bad years'.", "st": "rc"}, {"s": "English Language", "q": "Which word is most nearly OPPOSITE in meaning to <b>prolonged<\/b> as used in the passage?", "o": ["Gradual", "Lengthy", "Severe", "Extended", "Brief"], "a": 4, "e": "Prolonged means lasting a long time. Its opposite is brief. Extended and lengthy are synonyms.", "st": "rc"}, {"s": "English Language", "q": "What is the author's attitude towards the 'financialisation' of household savings?", "o": ["Strongly opposed", "Indifferent", "Cautiously optimistic", "Sarcastic", "Unreservedly enthusiastic"], "a": 2, "e": "The author sees 'clear benefits' but warns of risks and asks for safeguards: optimism tempered by caution.", "st": "rc"}, {"s": "English Language", "q": "The committee submitted its report (A) / on the proposed changes (B) / to the pension rules (C) / in last week. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 3, "e": "'Last week' takes no preposition: 'submitted its report ... last week'. Part D is wrong.", "st": "err"}, {"s": "English Language", "q": "One of the most important (A) / reason for the rise (B) / in household savings is (C) / the growth of SIPs. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 1, "e": "'One of the ...' is followed by a plural noun: 'one of the most important reasons'. Part B is wrong. The verb 'is' (part C) is correct because its subject is 'one'.", "st": "err"}, {"s": "English Language", "q": "Had the bank followed (A) / the guidelines, the fraud (B) / would be detected (C) / much earlier. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 2, "e": "A past unreal condition ('Had the bank followed...') needs the perfect conditional: 'would have been detected'. Part C is wrong.", "st": "err"}, {"s": "English Language", "q": "Scarcely had the market opened (A) / when the index fell (B) / by more than (C) / two per cent. (D)", "o": ["A", "B", "C", "D", "No error"], "a": 4, "e": "'Scarcely had ... when' is the correct pairing (not 'than'), and the inversion 'had the market opened' is right. There is no error.", "st": "err"}, {"s": "English Language", "q": "The RBI kept the repo rate ______ as inflation remained ______ its target band.", "o": ["steady, upon", "unchanged, within", "unchanged, beyond", "raised, within", "lowered, outside"], "a": 1, "e": "'Kept ... unchanged' fits, and inflation staying 'within' the band explains why no change was needed. 'Kept the repo rate raised' is unidiomatic; 'beyond/outside' would argue for a change.", "st": "fill"}, {"s": "English Language", "q": "Despite strong ______ in the first quarter, analysts ______ that growth could slow later in the year.", "o": ["growth, celebrated", "growth, cautioned", "decline, cautioned", "growth, denied", "losses, predicted"], "a": 1, "e": "'Despite' sets up a contrast: strong growth now, but a warning (cautioned) about a slowdown later. 'Denied that growth could slow' removes the contrast.", "st": "fill"}, {"s": "English Language", "q": "The new rules are ______ to protect small investors from ______ advice.", "o": ["meant, impartial", "unable, misleading", "designed, misleading", "intended, reliable", "designed, sound"], "a": 2, "e": "Rules are designed to protect investors from bad (misleading) advice. Protecting them from sound, reliable or impartial advice makes no sense.", "st": "fill"}, {"s": "English Language", "q": "Her ______ to detail made her the ______ choice to lead the audit team.", "o": ["indifference, obvious", "attention, unlikely", "aversion, natural", "attention, obvious", "approach, doubtful"], "a": 3, "e": "'Attention to detail' is the fixed phrase, and that quality makes her the obvious choice. 'Indifference' or 'aversion' would not qualify her.", "st": "fill"}, {"s": "English Language", "q": "The <b>collateral<\/b> (A) <b>rejected<\/b> (B) the loan application because the borrower <b>lacked<\/b> (C) adequate <b>bank<\/b> (D).", "o": ["A-D only", "A-C and B-D", "A-B only", "No interchange required", "B-C only"], "a": 0, "e": "Swapping A and D gives: 'The bank rejected the loan application because the borrower lacked adequate collateral.'", "st": "swap"}, {"s": "English Language", "q": "Investors often <b>panic<\/b> (A) when markets <b>fall<\/b> (B) sharply, <b>selling<\/b> (C) at the worst possible <b>moment<\/b> (D).", "o": ["No interchange required", "A-C only", "A-B only", "A-B and C-D", "C-D only"], "a": 0, "e": "The sentence is already correct: investors panic when markets fall, selling at the worst moment.", "st": "swap"}, {"s": "English Language", "q": "The <b>company<\/b> (A) revealed that the <b>audit<\/b> (B) had <b>inflated<\/b> (C) its reported <b>profits<\/b> (D).", "o": ["A-D only", "A-B only", "B-C only", "No interchange required", "C-D only"], "a": 1, "e": "Swapping A and B gives: 'The audit revealed that the company had inflated its reported profits.' An audit reveals; a company inflates profits.", "st": "swap"}, {"s": "English Language", "q": "Regular <b>corpus<\/b> (A) build a large <b>savings<\/b> (B) over <b>compounding<\/b> (C) through the power of <b>time<\/b> (D).", "o": ["A-B only", "A-B and C-D", "A-C and B-D", "A-D and B-C", "C-D only"], "a": 1, "e": "Swapping A-B and C-D gives: 'Regular savings build a large corpus over time through the power of compounding.' Only one swap leaves the sentence meaningless.", "st": "swap"}, {"s": "English Language", "q": "Which sentence comes FIRST after rearrangement?", "o": ["B", "A", "C", "D", "E"], "a": 0, "e": "Order: B-A-E-C-D. B introduces UPI. A ('Launched in 2016, it...') needs B's noun before it. E explains early adoption by merchants, C describes the result within a few years, and D ('Its success has since...') closes with the international spread.", "st": "pj"}, {"s": "English Language", "q": "Which sentence comes FOURTH after rearrangement?", "o": ["A", "B", "C", "D", "E"], "a": 2, "e": "Order: B-A-E-C-D, so the fourth sentence is C.", "st": "pj"}, {"s": "Quantitative Aptitude", "q": "By what percentage did agent D's sales rise from 2024 to 2025?", "o": ["75%", "50%", "33.33%", "45%", "60%"], "a": 1, "e": "D: 150 → 225. Rise = 75. 75 ÷ 150 × 100 = 50%. (33.33% wrongly divides by 225.)", "st": "bar"}, {"s": "Quantitative Aptitude", "q": "What is the ratio of the total policies sold by all five agents in 2024 to the total in 2025?", "o": ["23 : 27", "28 : 23", "23 : 28", "25 : 28", "22 : 27"], "a": 2, "e": "2024: 240 + 180 + 320 + 150 + 260 = 1,150. 2025: 300 + 270 + 280 + 225 + 325 = 1,400. 1,150 : 1,400 = 23 : 28.", "st": "bar"}, {"s": "Quantitative Aptitude", "q": "What is the average number of policies sold in 2025 by agents A, B and E together? (approximately)", "o": ["283.33", "305.67", "312.5", "298.33", "290"], "a": 3, "e": "(300 + 270 + 325) ÷ 3 = 895 ÷ 3 = 298.33.", "st": "bar"}, {"s": "Quantitative Aptitude", "q": "Agent C's sales in 2025 were what percentage LESS than its sales in 2024?", "o": ["12.5%", "14.29%", "11.11%", "40%", "10%"], "a": 0, "e": "C: 320 → 280, a fall of 40. 40 ÷ 320 × 100 = 12.5%. (14.29% wrongly divides by 280.)", "st": "bar"}, {"s": "Quantitative Aptitude", "q": "In 2025, 40% of B's policies and 20% of E's policies were term policies. How many more term policies did B sell than E?", "o": ["54", "27", "38", "65", "43"], "a": 4, "e": "B: 40% of 270 = 108. E: 20% of 325 = 65. Difference = 108 − 65 = 43.", "st": "bar"}, {"s": "Quantitative Aptitude", "q": "How many women chose Auto choice?", "o": ["60", "65", "35", "95", "70"], "a": 1, "e": "Men = 7/12 × 600 = 350; women = 250. NPS: men 40% = 140, women 40% = 100, total 240. Active = 1/3 × 240 = 80, of whom 45 are men, so 35 women. Women in Auto = 100 − 35 = 65.", "st": "cas"}, {"s": "Quantitative Aptitude", "q": "What percentage of all employees did NOT opt for NPS?", "o": ["65%", "60%", "40%", "55%", "62.5%"], "a": 1, "e": "NPS subscribers = 140 + 100 = 240. Not in NPS = 600 − 240 = 360. 360 ÷ 600 = 60%.", "st": "cas"}, {"s": "Quantitative Aptitude", "q": "What is the ratio of men who chose Auto choice to women who chose Auto choice?", "o": ["19 : 13", "19 : 14", "7 : 5", "9 : 7", "13 : 19"], "a": 0, "e": "Men in Auto = 140 − 45 = 95. Women in Auto = 65. 95 : 65 = 19 : 13.", "st": "cas"}, {"s": "Quantitative Aptitude", "q": "I. x² − 11x + 30 = 0<br>II. y² − 13y + 42 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 3, "e": "I: (x − 5)(x − 6) = 0, x = 5, 6. II: (y − 6)(y − 7) = 0, y = 6, 7. 5 < 6, 5 < 7, 6 = 6, 6 < 7, so x ≤ y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. x² + 3x − 40 = 0<br>II. y² − 14y + 48 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 1, "e": "I: (x + 8)(x − 5) = 0, x = −8, 5. II: (y − 6)(y − 8) = 0, y = 6, 8. Every x is less than every y, so x < y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. 3x² − 14x + 15 = 0<br>II. y² + 4y − 21 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 4, "e": "I: (3x − 5)(x − 3) = 0, x = 5/3, 3. II: (y + 7)(y − 3) = 0, y = −7, 3. x = 5/3 is less than y = 3 but greater than y = −7, so no single relation holds.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. x² − 16x + 64 = 0<br>II. y² − 15y + 56 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 2, "e": "I: (x − 8)² = 0, x = 8. II: (y − 7)(y − 8) = 0, y = 7, 8. 8 > 7 and 8 = 8, so x ≥ y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "I. x² + 12x + 35 = 0<br>II. y² + 17y + 72 = 0", "o": ["x > y", "x < y", "x ≥ y", "x ≤ y", "x = y or no relation can be established"], "a": 0, "e": "I: (x + 5)(x + 7) = 0, x = −5, −7. II: (y + 8)(y + 9) = 0, y = −8, −9. Every x is greater than every y, so x > y.", "st": "quad"}, {"s": "Quantitative Aptitude", "q": "A, B and C start a business. A invests ₹40,000 for 12 months, B ₹60,000 for 8 months and C ₹50,000 for 6 months. Out of a total profit of ₹63,000, what is C's share?", "o": ["₹21,000", "₹12,600", "₹15,000", "₹18,000", "₹24,000"], "a": 2, "e": "Capital × months: A = 4,80,000, B = 4,80,000, C = 3,00,000, a ratio of 16 : 16 : 10. C's share = 10/42 × 63,000 = ₹15,000.", "st": null}, {"s": "Quantitative Aptitude", "q": "The difference between compound interest (compounded annually) and simple interest on a sum for 2 years at 10% per annum is ₹150. What is the sum?", "o": ["₹12,000", "₹1,500", "₹15,000", "₹7,500", "₹30,000"], "a": 2, "e": "For 2 years, CI − SI = P × (r/100)² = P × 0.01. So P = 150 ÷ 0.01 = ₹15,000.", "st": null}, {"s": "Quantitative Aptitude", "q": "A 240 m long train crosses a pole in 12 seconds. How long will it take to cross a 360 m long platform?", "o": ["20 seconds", "18 seconds", "30 seconds", "24 seconds", "36 seconds"], "a": 2, "e": "Speed = 240 ÷ 12 = 20 m/s. To cross the platform it covers 240 + 360 = 600 m: 600 ÷ 20 = 30 seconds.", "st": null}, {"s": "Quantitative Aptitude", "q": "A can finish a work in 12 days and B in 18 days. They work on alternate days, with A starting. In how many days will the work be finished?", "o": ["15 days", "14⅓ days", "14½ days", "14 days", "7.2 days"], "a": 1, "e": "In 36 units: A does 3 a day, B does 2. Every 2 days = 5 units. After 12 days: 30 units; 6 left. Day 13 (A): 3 → 3 left. Day 14 (B): 2 → 1 left. Day 15 (A) needs 1 of his 3 units = 1/3 day. Total = 14⅓ days. (7.2 days is the time if they worked together.)", "st": null}, {"s": "Quantitative Aptitude", "q": "The perimeter of a rectangle equals the circumference of a circle of radius 14 cm. If the rectangle's length is 26 cm, what is its area? (Take π = 22/7)", "o": ["616 cm²", "504 cm²", "416 cm²", "468 cm²", "572 cm²"], "a": 3, "e": "Circumference = 2 × 22/7 × 14 = 88 cm. Rectangle: 2(26 + b) = 88, so b = 18. Area = 26 × 18 = 468 cm². (616 cm² is the circle's area.)", "st": null}, {"s": "Quantitative Aptitude", "q": "The ratio of the present ages of P and Q is 5 : 7. After 6 years, the ratio will be 3 : 4. What is Q's present age?", "o": ["35 years", "30 years", "48 years", "36 years", "42 years"], "a": 4, "e": "(5x + 6)/(7x + 6) = 3/4, so 20x + 24 = 21x + 18 and x = 6. Q = 7 × 6 = 42 years (P = 30).", "st": null}, {"s": "Quantitative Aptitude", "q": "A batsman's average after 11 innings is 42. After the 12th innings, his average becomes 45. What did he score in the 12th innings?", "o": ["78", "45", "75", "81", "87"], "a": 0, "e": "Total after 12 = 45 × 12 = 540. Total after 11 = 42 × 11 = 462. 12th innings = 540 − 462 = 78.", "st": null}, {"s": "Reasoning", "q": "Who lives in the East flat of floor 3?", "o": ["E", "B", "A", "G", "F"], "a": 4, "e": "Final arrangement (floor: West / East):<br>4: D (Pilot) / G (Banker)<br>3: B (Chef) / F (Doctor)<br>2: H (Lawyer) / A (Teacher)<br>1: E (Actor) / C (Engineer)<br><br>Key steps: C is in an East flat on an odd floor. If C were in 3-East, B would end up on floor 1 next to the Engineer, leaving no Doctor for B's floor, so C = 1-East = Engineer. H is in 2-West, A in 2-East (Teacher, since H is not). The Pilot is 4-West, and D is in a West flat above B with G on D's floor, so D = 4-West (Pilot), G = 4-East. B and E are in West flats: B on floor 3 (below D), E on floor 1. The Doctor shares B's floor, so the Doctor is in 3-East, and the remaining person there is F. The Chef is on the Doctor's floor, so B is the Chef. The Banker is East and above the Doctor: G. The Actor is West and below the Lawyer, so E is the Actor and H the Lawyer.", "st": "flat"}, {"s": "Reasoning", "q": "What is B's profession?", "o": ["Doctor", "Chef", "Banker", "Lawyer", "Actor"], "a": 1, "e": "B lives in 3-West. The Doctor is on B's floor but is not B, and the Chef is also on the Doctor's floor, so B is the Chef. See Q above for the full arrangement.", "st": "flat"}, {"s": "Reasoning", "q": "Which of the following pairs live on the same floor?", "o": ["H and F", "A and C", "D and A", "B and G", "E and C"], "a": 4, "e": "Floor 1: E (West) and C (East). The other pairs are on different floors.", "st": "flat"}, {"s": "Reasoning", "q": "Who is the Lawyer?", "o": ["D", "A", "H", "E", "F"], "a": 2, "e": "The Actor is in a West flat below the Lawyer's floor. The only professions left after placing the rest are Actor and Lawyer, for E (1-West) and H (2-West). So E is the Actor and H is the Lawyer.", "st": "flat"}, {"s": "Reasoning", "q": "Which of the following combinations is correct?", "o": ["Floor 2 – West – H – Lawyer", "Floor 3 – East – B – Doctor", "Floor 2 – East – A – Lawyer", "Floor 1 – West – C – Engineer", "Floor 4 – East – D – Pilot"], "a": 0, "e": "H lives in 2-West and is the Lawyer. D is in 4-West (Pilot), F is the Doctor in 3-East, C is in 1-East, and A is the Teacher.", "st": "flat"}, {"s": "Reasoning", "q": "Who visits in July?", "o": ["P", "T", "R", "U", "V"], "a": 3, "e": "Final order: Jan S (NPS), Mar Q (PPF), Apr V (FD), Jun P (Current), Jul U (RD), Sep T (Savings), Nov R (SSY).<br><br>P is in a 30-day month with R three places later, so P is April or June. U is right after P and Q is right before V. If P were April, U would be June and R September; Q-V would then need two consecutive slots, but S (a 31-day month, before Q) would have nowhere valid to go. So P = June, U = July, R = November. S must come before Q and be in a 31-day month: S = January, Q-V = March-April, T = September. Accounts: PPF is the 2nd slot (Q), FD is right after it (V), SSY is November (R), T = Savings. Current is in a 30-day month, followed immediately by RD: June-July, so P = Current, U = RD. S gets NPS.", "st": "month"}, {"s": "Reasoning", "q": "Which account does V open?", "o": ["NPS", "Current", "FD", "PPF", "RD"], "a": 2, "e": "V visits in April, immediately after Q (PPF, March). The FD is opened immediately after the PPF, so V opens the FD.", "st": "month"}, {"s": "Reasoning", "q": "How many persons visit between S and T?", "o": ["Three", "Four", "Two", "Five", "None"], "a": 1, "e": "S is in January (1st) and T in September (6th). Between them: Q, V, P and U. That is four.", "st": "month"}, {"s": "Reasoning", "q": "In which month does the person who opens the Current account visit?", "o": ["June", "November", "July", "April", "September"], "a": 0, "e": "The Current account is opened in a 30-day month, immediately followed by the RD. Only June-July fits once the other places are fixed. P visits in June.", "st": "month"}, {"s": "Reasoning", "q": "Which of the following combinations is correct?", "o": ["T – July – Savings", "R – November – SSY", "U – June – RD", "Q – March – FD", "S – January – PPF"], "a": 1, "e": "R visits in November and opens the SSY. S opens NPS, T visits in September, Q opens PPF, and U visits in July.", "st": "month"}, {"s": "Reasoning", "q": "Who sits second to the left of Z?", "o": ["V", "T", "X", "U", "Y"], "a": 2, "e": "Clockwise from S: S, W, Y, T, Z, V, X, U. Facing the centre, a person's left is the next seat clockwise.<br><br>Fix S. U is immediately to S's right. W is S's other neighbour (S's left). T is three seats from S (two persons between); with X third to T's left and Z second to X's right, T must be three seats clockwise from S. That gives X, then Z and V. Y fills the last seat, which is not next to Z.<br><br>Second to the left of Z: V, then X.", "st": "circ"}, {"s": "Reasoning", "q": "Who sits immediately to the right of T?", "o": ["W", "Z", "V", "Y", "S"], "a": 3, "e": "Order clockwise: S, W, Y, T, Z, V, X, U. A person's right is the previous seat clockwise. Immediately right of T is Y.", "st": "circ"}, {"s": "Reasoning", "q": "Counting from the left of S, how many persons sit between S and Z?", "o": ["Five", "Four", "Two", "Three", "One"], "a": 3, "e": "Moving left (clockwise) from S: W, Y, T, then Z. Three persons sit between them.", "st": "circ"}, {"s": "Reasoning", "q": "Who sits exactly opposite V?", "o": ["T", "Y", "S", "U", "W"], "a": 4, "e": "With 8 seats, the person opposite is 4 seats away. Order: S, W, Y, T, Z, V, X, U. V is in seat 6 and W in seat 2, so W is opposite V.", "st": "circ"}, {"s": "Reasoning", "q": "Four of the following five pairs are alike in a certain way based on the arrangement. Which pair does NOT belong?", "o": ["S, W", "Z, V", "X, U", "T, Y", "Y, T"], "a": 3, "e": "In S-W, Y-T, Z-V and X-U, the second person sits immediately to the LEFT of the first. In T-Y, Y sits immediately to the RIGHT of T, so it is the odd one.", "st": "circ"}, {"s": "Reasoning", "q": "How many steps are needed to complete the arrangement for the given input?", "o": ["Four", "Seven", "Five", "Six", "Three"], "a": 2, "e": "Logic: in each step, the smallest remaining odd number moves to the left side (after the numbers already arranged), and the largest remaining even number moves to the right side (before those already arranged).<br>Step 1: 19 37 62 53 26 91 48 75 30 84<br>Step 2: 19 37 53 26 91 48 75 30 62 84<br>Step 3: 19 37 53 26 91 75 30 48 62 84<br>Step 4: 19 37 53 75 26 91 30 48 62 84<br>Step 5: 19 37 53 75 91 26 30 48 62 84<br>So five steps.", "st": "io"}, {"s": "Reasoning", "q": "In Step 3, which number is fourth from the right end?", "o": ["30", "48", "75", "91", "62"], "a": 0, "e": "Step 3: 19 37 53 26 91 75 30 48 62 84. From the right: 84, 62, 48, 30. The fourth is 30.", "st": "io"}, {"s": "Reasoning", "q": "Which step reads '19 37 53 75 26 91 30 48 62 84'?", "o": ["Step 3", "Step 2", "Step 5", "No such step", "Step 4"], "a": 4, "e": "In Step 4, 75 (the fourth smallest odd number) joins the left side and 30 (the fourth largest even number) joins the right side, giving exactly this line.", "st": "io"}, {"s": "Reasoning", "q": "In Step 2, what is the sum of the third number from the left and the second number from the right?", "o": ["99", "112", "121", "115", "137"], "a": 3, "e": "Step 2: 19 37 53 26 91 48 75 30 62 84. Third from the left = 53; second from the right = 62. 53 + 62 = 115.", "st": "io"}, {"s": "Reasoning", "q": "In the last step, how many numbers lie between 75 and 48?", "o": ["Two", "Three", "One", "Five", "Four"], "a": 1, "e": "Last step: 19 37 53 75 91 26 30 48 62 84. Between 75 and 48: 91, 26 and 30. That is three numbers.", "st": "io"}, {"s": "Reasoning", "q": "<b>Statements:<\/b> Only a few Pensions are Annuities. All Annuities are Plans. No Plan is a Loan.<br><b>Conclusions:<\/b><br>I. Some Pensions are not Loans.<br>II. All Pensions being Plans is a possibility.", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 4, "e": "I: Some Pensions are Annuities, all Annuities are Plans, and no Plan is a Loan, so those Pensions are not Loans. Follows.<br>II: 'Only a few Pensions are Annuities' means some Pensions are not Annuities, but those can still be Plans. So all Pensions being Plans is possible. Follows.<br>Both follow.", "st": "syl"}, {"s": "Reasoning", "q": "<b>Statements:<\/b> Some Coins are Notes. No Note is a Card. All Cards are Wallets.<br><b>Conclusions:<\/b><br>I. Some Coins are not Cards.<br>II. Some Notes are Wallets.", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 0, "e": "I: The Coins that are Notes cannot be Cards. Follows.<br>II: Notes are kept out of Cards, but Notes and Wallets may or may not overlap. Not definite.<br>Only I follows.", "st": "syl"}, {"s": "Reasoning", "q": "<b>Statements:<\/b> All Funds are Schemes. Some Schemes are Bonds.<br><b>Conclusions:<\/b><br>I. Some Funds are Bonds.<br>II. No Fund is a Bond.", "o": ["Only I follows", "Only II follows", "Either I or II follows", "Neither I nor II follows", "Both I and II follow"], "a": 2, "e": "Funds and Bonds have no definite relation, so neither conclusion is certain on its own. But 'Some Funds are Bonds' and 'No Fund is a Bond' are a complementary pair with the same terms: one of them must be true. Either I or II follows.", "st": "syl"}, {"s": "Reasoning", "q": "<b>Argument:<\/b> The city should replace its diesel bus fleet with electric buses, because electric buses have lower running costs.<br>Which of the following, if true, most WEAKENS the argument?", "o": ["Electric buses need fewer engine parts to be replaced", "Electric buses produce less noise than diesel buses", "The price of diesel has risen sharply this year", "Most of the city's electricity comes from costly diesel generators, so electric buses would cost more per km to run than its diesel buses", "Several other cities have switched to electric buses"], "a": 3, "e": "The argument rests on electric buses being cheaper to run. If the city's power is so expensive that they cost more per km, the key premise fails. Options B and C are irrelevant to cost; D and E strengthen the argument.", "st": null}, {"s": "Reasoning", "q": "<b>Argument:<\/b> Banks that adopted AI-based fraud detection last year reported lower fraud losses this year than banks that did not. Therefore, AI-based fraud detection reduces fraud losses.<br>Which of the following, if true, most STRENGTHENS the argument?", "o": ["Some banks that adopted AI tools also hired more fraud investigators", "The banks that adopted AI tools were larger than the other banks", "AI tools are expensive to install", "Before adoption, the banks that adopted the AI tools had fraud losses similar to those of other banks", "Fraud losses fell across the whole banking sector this year"], "a": 3, "e": "The conclusion claims cause and effect. If both groups had similar losses before adoption, a pre-existing difference cannot explain the gap, so the AI tools become the likely cause. Options C and E suggest other causes and weaken the argument.", "st": null}, {"s": "Reasoning", "q": "<b>Statement:<\/b> Over the past five years, the number of NPS subscribers from the unorganised sector has grown at a faster rate than the number from the organised sector.<br>Which of the following can be inferred?", "o": ["Organised-sector subscribers have been leaving NPS", "Unorganised-sector workers earn more than organised-sector workers", "The share of unorganised-sector subscribers in total NPS subscribers has risen over the five years", "There are now more unorganised-sector subscribers than organised-sector subscribers", "The total number of NPS subscribers has fallen"], "a": 2, "e": "If one group grows faster than the other, its share of the total must rise. We cannot infer absolute numbers (B), exits (C), incomes (D) or a fall in the total (E).", "st": null}, {"s": "Reasoning", "q": "In a certain code, PENSION is written as OPJTOFQ. How is ANNUITY written in that code?", "o": ["ZTJVPOB", "ZUJVOOB", "YTIUNNA", "BOOVJUZ", "ZUJVOOA"], "a": 1, "e": "The word is reversed and each letter is moved one place forward. PENSION reversed is NOISNEP, which becomes OPJTOFQ. ANNUITY reversed is YTIUNNA, which becomes ZUJVOOB.", "st": null}, {"s": "Reasoning", "q": "Study the arrangement: <b>K 7 # M 3 P @ 5 Q 8 $ 2 R % 9 T &amp; 4 U<\/b><br>How many numbers are immediately preceded by a symbol and immediately followed by a letter?", "o": ["One", "Three", "Two", "Five", "Four"], "a": 4, "e": "Check each number: 7 (K before), no. 3 (M before), no. 5 (@ before, Q after), yes. 8 (Q before), no. 2 ($ before, R after), yes. 9 (% before, T after), yes. 4 (&amp; before, U after), yes. Total: four.", "st": null}, {"s": "Reasoning", "q": "Among five friends, A is heavier than B but lighter than C. D is heavier than C. E is lighter than B. Who is the second heaviest?", "o": ["A", "B", "E", "D", "C"], "a": 4, "e": "D > C > A > B > E. The second heaviest is C.", "st": null}, {"s": "Reasoning", "q": "If the digits of the number 7394628 are arranged in ascending order from left to right, how many digits will remain in the same position?", "o": ["Four", "Three", "Two", "None", "One"], "a": 4, "e": "Original: 7 3 9 4 6 2 8. Ascending: 2 3 4 6 7 8 9. Only the second digit (3) stays in place. One digit.", "st": null}, {"s": "General Awareness", "q": "Where were the 23rd Commonwealth Games (2026) held?", "o": ["Birmingham, England", "Edinburgh, Scotland", "Glasgow, Scotland", "Ahmedabad, India", "Gold Coast, Australia"], "a": 2, "e": "CWG 2026 was held in Glasgow, the fourth time Scotland hosted. Trap: Ahmedabad will host the Centenary Games in 2030; Birmingham hosted 2022.", "st": null}, {"s": "General Awareness", "q": "The World Competitiveness Ranking, in which India ranked 44th in 2026, is published by:", "o": ["International Institute for Management Development (IMD)", "World Bank", "UNCTAD", "World Economic Forum", "International Monetary Fund"], "a": 0, "e": "The World Competitiveness Ranking is published by IMD, a business school in Switzerland. India ranked 44th of 70 economies in 2026. Trap: the WEF publishes the Global Competitiveness Report, a different report.", "st": null}, {"s": "General Awareness", "q": "Which country won the 2026 Men's FIH Hockey World Cup?", "o": ["Spain", "Belgium", "Germany", "Netherlands", "India"], "a": 2, "e": "Germany beat Spain 1–0 in the final at Wavre, Belgium. Belgium and the Netherlands were joint hosts.", "st": null}, {"s": "General Awareness", "q": "Exercise Pitch Black, in which the Indian Air Force took part in 2026, is hosted by:", "o": ["Royal Saudi Air Force", "United States Air Force", "Royal Air Force (UK)", "Royal Australian Air Force", "French Air and Space Force"], "a": 3, "e": "Pitch Black is the RAAF's biennial multinational air combat exercise, flown from Darwin and Tindal in northern Australia.", "st": null}, {"s": "General Awareness", "q": "Who became the first Indian woman to win the COSPAR Vikram Sarabhai Medal (2026)?", "o": ["Gagandeep Kang", "Ritu Karidhal", "Tessy Thomas", "Varsha Ashok Aglawe", "Prof. Annapurni Subramaniam"], "a": 4, "e": "Prof. Annapurni Subramaniam, Director of the Indian Institute of Astrophysics, Bengaluru, won the 2026 COSPAR Vikram Sarabhai Medal.", "st": null}, {"s": "General Awareness", "q": "The UN General Assembly has designated 2026 as the International Year of:", "o": ["The Woman Farmer", "Quantum Science and Technology", "Camelids", "Cooperatives", "Millets"], "a": 0, "e": "2026 is the International Year of the Woman Farmer. Traps: Millets 2023, Camelids 2024, Cooperatives and Quantum Science 2025.", "st": null}, {"s": "General Awareness", "q": "Which country became the 10th member of the New Development Bank, effective 5 June 2026?", "o": ["Uzbekistan", "Saudi Arabia", "Kazakhstan", "Argentina", "Indonesia"], "a": 0, "e": "Uzbekistan became the NDB's 10th member and its first from Central Asia. The NDB is headquartered in Shanghai and headed by Dilma Rousseff.", "st": null}, {"s": "General Awareness", "q": "Where was the 52nd G7 Summit (2026) held?", "o": ["Kananaskis, Canada", "Evian-les-Bains, France", "Hiroshima, Japan", "Cornwall, United Kingdom", "Apulia, Italy"], "a": 1, "e": "France hosted the 2026 G7 Summit at Evian-les-Bains. Traps: Kananaskis 2025, Apulia 2024, Hiroshima 2023.", "st": null}, {"s": "General Awareness", "q": "Who became the first woman Director General of the Geological Survey of India?", "o": ["Deepti Gaur Mukerjee", "Shabnam Sinha", "Monisha Chakraborty", "Varsha Ashok Aglawe", "Annapurni Subramaniam"], "a": 3, "e": "Varsha Ashok Aglawe took charge as the 54th DG of the GSI (HQ Kolkata). Monisha Chakraborty became an RBI Executive Director, and Shabnam Sinha became Chairperson of Airtel Payments Bank.", "st": null}, {"s": "General Awareness", "q": "Under the RBI (Statutory Audit) Directions, 2026, banks and NBFCs above what asset size must be audited jointly by at least two audit firms?", "o": ["₹25,000 crore", "₹1,00,000 crore", "₹10,000 crore", "₹15,000 crore", "₹5,000 crore"], "a": 3, "e": "Banks and NBFCs with assets of ₹15,000 crore or more must undergo a joint audit by at least two audit firms.", "st": null}, {"s": "General Awareness", "q": "Under the RBI's 2026 cybersecurity direction const KEY = "pfrda-mock:" + DATA.id;
const L = ["A","B","C","D","E"];
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app");
let S = null; // state
let tick = null;

function load(){ try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function secOf(q){ return DATA.sections.find(s => s.name === q.s); }
function markOf(q){ const s = secOf(q); return s.marks / s.n; }
function fmt(n){ return (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,""); }
function fmtT(ms){ ms = Math.max(0, ms); const t = Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); }
function esc(t){ const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* ---------- start screen ---------- */
function startScreen(){
  clearInterval(tick);
  const prev = load();
  const total = DATA.qs.length;
  const rows = DATA.sections.map(s => `<tr><td>${s.name}</td><td class="r num">${s.n}</td><td class="r num">${s.marks}</td><td class="r num">${fmt(s.marks/s.n)}</td><td class="r num">−${fmt(s.marks/s.n*DATA.neg)}</td></tr>`).join("");
  let resume = "";
  if (prev && prev.phase === "test") resume = `<button class="btn primary" id="resume">Resume attempt (${fmtT(prev.deadline - Date.now())} left)</button>`;
  if (prev && prev.phase === "done") resume = `<button class="btn primary" id="seeres">See last result</button>`;
  app.innerHTML = `<div class="wrap start">
    <div class="panel">
      <div class="eyebrow">PFRDA Grade A 2026 · Phase I</div>
      <h1 style="margin-top:6px">${DATA.title}</h1>
      <p class="note" style="margin:8px 0 14px">${DATA.blurb}</p>
      <dl class="facts">
        <div><dt>Questions</dt><dd class="num">${total}</dd></div>
        <div><dt>Marks</dt><dd class="num">${DATA.sections.reduce((a,s)=>a+s.marks,0)}</dd></div>
        <div><dt>Time</dt><dd class="num">${DATA.minutes} min</dd></div>
        <div><dt>Wrong answer</dt><dd>−¼ of its marks</dd></div>
      </dl>
    </div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">Sections</div>
      <div class="tbl"><table class="sec"><tr><th>Section</th><th class="r">Qs</th><th class="r">Marks</th><th class="r">Per Q</th><th class="r">Wrong</th></tr>${rows}</table></div>
      <p class="note" style="margin:10px 0 0">One timer for the whole paper, with no sectional timing, as in the real exam. You can move between sections freely. The test submits itself when time runs out.</p>
    </div>
    <div class="row">${resume}<button class="btn ${resume ? "" : "primary"}" id="go">${prev ? "Start a fresh attempt" : "Start test"}</button></div>
  </div>`;
  $("#go").onclick = () => { S = { phase:"test", deadline: Date.now() + DATA.minutes*60000, started: Date.now(), cur:0, ans:Array(total).fill(null), flag:Array(total).fill(false), seen:Array(total).fill(false) }; save(); testScreen(); };
  if ($("#resume")) $("#resume").onclick = () => { S = prev; if (S.deadline <= Date.now()) { finish(); } else testScreen(); };
  if ($("#seeres")) $("#seeres").onclick = () => { S = prev; resultScreen(); };
}

/* ---------- test screen ---------- */
function testScreen(){
  app.innerHTML = `<div class="bar"><div class="bar-in"><div class="t">${DATA.short}</div><div class="timer" id="timer">--:--</div><button class="btn" id="palbtn" style="min-height:36px;padding:6px 10px">Questions</button></div>
    <div class="chips" id="chips"></div></div>
    <div class="wrap"><div id="q"></div></div>
    <div class="foot"><div class="foot-in">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn primary" id="next">Save &amp; next →</button>
      <button class="btn" id="flag">Mark for review</button>
      <button class="btn ghost" id="clear">Clear answer</button>
    </div></div>
    <div id="sheet"></div>`;
  $("#prev").onclick = () => go(S.cur - 1);
  $("#next").onclick = () => go(S.cur + 1);
  $("#flag").onclick = () => { S.flag[S.cur] = !S.flag[S.cur]; save(); if (S.flag[S.cur]) go(S.cur + 1); else renderQ(); };
  $("#clear").onclick = () => { S.ans[S.cur] = null; save(); renderQ(); };
  $("#palbtn").onclick = openPalette;
  renderQ();
  clearInterval(tick); tick = setInterval(tickFn, 500); tickFn();
}
function tickFn(){
  const left = S.deadline - Date.now();
  const t = $("#timer"); if (!t) return;
  t.textContent = fmtT(left);
  t.classList.toggle("low", left < 5*60000);
  if (left <= 0) finish();
}
function go(i){ if (i < 0 || i >= DATA.qs.length) { if (i >= DATA.qs.length) openPalette(); return; } S.cur = i; save(); renderQ(); window.scrollTo(0,0); }
function renderQ(){
  const i = S.cur, q = DATA.qs[i];
  S.seen[i] = true; save();
  $("#chips").innerHTML = DATA.sections.map(s => `<button class="chip" data-s="${esc(s.name)}" aria-pressed="${s.name===q.s}">${s.name}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => go(DATA.qs.findIndex(x => x.s === b.dataset.s)));
  const act = $("#chips [aria-pressed=true]"); if (act) act.scrollIntoView({inline:"nearest", block:"nearest"});
  const stem = q.st ? `<details class="stem" open><summary>Directions / passage</summary><div class="stem-body">${DATA.stems[q.st]}</div></details>` : "";
  $("#q").innerHTML = `<div class="qhead"><div><span class="eyebrow">${q.s}</span><h2 class="num" style="font-size:18px;margin-top:2px">Question ${i+1} <span class="note">of ${DATA.qs.length}</span></h2></div>
     <div class="marks num">+${fmt(markOf(q))} / −${fmt(markOf(q)*DATA.neg)}${S.flag[i] ? ' · <span class="pill" style="background:var(--flag-soft);color:var(--flag)">Marked</span>' : ""}</div></div>
     ${stem}<p class="qtext">${q.q}</p>
     <div class="opts" role="radiogroup">${q.o.map((o,k) => `<button class="opt" role="radio" aria-checked="${S.ans[i]===k}" data-k="${k}"><span class="k">${L[k]}</span><span>${o}</span></button>`).join("")}</div>`;
  $("#q").querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; S.ans[i] = (S.ans[i] === k ? null : k); save(); renderQ(); });
  $("#flag").textContent = S.flag[i] ? "Unmark" : "Mark for review";
  $("#prev").disabled = i === 0;
  $("#next").textContent = i === DATA.qs.length - 1 ? "Review & submit" : "Save & next →";
}
function openPalette(){
  const answered = S.ans.filter(a => a !== null).length;
  const flagged = S.flag.filter(Boolean).length;
  const groups = DATA.sections.map(s => {
    const btns = DATA.qs.map((q,i) => q.s === s.name ? i : -1).filter(i => i >= 0).map(i => {
      const cls = S.flag[i] ? "st-flag" : S.ans[i] !== null ? "st-ans" : S.seen[i] ? "st-seen" : "";
      return `<button class="${cls} ${i===S.cur?"st-cur":""}" data-i="${i}">${i+1}</button>`; }).join("");
    return `<div class="pal-sec">${s.name}</div><div class="pal">${btns}</div>`; }).join("");
  $("#sheet").innerHTML = `<div class="sheet" id="sh"><div class="sheet-in" role="dialog" aria-label="Question palette">
     <div class="row" style="justify-content:space-between;align-items:center"><h3>Questions</h3><button class="btn" id="shx" style="min-height:36px">Close</button></div>
     <div class="legend"><span><i class="st-ans"></i>Answered</span><span><i class="st-flag"></i>Marked for review</span><span><i class="st-seen"></i>Seen, not answered</span><span><i></i>Not visited</span></div>
     ${groups}
     <div class="confirm"><p style="margin:0 0 10px"><b class="num">${answered}</b> of ${DATA.qs.length} answered${flagged ? `, <b class="num">${flagged}</b> marked for review (marked answers still count)` : ""}. <span class="num">${fmtT(S.deadline-Date.now())}</span> left.</p>
       <div class="row"><button class="btn danger" id="sub1">Submit test</button></div><div id="sub2"></div></div>
  </div></div>`;
  $("#shx").onclick = () => $("#sheet").innerHTML = "";
  $("#sh").onclick = e => { if (e.target.id === "sh") $("#sheet").innerHTML = ""; };
  $("#sheet").querySelectorAll(".pal button").forEach(b => b.onclick = () => { $("#sheet").innerHTML = ""; go(+b.dataset.i); });
  $("#sub1").onclick = () => { $("#sub2").innerHTML = `<p class="note" style="margin:10px 0">You can't change answers after submitting. Submit now?</p><div class="row"><button class="btn danger" id="subyes">Yes, submit</button><button class="btn" id="subno">Keep going</button></div>`;
    $("#subyes").onclick = finish; $("#subno").onclick = () => $("#sub2").innerHTML = ""; };
}
function finish(){
  clearInterval(tick);
  S.phase = "done"; S.ended = Math.min(Date.now(), S.deadline); save();
  resultScreen();
}

/* ---------- results ---------- */
function grade(){
  const per = DATA.sections.map(s => ({ name:s.name, n:s.n, max:s.marks, c:0, w:0, u:0, score:0 }));
  DATA.qs.forEach((q,i) => { const p = per.find(x => x.name === q.s), m = markOf(q), a = S.ans[i];
    if (a === null) p.u++; else if (a === q.a) { p.c++; p.score += m; } else { p.w++; p.score -= m*DATA.neg; } });
  return per;
}
let filter = "all";
function resultScreen(){
  clearInterval(tick);
  const per = grade();
  const tot = per.reduce((a,p) => a + p.score, 0), max = per.reduce((a,p) => a + p.max, 0);
  const c = per.reduce((a,p) => a+p.c, 0), w = per.reduce((a,p) => a+p.w, 0), u = per.reduce((a,p) => a+p.u, 0);
  const used = Math.round(((S.ended||Date.now()) - S.started)/60000);
  const rows = per.map(p => `<tr><td>${p.name}</td><td class="r num">${p.c}</td><td class="r num">${p.w}</td><td class="r num">${p.u}</td><td class="r num"><b>${fmt(p.score)}</b>/${p.max}</td><td class="r num">${p.c+p.w ? Math.round(p.c/(p.c+p.w)*100)+"%" : "–"}</td></tr>`).join("");
  app.innerHTML = `<div class="wrap start">
    <div class="panel"><div class="eyebrow">${DATA.short} · Result</div>
      <div class="score" style="margin-top:6px"><span class="big">${fmt(tot)}</span><span class="note num">/ ${max} marks</span></div>
      <div class="row" style="margin-top:8px"><span class="pill p-ok num">${c} correct</span><span class="pill p-bad num">${w} wrong (−${fmt(per.reduce((a,p)=>a+p.w*(p.max/p.n)*DATA.neg,0))})</span><span class="pill p-skip num">${u} not attempted</span><span class="pill num" style="background:var(--accent-soft);color:var(--accent)">${used} of ${DATA.minutes} min used</span></div>
      <p class="note" style="margin:10px 0 0">Your target is about 40 per paper. PFRDA sets a cut-off for each paper plus an aggregate cut-off, so use the section table to find where marks leak.</p>
    </div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">By section</div>
      <div class="tbl"><table class="sec"><tr><th>Section</th><th class="r">✓</th><th class="r">✗</th><th class="r">–</th><th class="r">Score</th><th class="r">Accuracy</th></tr>${rows}</table></div></div>
    <div class="panel" style="padding:14px"><div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">Answers &amp; explanations</div>
      <div class="row" id="filt">${["all","wrong","skipped","correct"].map(f => `<button class="chip" data-f="${f}" aria-pressed="${filter===f}">${{all:"All",wrong:"Wrong",skipped:"Not attempted",correct:"Correct"}[f]}</button>`).join("")}</div></div>
      <div class="rev" id="rev"></div></div>
    <div class="row"><button class="btn" id="again">Retake this mock</button></div>
  </div>`;
  $("#filt").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; resultScreen(); });
  $("#again").onclick = () => { wipe(); S = null; filter = "all"; startScreen(); };
  const list = DATA.qs.map((q,i) => ({q,i})).filter(({q,i}) => { const a = S.ans[i];
    return filter==="all" || (filter==="wrong" && a!==null && a!==q.a) || (filter==="skipped" && a===null) || (filter==="correct" && a===q.a); });
  $("#rev").innerHTML = list.length ? list.map(({q,i}) => { const a = S.ans[i];
    const tag = a===null ? '<span class="pill p-skip">Not attempted</span>' : a===q.a ? '<span class="pill p-ok">Correct</span>' : '<span class="pill p-bad">Wrong</span>';
    const stem = q.st ? `<details class="stem"><summary>Directions / passage</summary><div class="stem-body">${DATA.stems[q.st]}</div></details>` : "";
    return `<div class="panel rq"><div class="qhead"><span class="eyebrow">Q${i+1} · ${q.s}</span>${tag}</div>${stem}<p class="qtext" style="font-size:16px">${q.q}</p>
      <div class="opts">${q.o.map((o,k) => `<div class="opt ${k===q.a?"right":(k===a?"wrong":"")}"><span class="k">${L[k]}</span><span>${o}${k===q.a?" ✓":""}${k===a&&k!==q.a?" (your answer)":""}</span></div>`).join("")}</div>
      <div class="exp"><b>Answer: ${L[q.a]}.</b> ${q.e}</div></div>`; }).join("") : '<p class="note">No questions in this filter.</p>';
}

/* boot */
(function(){ const prev = load();
  if (prev && prev.phase === "test" && prev.deadline > Date.now()) { S = prev; testScreen(); }
  else if (prev && prev.phase === "test") { S = prev; finish(); }
  else startScreen(); })();
</script>

</body>
</html>
